<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คิวบริการสปา | Premium Spa Queue Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;500;600;700&family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>

:root{
  --cream-0:#fbf7ef;
  --cream-1:#f5ecdf;
  --cream-2:#eadbc8;
  --brown-900:#4f3424;
  --brown-800:#5d3d2a;
  --brown-700:#6e4b35;
  --brown-600:#806047;
  --brown-500:#96765c;
  --gold:#c6a04e;
  --gold-soft:#e2c67f;
  --green:#3f7753;
  --green-bg:#e8f2e9;
  --red:#ac5b44;
  --red-bg:#f6e7e2;
  --blue:#58789b;
  --off-bg:#ebe7e1;
  --line:rgba(91,61,41,.11);
  --glass:rgba(255,251,244,.86);
  --shadow:0 24px 60px -38px rgba(70,43,26,.42);
  --font-th:'Noto Serif Thai',Tahoma,sans-serif;
  --font-en:'Inter',Arial,sans-serif;
  --font-clock:'Playfair Display','Times New Roman',serif;
}

*{box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}
body{
  font-family:var(--font-th);
  color:#33231a;
  background:var(--cream-1);
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}
button{font:inherit}

/* ===== Background ===== */
.v22-bg{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:0;
  background:
    radial-gradient(900px 600px at 22% 5%,rgba(255,255,255,.88),transparent 68%),
    linear-gradient(135deg,var(--cream-0),var(--cream-2));
}
.v32-ambient-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  opacity:.52;
  mix-blend-mode:screen;
  z-index:1;
}
.v32-light-ribbon{
  position:absolute;
  z-index:2;
  width:125%;
  height:38%;
  left:-14%;
  top:20%;
  pointer-events:none;
  background:linear-gradient(
    108deg,
    transparent 19%,
    rgba(255,250,231,.07) 37%,
    rgba(255,246,214,.20) 50%,
    rgba(207,166,92,.07) 62%,
    transparent 79%
  );
  filter:blur(18px);
  animation:bgRibbon 22s ease-in-out infinite;
}
.v22-bg-photo{
  position:absolute;
  inset:-4%;
  z-index:1;
  background:
    radial-gradient(160px 100px at 16% 78%,rgba(126,105,77,.13),transparent 74%),
    radial-gradient(210px 120px at 85% 73%,rgba(116,100,75,.10),transparent 74%),
    radial-gradient(90px 170px at 7% 47%,rgba(101,128,94,.10),transparent 72%),
    radial-gradient(100px 200px at 94% 43%,rgba(104,132,96,.08),transparent 72%),
    linear-gradient(115deg,rgba(255,255,255,.10),rgba(211,183,144,.08));
  transform:scale(1.04);
  animation:bgPan 34s ease-in-out infinite alternate;
}
.v22-bg-wash{
  position:absolute;
  inset:0;
  z-index:3;
  background:
    radial-gradient(820px 500px at var(--v32-light-x,25%) var(--v32-light-y,18%),rgba(255,252,241,.72),transparent 68%),
    radial-gradient(700px 450px at 82% 20%,rgba(211,173,96,.12),transparent 72%),
    linear-gradient(180deg,rgba(255,252,246,.16),rgba(238,226,208,.14));
  animation:bgBreath 16s ease-in-out infinite alternate;
}
.v22-orb{
  position:absolute;
  z-index:2;
  border-radius:50%;
  filter:blur(60px);
  opacity:.22;
}
.orb-a{
  width:430px;height:430px;left:-140px;bottom:-160px;
  background:rgba(198,160,82,.38);
  animation:orbA 22s ease-in-out infinite alternate;
}
.orb-b{
  width:390px;height:390px;right:-130px;top:-150px;
  background:rgba(255,244,208,.68);
  animation:orbB 25s ease-in-out infinite alternate;
}
@keyframes bgPan{
  from{transform:scale(1.04) translate3d(-.6%,0,0)}
  to{transform:scale(1.075) translate3d(.9%,-.7%,0)}
}
@keyframes bgBreath{
  from{opacity:.90;transform:scale(1)}
  to{opacity:1;transform:scale(1.015)}
}
@keyframes bgRibbon{
  0%,18%{transform:translateX(-28%) rotate(-3deg);opacity:.12}
  42%{opacity:.50}
  64%{transform:translateX(18%) rotate(0deg);opacity:.30}
  100%{transform:translateX(30%) rotate(2deg);opacity:.08}
}
@keyframes orbA{
  from{transform:translate3d(0,0,0) scale(.96)}
  to{transform:translate3d(90px,-55px,0) scale(1.08)}
}
@keyframes orbB{
  from{transform:translate3d(0,0,0) scale(1)}
  to{transform:translate3d(-70px,60px,0) scale(1.08)}
}

/* ===== Main layout ===== */
.v22-shell{
  position:relative;
  z-index:10;
  width:100vw;
  height:100vh;
  padding:18px 24px;
  display:grid;
  grid-template-rows:104px minmax(0,1fr) 64px;
  gap:14px;
}

/* ===== Header ===== */
.v22-header{
  display:grid;
  grid-template-columns:142px minmax(0,1fr) 198px;
  align-items:center;
  gap:18px;
  min-height:0;
}
.v22-brand{
  width:132px;
  height:80px;
  padding:8px 11px;
  border-radius:17px;
  background:rgba(255,251,244,.88);
  border:1px solid var(--line);
  box-shadow:0 16px 36px -27px rgba(70,43,26,.38);
  backdrop-filter:blur(10px);
}
.v22-brand img{width:100%;height:100%;object-fit:contain}
.v22-heading{
  justify-self:center;
  width:min(760px,100%);
  text-align:center;
  min-width:0;
  padding:7px 22px 9px;
  border-radius:20px;
  background:rgba(255,250,242,.24);
  border:1px solid rgba(119,86,55,.05);
  backdrop-filter:blur(4px);
}
.v22-kicker{
  color:#a07d55;
  font-family:var(--font-en);
  font-size:9px;
  font-weight:700;
  letter-spacing:4.5px;
  margin-bottom:2px;
}
.v22-title{
  font-size:clamp(28px,3.1vw,42px);
  line-height:1.12;
  font-weight:700;
  color:var(--brown-800);
  min-height:48px;
}
.v22-title .lang-en-text{
  font-family:var(--font-en);
  font-weight:700;
  letter-spacing:.01em;
}
.v22-sub{
  min-height:23px;
  margin-top:3px;
  font-size:11.5px;
  font-weight:600;
  color:#75604e;
}
.v22-clock{
  justify-self:end;
  width:192px;
  padding:9px 14px 10px;
  border-radius:18px;
  text-align:center;
  color:#efd696;
  background:linear-gradient(145deg,#64442f,#765239);
  border:1px solid rgba(239,214,149,.11);
  box-shadow:0 18px 38px -28px rgba(61,38,23,.48),inset 0 1px 0 rgba(255,247,219,.06);
}
.v22-time{
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font-clock);
  font-size:33px;
  font-weight:600;
  line-height:.95;
  letter-spacing:.01em;
  font-variant-numeric:lining-nums tabular-nums;
  color:#f1dda5;
}
.v22-time #clockHour,.v22-time #clockMinute{min-width:2.05ch;text-align:center}
.v22-colon{margin:0 .06em;animation:colon 1.6s steps(1,end) infinite}
.v22-date{margin-top:5px;font-family:var(--font-en);font-size:10px;color:#ead7a3}
.v22-hours{margin-top:3px;font-family:var(--font-en);font-size:8px;letter-spacing:1.2px;color:#d9bd79}
@keyframes colon{0%,52%{opacity:1}53%,100%{opacity:.35}}

/* ===== Language system: zero-overlap, two-phase fade ===== */
.lang-pair{display:inline-block}
.lang-pair-block{display:block;width:100%}
.lang-en-text{display:none!important}
body.language-en .lang-th-text{display:none!important}
body.language-en .lang-en-text{display:inline!important}
body.language-en .lang-pair-block>.lang-en-text{display:block!important}
body:not(.language-en) .lang-pair-block>.lang-th-text{display:block!important}
.lang-pair,.lang-pair-block{
  transition:opacity .18s ease,transform .18s ease,filter .18s ease;
}
body.language-fading .lang-pair,
body.language-fading .lang-pair-block{
  opacity:0;
  transform:translateY(-4px);
  filter:blur(2px);
}

/* ===== Scene ===== */
.v22-scene{
  position:relative;
  min-height:0;
  display:grid;
}
.v22-loading{
  place-self:center;
  padding:13px 18px;
  border-radius:14px;
  background:var(--glass);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  color:#76604e;
}

/* Pre-open / after-hours */
.v22-preopen,.v22-afterhours,.v22-message-scene{place-items:center}
.v22-preopen-card,.v22-message-card{
  width:min(690px,78vw);
  padding:38px 48px;
  text-align:center;
  border-radius:27px;
  background:rgba(255,251,244,.88);
  border:1px solid var(--line);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.70);
  backdrop-filter:blur(13px) saturate(1.02);
}
.v22-preopen-title,.v22-message-title{
  font-size:clamp(27px,2.8vw,39px);
  font-weight:700;
  line-height:1.18;
  color:var(--brown-800);
}
.v22-preopen-bigtime{
  margin-top:13px;
  font-family:var(--font-clock);
  font-size:clamp(60px,6.2vw,84px);
  line-height:.98;
  color:#bd9446;
  text-shadow:0 2px 10px rgba(105,70,34,.07);
}
.v22-preopen-sub{margin-top:7px;font-size:14px;color:#755d49}
.v22-preopen-countdown{
  display:inline-flex;
  margin-top:14px;
  padding:8px 13px;
  border-radius:999px;
  background:rgba(236,220,185,.70);
  color:#745b36;
  font-size:12px;
  font-weight:700;
}
.v22-preopen-line{
  width:68%;
  height:1px;
  margin:21px auto 16px;
  background:linear-gradient(90deg,transparent,rgba(193,151,67,.45),transparent);
}
.v22-preopen-note,.v22-message-sub{font-size:12px;color:#806d59;line-height:1.55}
.v22-message-icon{font-size:22px;color:var(--gold);margin-bottom:7px}

/* Open state */
.v22-open{align-items:stretch}
.v22-grid{
  min-height:0;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}
.v22-card{
  min-height:0;
  display:grid;
  grid-template-rows:88px minmax(0,1fr);
  overflow:hidden;
  border-radius:21px;
  background:rgba(255,251,244,.91);
  border:1px solid var(--line);
  box-shadow:0 20px 52px -34px rgba(70,43,26,.40);
  backdrop-filter:blur(10px) saturate(1.02);
  animation:cardIn .45s ease both;
}
.v22-card-head{
  display:grid;
  grid-template-columns:58px minmax(0,1fr) auto;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  background:linear-gradient(135deg,#664631,#79563e);
  color:#fff;
}
.v22-avatar{
  width:52px;height:52px;
  border-radius:50%;
  overflow:hidden;
  background:#e8d6a1;
  border:2px solid rgba(235,210,145,.72);
  box-shadow:0 0 0 4px rgba(207,169,84,.07);
}
.v22-avatar img,.v22-avatar svg{width:100%;height:100%;object-fit:cover}
.v22-person{min-width:0}
.v22-name-th{font-size:19px;font-weight:700;line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v22-name-en{margin-top:3px;font-family:var(--font-en);font-size:9.5px;color:#e4cd91;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v22-badge{
  padding:7px 9px;
  border-radius:999px;
  background:#f5eee4;
  color:#654a35;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}
.state-available .v22-badge{background:var(--green-bg);color:var(--green)}
.state-busy .v22-badge{background:var(--red-bg);color:var(--red)}
.state-off .v22-badge{background:var(--off-bg);color:#6e665c}
.v22-card-body{
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px 22px 22px;
  text-align:center;
}
.v22-icon{
  width:52px;height:52px;
  padding:12px;
  border-radius:50%;
  background:#eee7dc;
  color:#806e5a;
}
.state-available .v22-icon{background:var(--green-bg);color:var(--green);animation:availableGlow 4s ease-in-out infinite}
.state-busy .v22-icon{background:var(--red-bg);color:var(--red);animation:busyGlow 3.8s ease-in-out infinite}
.v22-state{margin-top:13px;font-size:23px;font-weight:800;line-height:1.2}
.state-available .v22-state{color:var(--green)}
.state-busy .v22-state{color:var(--red)}
.state-off .v22-state{color:#71685e}
.v22-primary{margin-top:8px;font-size:15px;font-weight:700;color:#49382c;line-height:1.45}
.v22-rule{
  width:70%;
  height:1px;
  margin:15px 0 12px;
  background:linear-gradient(90deg,transparent,rgba(190,150,68,.44),transparent);
}
.v22-detail{font-size:11.5px;color:#846f5b;line-height:1.5}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes availableGlow{50%{box-shadow:0 0 17px rgba(63,119,83,.13)}}
@keyframes busyGlow{50%{box-shadow:0 0 15px rgba(172,91,68,.10)}}

/* ===== Footer ===== */
.v22-footer{
  position:relative;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-width:0;
  padding:0 150px 0 34px;
  border-radius:18px;
  background:rgba(255,251,244,.82);
  border:1px solid var(--line);
  box-shadow:0 14px 34px -28px rgba(70,43,26,.34);
  backdrop-filter:blur(11px);
  color:#423127;
  font-size:15.5px;
  font-weight:700;
}
.v22-footer-mark{color:var(--gold);font-size:12px}

/* ===== Controls ===== */
.display-controls{
  position:fixed;
  z-index:150;
  right:34px;
  bottom:28px;
  display:flex;
  gap:7px;
  opacity:.28;
  transition:opacity .2s ease;
}
.display-controls:hover{opacity:1}
.display-control{
  width:37px;height:37px;
  border:1px solid rgba(107,76,52,.11);
  border-radius:12px;
  background:rgba(255,251,244,.84);
  color:#745a44;
  display:grid;
  place-items:center;
  cursor:pointer;
  box-shadow:0 9px 20px -15px rgba(70,43,26,.30);
  backdrop-filter:blur(8px);
}
.display-control:hover{background:#fffaf2}
.display-control svg{width:18px;height:18px}
.language-indicator{font-family:var(--font-en);font-size:10px;font-weight:800}
.wake-indicator.is-active{color:var(--gold)}

/* ===== Sync ===== */
.sync-strip{display:none!important}
#publicSyncWarning{
  display:none;
  position:fixed;
  z-index:145;
  left:50%;
  bottom:91px;
  transform:translateX(-50%) translateY(4px);
  max-width:min(70vw,660px);
  padding:7px 12px;
  border-radius:13px;
  background:rgba(255,251,244,.94);
  border:1px solid rgba(166,91,67,.15);
  box-shadow:0 12px 26px -20px rgba(70,43,26,.30);
  color:#70483a;
  font-size:10.5px;
  font-weight:700;
  text-align:center;
  opacity:0;
  pointer-events:none;
}
#publicSyncWarning.show{
  display:block;
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ===== TV responsive ===== */
@media(max-width:1180px),(max-height:720px){
  .v22-shell{padding:14px 18px;grid-template-rows:90px minmax(0,1fr) 56px;gap:11px}
  .v22-header{grid-template-columns:122px minmax(0,1fr) 172px;gap:13px}
  .v22-brand{width:112px;height:68px}
  .v22-heading{padding:5px 16px 7px}
  .v22-title{font-size:clamp(24px,2.8vw,34px);min-height:39px}
  .v22-sub{font-size:10px;min-height:20px}
  .v22-clock{width:168px;padding:8px 10px}
  .v22-time{font-size:28px}
  .v22-date{font-size:9px}
  .v22-hours{font-size:7.3px}
  .v22-preopen-card,.v22-message-card{width:min(650px,78vw);padding:28px 40px}
  .v22-preopen-title{font-size:clamp(24px,2.5vw,33px)}
  .v22-preopen-bigtime{font-size:clamp(52px,5.7vw,72px)}
  .v22-card{grid-template-rows:78px minmax(0,1fr)}
  .v22-card-head{grid-template-columns:50px minmax(0,1fr) auto;padding:10px 12px}
  .v22-avatar{width:46px;height:46px}
  .v22-name-th{font-size:16px}
  .v22-state{font-size:20px}
  .v22-primary{font-size:13.5px}
  .v22-detail{font-size:10.5px}
  .v22-footer{font-size:13.5px;padding-right:136px}
  .display-controls{right:25px;bottom:23px}
  .display-control{width:33px;height:33px}
  #publicSyncWarning{bottom:79px}
}

/* ===== Pausing / accessibility ===== */
body.motion-paused .v32-ambient-canvas{opacity:.28}
body.motion-paused .v32-light-ribbon,
body.motion-paused .v22-bg-photo,
body.motion-paused .v22-bg-wash,
body.motion-paused .v22-orb,
body.motion-paused .v22-icon{animation-play-state:paused!important}

@media(prefers-reduced-motion:reduce){
  .v32-ambient-canvas{display:none}
  .v32-light-ribbon,.v22-bg-photo,.v22-bg-wash,.v22-orb,.v22-colon,.v22-icon,.v22-card{
    animation:none!important
  }
  .lang-pair,.lang-pair-block{transition:none}
}


/* V4.1 optional diagnostics: append ?debug=1 to URL */
#spaDebugPanel{
  display:none;
  position:fixed;
  z-index:9999;
  left:14px;
  bottom:14px;
  max-width:min(760px,calc(100vw - 28px));
  padding:9px 12px;
  border-radius:12px;
  background:rgba(48,31,23,.90);
  color:#f6ead5;
  font:11px/1.45 var(--font-en);
  box-shadow:0 12px 32px rgba(0,0,0,.18);
  pointer-events:none;
}
body.spa-debug #spaDebugPanel{display:block}


/* ===================== V4.2 DETAILED QUEUE CARDS ===================== */
.v22-open{align-items:stretch}
.v42-grid{min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.v42-card{
  min-height:0;display:grid;grid-template-rows:72px 168px 62px 24px minmax(0,1fr);
  overflow:hidden;border-radius:20px;background:rgba(255,251,244,.93);
  border:1px solid var(--line);box-shadow:0 18px 48px -32px rgba(70,43,26,.40);
  backdrop-filter:blur(10px) saturate(1.02)
}
.v42-head{
  display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:9px;
  padding:9px 11px;background:linear-gradient(135deg,#654630,#77533b);color:#fff
}
.v42-head .v22-avatar{width:44px;height:44px}
.v42-person{min-width:0}
.v42-name-th{font-size:16px;font-weight:800;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v42-name-en{margin-top:2px;font:9px var(--font-en);color:#dfc98e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v42-badge{padding:6px 8px;border-radius:999px;background:#f4ede4;color:#654a35;font-size:9px;font-weight:800;white-space:nowrap}
.state-available .v42-badge{background:var(--green-bg);color:var(--green)}
.state-busy .v42-badge{background:var(--red-bg);color:var(--red)}
.state-off .v42-badge{background:var(--off-bg);color:#6c655e}

.v42-current{
  margin:10px 10px 0;padding:11px 12px 10px;border-radius:15px;
  border:1px solid rgba(89,62,42,.08);background:rgba(255,255,255,.50)
}
.v42-current-top{display:grid;grid-template-columns:38px minmax(0,1fr);gap:9px;align-items:center}
.v42-current-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ecf1e8;color:var(--green)}
.state-busy .v42-current-icon{background:var(--red-bg);color:var(--red)}
.state-off .v42-current-icon{background:var(--off-bg);color:#6f675e}
.v42-current-icon svg{width:19px;height:19px}
.v42-current-time{font-size:9px;color:#897563}
.v42-current-time span{font-family:var(--font-en)}
.v42-current-state{margin-top:1px;font-size:19px;font-weight:800;line-height:1.05;color:var(--green)}
.state-busy .v42-current-state{color:var(--red)}
.state-off .v42-current-state{color:#6f675e}
.v42-current-info{margin-top:9px;display:grid;gap:5px}
.v42-info-row{
  display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;
  padding:4px 8px;border-radius:999px;border:1px solid rgba(81,116,76,.10);
  background:rgba(238,247,238,.55);font-size:8.5px;min-height:22px
}
.state-busy .v42-info-row{background:rgba(248,236,232,.52);border-color:rgba(172,91,68,.10)}
.state-off .v42-info-row{background:rgba(238,235,230,.60);border-color:rgba(110,101,92,.10)}
.v42-info-row span{color:#7f715f}
.v42-info-row strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#446e4e;font-weight:800}
.state-busy .v42-info-row strong{color:#9c523f}
.state-off .v42-info-row strong{color:#6c655e}

.v42-progress{
  margin:8px 10px 0;padding:8px 10px;border-radius:13px;background:rgba(232,244,233,.72);
  border:1px solid rgba(64,118,83,.09)
}
.state-busy .v42-progress{background:rgba(247,232,226,.70);border-color:rgba(172,91,68,.09)}
.state-off .v42-progress{background:rgba(237,234,229,.72);border-color:rgba(108,101,93,.09)}
.v42-progress-meta{display:flex;align-items:center;gap:6px;font-size:8.5px;color:#7e715f}
.v42-progress-meta strong{margin-left:auto;color:#497b55}
.state-busy .v42-progress-meta strong{color:#9a543f}
.state-off .v42-progress-meta strong{color:#6f685f}
.v42-dot{width:6px;height:6px;border-radius:50%;background:#5faf72;box-shadow:0 0 7px rgba(95,175,114,.22)}
.state-busy .v42-dot{background:#cb7059;box-shadow:0 0 7px rgba(203,112,89,.20)}
.state-off .v42-dot{background:#8d867d;box-shadow:none}
.v42-progress-track{height:4px;margin-top:7px;border-radius:999px;overflow:hidden;background:rgba(89,120,92,.12)}
.v42-progress-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#65b57b,#4d9662);transition:width .5s ease}
.state-busy .v42-progress-bar{background:linear-gradient(90deg,#d6816b,#b45d47)}
.state-off .v42-progress-bar{background:#918a81}

.v42-next-label{align-self:center;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:8.5px;color:#8a7763}
.v42-next-label::before,.v42-next-label::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(126,101,74,.13))}
.v42-next-label::after{background:linear-gradient(90deg,rgba(126,101,74,.13),transparent)}

.v42-slots{min-height:0;padding:0 10px 10px;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:6px}
.v42-slot{
  min-height:0;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:center;
  padding:7px 8px;border-radius:13px;background:#f6f1e8;border-left:3px solid #9eb29b
}
.v42-slot.available{background:rgba(239,246,235,.80);border-left-color:#70a97b}
.v42-slot.busy{background:rgba(249,238,233,.83);border-left-color:#cf735b}
.v42-slot.muted{opacity:.56}
.v42-slot-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.78);color:#957d62;border:1px solid rgba(110,83,57,.07)}
.v42-slot-icon svg{width:16px;height:16px}
.v42-slot-time{font-size:12.5px;font-weight:800;color:#4e7b58;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v42-slot.busy .v42-slot-time{color:#a35a46}
.v42-slot.muted .v42-slot-time{color:#80766d}
.v42-slot-sub{margin-top:2px;font-size:8.5px;color:#8b7b67;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.v42-card .lang-pair{display:inline!important}
.v42-card .lang-pair-block{display:block!important;width:100%}

@keyframes v42Enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.v42-card.v42-enter{animation:v42Enter .42s var(--enter-delay,0ms) ease both}

@media(max-width:1180px),(max-height:720px){
  .v42-grid{gap:10px}
  .v42-card{grid-template-rows:64px 145px 54px 20px minmax(0,1fr);border-radius:17px}
  .v42-head{grid-template-columns:42px minmax(0,1fr) auto;padding:7px 9px}
  .v42-head .v22-avatar{width:38px;height:38px}
  .v42-name-th{font-size:14px}.v42-name-en{font-size:8px}.v42-badge{font-size:8px;padding:5px 7px}
  .v42-current{margin:7px 7px 0;padding:8px 9px 7px}
  .v42-current-top{grid-template-columns:32px minmax(0,1fr);gap:7px}
  .v42-current-icon{width:30px;height:30px}.v42-current-state{font-size:16px}
  .v42-info-row{grid-template-columns:62px minmax(0,1fr);font-size:7.5px;min-height:19px;padding:3px 7px}
  .v42-progress{margin:6px 7px 0;padding:6px 8px}.v42-progress-meta{font-size:7.5px}
  .v42-next-label{font-size:7.5px;padding:0 9px}
  .v42-slots{padding:0 7px 7px;gap:5px}
  .v42-slot{grid-template-columns:29px minmax(0,1fr);padding:5px 7px;border-radius:11px}
  .v42-slot-icon{width:26px;height:26px}.v42-slot-time{font-size:10.5px}.v42-slot-sub{font-size:7.5px}
}

</style>
</head>

<script>
/* ================================================================

   ================================================================ */
const CONFIG = {
  BUILD: "V4.2 Detailed Queue Cards",
  SHEET_ID: "1fQ2ieIc0qBhrgx6LwlPQ53HASxvS3QBMs04gcwTfMb8",
  QUEUE_TAB: "Queue",                    // tab holding therapist identity (ID, Name, Photo)
  SCHEDULE_TAB: "ตารางเวลาหมอนวด",         // fallback tab name for the booking schedule
  SCHEDULE_GID: "1985324533",             // exact worksheet from the supplied link
  SETTINGS_TAB: "Settings",              // tab holding shop name / phone etc.
  REFRESH_MS: 15000,                     // how often to re-check the sheet (ms)
  OPEN_HOUR: 14,                          // shop opens at 12:00
  QUEUE_START_HOUR: 14,                    // first queue displayed/bookable starts at 14:00
  CLOSE_HOUR: 23,
  MIN_BOOKABLE_GAP_MIN: 60,               // a free gap shorter than this won't be shown as "Available"
  STALE_WARN_MS: 120000,                 // warn after 2 minutes without a successful update
  STALE_CRITICAL_MS: 600000,             // stronger warning after 10 minutes
  PREPARE_ROOM_MIN: 10,                  // show room preparation message

};

function languagePair(thHtml, enHtml, extraClass = ''){
  return `<span class="lang-pair ${extraClass}"><span class="lang-th-text">${thHtml}</span><span class="lang-en-text en">${enHtml}</span></span>`;
}

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function normalizeCustomerTypeLabel(value){
  const raw = cleanCell(value);
  const lower = raw.toLowerCase();
  if (!raw) return { th: 'ไม่ระบุ', en: 'Not specified' };
  if (lower.includes('walk')) return { th: 'Walk-in', en: 'Walk-in' };
  if (raw.includes('โรงแรม') || lower.includes('hotel')) return { th: 'ลูกค้าโรงแรม', en: 'Hotel guest' };
  return { th: raw, en: raw };
}

function customerInfoMarkup(customerName, course, customerType){
  const safeName = escapeHtml(cleanCell(customerName) || 'ไม่ระบุ');
  const safeCourse = escapeHtml(cleanCell(course) || 'ไม่ระบุ');
  const type = normalizeCustomerTypeLabel(customerType);

  return `<div class="customer-info-grid">
    <div class="customer-info-row">
      <div class="customer-info-label">${languagePair('ชื่อ', 'Name')}</div>
      <div class="customer-info-value">${safeName}</div>
    </div>
    <div class="customer-info-row">
      <div class="customer-info-label">${languagePair('คอร์ส', 'Course')}</div>
      <div class="customer-info-value">${safeCourse}</div>
    </div>
    <div class="customer-info-row">
      <div class="customer-info-label">${languagePair('ประเภท', 'Type')}</div>
      <div class="customer-info-value">${escapeHtml(type.th)}<span class="en">${escapeHtml(type.en)}</span></div>
    </div>
  </div>`;
}

/* ---------------- Time helpers (minute precision) ---------------- */
function minutesToLabel(mins){
  const h = Math.floor(mins / 60) % 24;
  const m = mins % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

function nowMinutes(){
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

function isShopOpenNow(){
  const current = nowMinutes();
  return current >= CONFIG.OPEN_HOUR * 60 && current < CONFIG.CLOSE_HOUR * 60;
}

/* ---------------- CSV fetch + parse ---------------- */
function sheetCsvUrl(tabName, gid = ''){
  // Use gid for the schedule sheet so the display reads the exact worksheet
  // from the supplied link even when that worksheet is renamed later.
  const selector = gid
    ? `gid=${encodeURIComponent(gid)}`
    : `sheet=${encodeURIComponent(tabName)}`;
  return `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&${selector}&_=${Date.now()}`;
}

function cleanCell(value){
  return String(value ?? '')
    .replace(/^\uFEFF/, '')
    .replace(/[\u200B-\u200D\u2060]/g, '')
    .replace(/\u00A0/g, ' ')
    .trim();
}

function headerToken(value){
  return cleanCell(value)
    .toLowerCase()
    .replace(/\s+/g, '')
    .replace(/[_\-./\\]/g, '');
}

const HEADER_ALIASES = {
  therapistid: 'Therapist_ID',
  timeslot: 'Time_Slot',
  status: 'Status',
  customernote: 'Customer_Note',
  customername: 'Customer_Name',
  ชื่อ: 'Customer_Name',
  ชื่อลูกค้า: 'Customer_Name',
  id: 'ID',
  nameth: 'Name_TH',
  nameen: 'Name_EN',
  photourl: 'Photo_URL',
  workingtoday: 'Working_Today',
  key: 'Key',
  value: 'Value',
  ห้อง: 'ห้อง',
  เบอร์โทร: 'เบอร์โทร',
  คอร์สการนวด: 'คอร์สการนวด',
  ชั่วโมง: 'ชั่วโมง',
  ราคา: 'ราคา',
  ประเภทลูกค้า: 'ประเภทลูกค้า',
  หมายเหตุ: 'หมายเหตุ',
  เวลาเริ่มจริง: 'เวลาเริ่มจริง',
  เวลาสิ้นสุดจริง: 'เวลาสิ้นสุดจริง',
  พนักงานขาย: 'พนักงานขาย'
};

function canonicalHeader(value){
  const cleaned = cleanCell(value).replace(/\s+/g, ' ');
  return HEADER_ALIASES[headerToken(cleaned)] || cleaned;
}

function normalizeTherapistId(value){
  const s = cleanCell(value);
  // Google Sheets can export numeric IDs as 1.0 instead of 1.
  if (/^\d+(?:\.0+)?$/.test(s)) return String(parseInt(s, 10));
  return s;
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => cleanCell(f) !== ''));
}

function rowsToObjects(rows){
  if (rows.length < 1) return [];
  // Accept wrapped headers, invisible spaces/BOMs, and small header variations.
  const headers = rows[0].map(canonicalHeader);
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = cleanCell(r[i]));
    return obj;
  });
}

async function fetchTab(tabName, gid = ''){
  const url = sheetCsvUrl(tabName, gid);
  const sourceLabel = gid ? `${tabName} (gid ${gid})` : tabName;
  let res;
  try{
    res = await fetch(url, { cache: "no-store" });
  } catch (networkErr){
    throw new Error(`เชื่อมต่อแท็บ "${sourceLabel}" ไม่ได้ (network/CORS): ${networkErr.message}`);
  }
  if (!res.ok){
    throw new Error(`แท็บ "${sourceLabel}" ตอบกลับ HTTP ${res.status} — ตรวจสอบว่าแชร์ "ทุกคนที่มีลิงก์ ดูได้" แล้ว`);
  }
  const csvText = await res.text();
  if (/^\s*<!DOCTYPE html/i.test(csvText) || /accounts\.google\.com/i.test(csvText)){
    throw new Error(`แท็บ "${sourceLabel}" ไม่คืนค่าเป็น CSV (อาจยังไม่ได้แชร์แบบสาธารณะ หรือระบุแท็บไม่ตรง)`);
  }
  return rowsToObjects(parseCSV(csvText));
}

/* ---------------- Parsing helpers for the hourly-grid format ---------------- */

// Flexible time parser for Google Sheets CSV values.
// Supports 18:00, 18:00:00, 18.00, 6:00 PM, and fractional days such as 0.75.
function parseExactTime(value){
  const s = cleanCell(value);
  if (!s) return null;

  if (/^(?:0(?:\.\d+)?|1(?:\.0+)?)$/.test(s)){
    const fraction = Number(s);
    if (Number.isFinite(fraction)) return Math.round((fraction % 1) * 1440) % 1440;
  }

  const m = /(\d{1,2})\s*[:.]\s*(\d{2})/.exec(s);
  if (!m) return null;
  let h = parseInt(m[1], 10);
  const mm = parseInt(m[2], 10);
  const meridiem = /\b(p\.?m\.?)\b/i.test(s) ? 'pm'
    : (/\b(a\.?m\.?)\b/i.test(s) ? 'am' : '');

  if (meridiem === 'pm' && h < 12) h += 12;
  if (meridiem === 'am' && h === 12) h = 0;
  if (h > 23 || mm > 59) return null;
  return h * 60 + mm;
}

function isBusyStatus(statusRaw){
  const s = cleanCell(statusRaw).toLowerCase().replace(/\s+/g, '');
  return s === 'ไม่ว่าง' || s === 'busy' || s === 'unavailable' || s === 'booked';
}

// Build a map: Therapist_ID -> sorted array of bookings { startMin, endMin, startLabel, endLabel, note }
// Reads the hourly grid: Therapist_ID, Time_Slot, Status, Customer_Note, ห้อง, เบอร์โทร, คอร์สการนวด,
// ชั่วโมง, ประเภทลูกค้า, หมายเหตุ, เวลาเริ่มจริง, เวลาสิ้นสุดจริง
//
// Consecutive "ไม่ว่าง" hours for the same therapist (continuation rows with a blank Customer_Note,
// matching how the hotel already marks multi-hour bookings) are merged into a single booking block.
// If เวลาเริ่มจริง / เวลาสิ้นสุดจริง are filled anywhere in that block, they override the hour-block
// boundaries with the exact real time.
function fieldByNameOrPosition(row, name, position){
  const direct = row[name];
  if (direct !== undefined && cleanCell(direct) !== '') return direct;
  const keys = Object.keys(row);
  return keys[position] !== undefined ? row[keys[position]] : '';
}

function parseDurationMinutes(value){
  const s = cleanCell(value).replace(',', '.');
  if (!s) return null;
  const n = Number(s);
  if (!Number.isFinite(n) || n <= 0) return null;
  return Math.round(n * 60);
}

function buildScheduleMap(rows){
  const map = {};
  const closeMin = CONFIG.CLOSE_HOUR * 60;

  (rows || []).forEach((r, rowIndex) => {
    try{
      const therapistRaw = fieldByNameOrPosition(r, 'Therapist_ID', 0);
      const therapistId = normalizeTherapistId(therapistRaw);
      if (!therapistId) return;

      const status = fieldByNameOrPosition(r, 'Status', 2);
      if (!isBusyStatus(status)) return;

      // Prefer exact real booking times (L:M). Track whether each value
      // came from the explicit real-time columns so merge logic never
      // lets a fallback hourly row overwrite an exact minute value.
      const explicitStartRaw =
        fieldByNameOrPosition(r, 'เวลาเริ่มจริง', 11) ||
        fieldByNameOrPosition(r, 'เวลาเริ่มจอง', 11) ||
        fieldByNameOrPosition(r, 'Start', 11) ||
        fieldByNameOrPosition(r, 'Start_Time', 11);

      const explicitEndRaw =
        fieldByNameOrPosition(r, 'เวลาสิ้นสุดจริง', 12) ||
        fieldByNameOrPosition(r, 'เวลาสิ้นสุดจอง', 12) ||
        fieldByNameOrPosition(r, 'End', 12) ||
        fieldByNameOrPosition(r, 'End_Time', 12);

      const slotRaw = fieldByNameOrPosition(r, 'Time_Slot', 1);
      const startRaw = explicitStartRaw || slotRaw;
      const endRaw = explicitEndRaw;

      const hasExplicitStart = cleanCell(explicitStartRaw) !== '';
      const hasExplicitEnd = cleanCell(explicitEndRaw) !== '';

      let start = parseExactTime(startRaw);
      let end = parseExactTime(endRaw);

      // Fallback end time: derive from duration or the next hour only when explicit end is absent.
      if (!Number.isFinite(start)) return;

      const hoursRaw =
        fieldByNameOrPosition(r, 'ชั่วโมง', 7) ||
        fieldByNameOrPosition(r, 'Hours', 7) ||
        fieldByNameOrPosition(r, 'Duration', 7);

      const durationHours = parseFloat(String(hoursRaw ?? '').replace(',', '.'));
      if (!Number.isFinite(end)){
        if (Number.isFinite(durationHours) && durationHours > 0){
          end = start + Math.round(durationHours * 60);
        } else {
          end = start + 60;
        }
      }

      // Self-test / guard rails:
      // 1) reject impossible or zero-length bookings
      if (!Number.isFinite(end) || end <= start){
        console.warn('[Spa Queue Self-test] invalid end<=start', {rowIndex, therapistId, startRaw, endRaw, start, end});
        return;
      }
      // 2) never let a booking create availability beyond exact closing time.
      if (start >= closeMin){
        console.warn('[Spa Queue Self-test] booking starts at/after closing; ignored on public board', {rowIndex, therapistId, start, end});
        return;
      }
      end = Math.min(end, closeMin);

      const customer =
        fieldByNameOrPosition(r, 'Customer_Note', 3) ||
        fieldByNameOrPosition(r, 'Customer_Name', 3) ||
        fieldByNameOrPosition(r, 'ชื่อลูกค้า', 3) || '';

      const course =
        fieldByNameOrPosition(r, 'คอร์สการนวด', 6) ||
        fieldByNameOrPosition(r, 'Course', 6) ||
        fieldByNameOrPosition(r, 'Treatment', 6) || '';

      const customerType =
        fieldByNameOrPosition(r, 'ประเภทลูกค้า', 9) ||
        fieldByNameOrPosition(r, 'Customer_Type', 9) || '';

      // Keep staff-only data private on the TV:
      // phone, price, salesperson, internal remarks are intentionally NOT exposed here.
      const room =
        fieldByNameOrPosition(r, 'ห้อง', 4) ||
        fieldByNameOrPosition(r, 'Room', 4) || '';

      const displayParts = [];
      if (customer) displayParts.push(String(customer).trim());
      if (room) displayParts.push(`ห้อง ${String(room).trim()}`);
      if (course) displayParts.push(String(course).trim());
      if (customerType) displayParts.push(String(customerType).trim());

      const item = {
        therapistId,
        startMin: start,
        endMin: end,
        startLabel: minutesToLabel(start),
        endLabel: minutesToLabel(end),
        hasExplicitStart,
        hasExplicitEnd,
        start,
        end,
        customer: String(customer || '').trim(),
        customerName: String(customer || '').trim(),
        room: String(room || '').trim(),
        course: String(course || '').trim(),
        customerType: String(customerType || '').trim(),
        note: displayParts.filter(Boolean).join(' · '),
        rowIndex
      };

      if (!map[therapistId]) map[therapistId] = [];
      map[therapistId].push(item);
    } catch (err){
      console.warn('[Spa Queue Self-test] row parse error', rowIndex, err);
    }
  });

  Object.keys(map).forEach(id => {
    const list = map[id].sort((a,b) => a.startMin - b.startMin || a.endMin - b.endMin);

    // Merge overlapping/adjacent rows belonging to the same real booking period,
    // while preserving the richest display data.
    const merged = [];
    for (const item of list){
      const prev = merged[merged.length - 1];
      if (prev && item.startMin <= prev.endMin){
        // Exact real times must take priority over inferred hourly bounds.
        if (item.hasExplicitStart && !prev.hasExplicitStart){
          prev.startMin = item.startMin;
          prev.start = item.startMin;
          prev.startLabel = item.startLabel;
          prev.hasExplicitStart = true;
        } else if (!prev.hasExplicitStart){
          prev.startMin = Math.min(prev.startMin, item.startMin);
          prev.start = prev.startMin;
          prev.startLabel = minutesToLabel(prev.startMin);
        }

        if (item.hasExplicitEnd){
          prev.endMin = item.endMin;
          prev.end = item.endMin;
          prev.endLabel = item.endLabel;
          prev.hasExplicitEnd = true;
        } else if (!prev.hasExplicitEnd){
          prev.endMin = Math.max(prev.endMin, item.endMin);
          prev.end = prev.endMin;
          prev.endLabel = minutesToLabel(prev.endMin);
        }

        if (!prev.customer && item.customer) prev.customer = item.customer;
        if (!prev.customerName && item.customerName) prev.customerName = item.customerName;
        if (!prev.room && item.room) prev.room = item.room;
        if (!prev.course && item.course) prev.course = item.course;
        if (!prev.customerType && item.customerType) prev.customerType = item.customerType;

        const parts = [];
        if (prev.customer) parts.push(prev.customer);
        if (prev.room) parts.push(`ห้อง ${prev.room}`);
        if (prev.course) parts.push(prev.course);
        if (prev.customerType) parts.push(prev.customerType);
        prev.note = parts.join(' · ');
      } else {
        merged.push({...item});
      }
    }
    merged.forEach(b => {
      if (b.hasExplicitEnd && b.endLabel !== minutesToLabel(b.endMin)){
        console.warn('[Spa Queue] exact end-time label mismatch', {therapistId:id, booking:b});
      }
    });
    map[id] = merged;
  });

  return map;
}

// Merge identity (Queue) with computed live status (Schedule) for one therapist
function computeTherapistView(therapistId, bookings){
  bookings = bookings || [];
  const nowMin = nowMinutes();
  const closeMin = CONFIG.CLOSE_HOUR * 60; // exact closing time; 23:00 means closed from 23:00 onward

  const currentBooking = bookings.find(b => nowMin >= b.startMin && nowMin < b.endMin);
  const queueStartMin = CONFIG.QUEUE_START_HOUR * 60;

  // Determine the complete free window around the current time. This powers the
  // green availability countdown without changing the three upcoming queue boxes.
  let previousBooking = null;
  for (const booking of bookings){
    if (booking.endMin <= nowMin) previousBooking = booking;
    else break;
  }
  const nextBooking = bookings.find(b => b.startMin > nowMin) || null;
  let availableStartMin = null;
  let availableEndMin = null;
  if (!currentBooking){
    availableStartMin = nowMin < queueStartMin
      ? queueStartMin
      : Math.max(queueStartMin, previousBooking ? previousBooking.endMin : queueStartMin);
    availableEndMin = nextBooking ? nextBooking.startMin : closeMin;
    if (availableEndMin <= availableStartMin){
      availableStartMin = null;
      availableEndMin = null;
    }
  }

  // Build a timeline of what's coming up: alternating available / busy blocks,
  // starting right after "now" (or right after the current session ends if busy)
  // The shop may already be open, but appointment availability begins at 14:00.
  let cursor = currentBooking ? currentBooking.endMin : Math.max(nowMin, queueStartMin);
  const upcoming = bookings.filter(b => b.startMin >= cursor);

  const segments = [];
  upcoming.forEach(b => {
    if (b.startMin > cursor && (b.startMin - cursor) >= CONFIG.MIN_BOOKABLE_GAP_MIN){
      segments.push({ type: 'available', startMin: cursor, endMin: b.startMin });
    }
    segments.push({
      type: 'busy',
      startMin: b.startMin,
      endMin: b.endMin,
      note: b.note,
      customerName: b.customerName || '',
      course: b.course || '',
      customerType: b.customerType || ''
    });
    cursor = b.endMin;
  });
  if (cursor < closeMin && (closeMin - cursor) >= CONFIG.MIN_BOOKABLE_GAP_MIN){
    segments.push({ type: 'available', startMin: cursor, endMin: closeMin });
  }

  // Break long "available" stretches into 1-hour chunks so a single free window
  // doesn't swallow the whole 3-slot display — always show real, distinct boxes.
  // (A trailing remainder shorter than an hour gets folded into the previous chunk.)
  const CHUNK_MIN = 60;
  function roundToHalfHour(mins){
    return Math.round(mins / 30) * 30;
  }
  function ceilToHalfHour(mins){
    return Math.ceil(mins / 30) * 30;
  }

  const expanded = [];
  segments.forEach(s => {
    if (s.type !== 'available'){
      expanded.push(s);
      return;
    }

    // Round the leading edge UP to the next clean :00/:30 mark too (never down —
    // that would claim availability before the therapist is actually free).
    // If rounding up eats the whole window, just drop it rather than show a fake range.
    let t = ceilToHalfHour(s.startMin);
    if (t >= s.endMin) return;

    while (t < s.endMin){
      const rawEnd = Math.min(t + CHUNK_MIN, s.endMin);
      let chunkEnd = rawEnd;

      // Only round an artificial cut in the middle of a long free window — never round
      // a real boundary (the start of an actual next booking, or true closing time)
      if (rawEnd < s.endMin){
        chunkEnd = roundToHalfHour(rawEnd);
        if (chunkEnd <= t) chunkEnd = t + 30;
        if (chunkEnd > s.endMin) chunkEnd = s.endMin;
      }

      // Fold a leftover remainder shorter than a full hour into this chunk — every
      // box should represent a full hour (or more); never a sub-hour fragment
      if (s.endMin - chunkEnd > 0 && s.endMin - chunkEnd < CHUNK_MIN){
        chunkEnd = s.endMin;
      }

      expanded.push({ type: 'available', startMin: t, endMin: chunkEnd });
      t = chunkEnd;
    }
  });

  // Show up to 3 real upcoming boxes. When no more queue exists today,
  // append only ONE closing placeholder so the message is never duplicated.
  const visibleSegments = expanded.slice(0, 3);
  if (visibleSegments.length < 3){
    visibleSegments.push({ type: 'none' });
  }

  const nextThree = visibleSegments.map(s => s.type === 'none' ? s : ({
    type: s.type,
    startMin: s.startMin,
    endMin: Math.min(s.endMin, closeMin),
    startLabel: minutesToLabel(s.startMin),
    endLabel: minutesToLabel(Math.min(s.endMin, closeMin)),
    note: s.note || '',
    customerName: s.customerName || '',
    course: s.course || '',
    customerType: s.customerType || ''
  }));

  return {
    available: !currentBooking,
    currentNote: currentBooking ? currentBooking.note : '',
    currentCustomerName: currentBooking ? (currentBooking.customerName || '') : '',
    currentCourse: currentBooking ? (currentBooking.course || '') : '',
    currentCustomerType: currentBooking ? (currentBooking.customerType || '') : '',
    currentStartMin: currentBooking ? currentBooking.startMin : null,
    currentEndMin: currentBooking ? currentBooking.endMin : null,
    currentEndLabel: currentBooking ? currentBooking.endLabel : '',
    availableStartMin,
    availableEndMin,
    availableEndLabel: availableEndMin !== null ? minutesToLabel(availableEndMin) : '',
    availableEndsAtClosing: availableEndMin === closeMin,
    nextThree
  };
}

function avatarSvg(){
  return `<svg viewBox="0 0 24 24" fill="currentColor" style="color:#5c4a30"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>`;
}

function statusIconSvg(state){
  const color = state === 'available' ? '#2F6B45' : (state === 'off' ? '#8A7A64' : '#A6462F');
  if (state === 'off'){
    return `<svg viewBox="0 0 48 48" fill="none" stroke="${color}" stroke-width="1.8">
      <circle cx="24" cy="24" r="21"/>
      <path d="M16 16l16 16M32 16L16 32" stroke-linecap="round"/>
    </svg>`;

function detailedTherapistCard({
  id,nameTh,nameEn,photo,state,
  statusTh,statusEn,
  currentLabelTh,currentLabelEn,
  currentSubTh,currentSubEn,
  currentStart,currentEnd,
  nextSlots=[]
}){
  const now = nowMinutes();
  let progress = 0;
  let remainingTh = '—';
  let remainingEn = '—';

  if (currentStart !== null && currentEnd !== null && currentEnd > currentStart){
    progress = Math.max(0,Math.min(100,((now-currentStart)/(currentEnd-currentStart))*100));
    const rem = Math.max(0,currentEnd-now);
    const rh = Math.floor(rem/60);
    const rm = rem%60;
    remainingTh = rh > 0 ? `${rh} ชม. ${rm} นาที` : `${rm} นาที`;
    remainingEn = rh > 0 ? `${rh}h ${rm}m` : `${rm} min`;
  }

  const slots = (nextSlots || []).slice(0,3);
  while (slots.length < 3) slots.push(null);

  const slotHtml = slots.map(slot => {
    if (!slot){
      return `<div class="v42-slot muted">
        <div class="v42-slot-icon">${calendarMiniSvg()}</div>

    <div class="v42-head">

      <div class="v42-person">
        <div class="v42-name-th">${escapeHtml(String(nameTh || ''))}</div>

      </div>
      <div class="v42-badge">${languagePair(statusTh,statusEn)}</div>
    </div>

    <div class="v42-current">
      <div class="v42-current-top">
        <div class="v42-current-icon">${stateIcon}</div>
        <div class="v42-current-copy">
          <div class="v42-current-time">${languagePair('คิวปัจจุบัน','Current queue')} <span>(${formatMinutes(now)} น.)</span></div>
          <div class="v42-current-state">${languagePair(statusTh,statusEn)}</div>
        </div>
      </div>

      <div class="v42-current-info">
        <div class="v42-info-row">
          <span>${languagePair('สถานะ','Status')}</span>
          <strong>${languagePair(statusTh,statusEn)}</strong>
        </div>
        <div class="v42-info-row">
          <span>${languagePair('คิวถัดไป','Next')}</span>
          <strong>${languagePair(currentLabelTh,currentLabelEn)}</strong>
        </div>
        <div class="v42-info-row">
          <span>${languagePair('บริการ','Service')}</span>
          <strong>${languagePair(currentSubTh,currentSubEn)}</strong>

function validateCurrentBusyRows(scheduleRows, scheduleMap){
  const nowMin = nowMinutes();
  const issues = [];

  for (const row of (scheduleRows || [])){
    if (!isBusyStatus(fieldByNameOrPosition(row, 'Status', 2))) continue;

    const therapistId = normalizeTherapistId(fieldByNameOrPosition(row, 'Therapist_ID', 0));
    if (!therapistId) continue;

    const explicitStart = parseExactTime(fieldByNameOrPosition(row, 'เวลาเริ่มจริง', 11));
    const explicitEnd = parseExactTime(fieldByNameOrPosition(row, 'เวลาสิ้นสุดจริง', 12));
    const slotStart = parseExactTime(fieldByNameOrPosition(row, 'Time_Slot', 1));
    const duration = parseDurationMinutes(fieldByNameOrPosition(row, 'ชั่วโมง', 7));

    const start = explicitStart !== null ? explicitStart : slotStart;
    const end = explicitEnd !== null
      ? explicitEnd
      : (start !== null ? start + (duration || 60) : null);

    if (start === null || end === null) continue;

    if (nowMin >= start && nowMin < end){
      const bookings = scheduleMap[therapistId] || [];
      const parsedCurrent = bookings.find(b => nowMin >= b.startMin && nowMin < b.endMin);
      if (!parsedCurrent){
        issues.push({therapistId,start,end,row});
      }
    }
  }

  if (issues.length){
    console.error('[Spa Queue CRITICAL] A busy row covers the current time but is not active after parsing.', issues);
    return false;
  }
  return true;
}

function scoreScheduleSource(rows, sourceLabel){
  const list = rows || [];
  if (!list.length){
    return {score:-1000, rows:list, sourceLabel, busyRows:0, explicitRows:0, usableRows:0};
  }

  let busyRows = 0;
  let explicitRows = 0;
  let usableRows = 0;
  let idRows = 0;
  let timeRows = 0;

  for (const r of list){
    const id = normalizeTherapistId(fieldByNameOrPosition(r, 'Therapist_ID', 0));
    const slot = fieldByNameOrPosition(r, 'Time_Slot', 1);
    const status = fieldByNameOrPosition(r, 'Status', 2);
    const start = fieldByNameOrPosition(r, 'เวลาเริ่มจริง', 11);
    const end = fieldByNameOrPosition(r, 'เวลาสิ้นสุดจริง', 12);

    if (id) idRows++;
    if (parseExactTime(slot) !== null) timeRows++;
    if (id && parseExactTime(slot) !== null) usableRows++;
    if (isBusyStatus(status)) busyRows++;
    if (parseExactTime(start) !== null || parseExactTime(end) !== null) explicitRows++;
  }

  // Busy and exact-time data are weighted heavily. This makes the display prefer
  // the worksheet that actually contains today's live queue, not merely a valid old grid.
  const score =
      usableRows * 2
    + idRows
    + timeRows
    + busyRows * 120
    + explicitRows * 55;

  return {score, rows:list, sourceLabel, busyRows, explicitRows, usableRows};
}

async function fetchScheduleRows(){
  const sources = [
    {
      label:`${CONFIG.SCHEDULE_TAB} (gid ${CONFIG.SCHEDULE_GID})`,
      fetch:() => fetchTab(CONFIG.SCHEDULE_TAB, CONFIG.SCHEDULE_GID)
    },
    {
      label:`${CONFIG.SCHEDULE_TAB} (by name)`,
      fetch:() => fetchTab(CONFIG.SCHEDULE_TAB)
    }
  ];

  const results = await Promise.all(sources.map(async source => {
    try{
      const rows = await source.fetch();
      return {...scoreScheduleSource(rows, source.label), error:null};
    }catch(error){
      return {...scoreScheduleSource([], source.label), error};
    }
  }));

  const successful = results
    .filter(r => !r.error)
    .sort((a,b) => b.score - a.score);

  if (!successful.length){
    const details = results
      .map(r => `${r.sourceLabel}: ${r.error?.message || 'ไม่พบข้อมูล'}`)
      .join(' | ');
    throw new Error(`อ่านตารางคิวไม่ได้ทุกแหล่ง: ${details}`);
  }

  const chosen = successful[0];
  console.info('[Spa Queue] schedule source selected', {
    source: chosen.sourceLabel,
    score: chosen.score,
    rows: chosen.rows.length,
    busyRows: chosen.busyRows,
    explicitRows: chosen.explicitRows,
    alternatives: successful.slice(1).map(s => ({
      source:s.sourceLabel,
      score:s.score,
      rows:s.rows.length,
      busyRows:s.busyRows,
      explicitRows:s.explicitRows
    }))
  });

  window.__SPA_SCHEDULE_SOURCE__ = chosen.sourceLabel;
  window.__SPA_SCHEDULE_SOURCE_STATS__ = {
    rows:chosen.rows.length,
    busyRows:chosen.busyRows,
    explicitRows:chosen.explicitRows,
    score:chosen.score
  };

  return chosen.rows;
}

  strip.classList.remove('status-warn','status-critical','status-offline');
  dot.classList.remove('warn','critical');

    th = lastSuccessfulSyncAt
      ? `อินเทอร์เน็ตขัดข้อง · แสดงข้อมูลล่าสุดเมื่อ ${formatSyncTime(lastSuccessfulSyncAt)}`
      : 'ไม่มีการเชื่อมต่ออินเทอร์เน็ต · กรุณาตรวจสอบที่ Front Reception';
    en = lastSuccessfulSyncAt
      ? `Internet offline · Showing the last update from ${formatSyncTime(lastSuccessfulSyncAt)}`
      : 'No internet connection · Please check with Front Reception';
  } else if (!lastSuccessfulSyncAt){
    level = consecutiveSyncFailures ? 'critical' : 'ok';
    th = consecutiveSyncFailures
      ? 'ยังดึงข้อมูลคิวไม่ได้ · กรุณาตรวจสอบที่ Front Reception'
      : 'กำลังเชื่อมต่อข้อมูลคิว…';
    en = consecutiveSyncFailures
      ? 'Queue data is unavailable · Please check with Front Reception'
      : 'Connecting to queue data…';
  } else if (age >= CONFIG.STALE_CRITICAL_MS){
    level = 'critical';
    th = `ข้อมูลคิวอาจไม่เป็นปัจจุบัน · ล่าสุด ${formatSyncTime(lastSuccessfulSyncAt)} · กรุณาตรวจสอบที่ Front Reception`;
    en = `Queue data may be outdated · Last update ${formatSyncTime(lastSuccessfulSyncAt)} · Please check with Front Reception`;
  } else if (consecutiveSyncFailures > 0){
    level = 'warn';
    th = `กำลังเชื่อมต่อใหม่ · ยังแสดงข้อมูลล่าสุดเมื่อ ${formatSyncTime(lastSuccessfulSyncAt)}`;
    en = `Reconnecting · Still showing the last update from ${formatSyncTime(lastSuccessfulSyncAt)}`;
  } else if (age >= CONFIG.STALE_WARN_MS){
    level = 'warn';
    th = `กำลังรอข้อมูลใหม่ · อัปเดตล่าสุด ${formatSyncTime(lastSuccessfulSyncAt)}`;
    en = `Waiting for a fresh update · Last updated ${formatSyncTime(lastSuccessfulSyncAt)}`;
  } else {
    th = `ข้อมูลคิวอัปเดตแล้ว · ล่าสุด ${formatSyncTime(lastSuccessfulSyncAt)}`;
    en = `Queue information is up to date · Updated ${formatSyncTime(lastSuccessfulSyncAt)}`;
  }

  if (adminDebugMode && lastSyncStats){
    th += ` · ${CONFIG.BUILD} · ${lastSyncStats.source} · แถว ${lastSyncStats.rows} · ไม่ว่าง ${lastSyncStats.busyRows} · คิว ${lastSyncStats.bookings} · ล้มเหลว ${consecutiveSyncFailures}`;
    en += ` · ${CONFIG.BUILD} · ${lastSyncStats.source} · Rows ${lastSyncStats.rows} · Busy ${lastSyncStats.busyRows} · Bookings ${lastSyncStats.bookings} · Failures ${consecutiveSyncFailures}`;
  }

  setSyncLevel(level);
  text.innerHTML = languagePair(th, en);
  updateSpaDebugPanel();
}

function scheduleRecoveryReload(){
  if (recoveryReloadScheduled || !navigator.onLine || consecutiveSyncFailures < 8) return;
  const match = /#recovery-(\d+)/.exec(location.hash);
  const previousRecovery = match ? Number(match[1]) : 0;
  if (previousRecovery && Date.now() - previousRecovery < 30 * 60 * 1000) return;
  recoveryReloadScheduled = true;
  window.setTimeout(() => {
    const cleanUrl = location.href.replace(/#recovery-\d+$/, '').split('#')[0];
    location.replace(`${cleanUrl}#recovery-${Date.now()}`);
  }, 5000);
}

async function syncNow(reason = 'interval'){
  if (syncInFlight) return;
  syncInFlight = true;
  try{
    const [queue, scheduleRows, settings] = await Promise.all([
      fetchTab(CONFIG.QUEUE_TAB),
      fetchScheduleRows(),
      fetchTab(CONFIG.SETTINGS_TAB).catch(() => [])
    ]);
    const scheduleMap = buildScheduleMap(scheduleRows);
    validateScheduleRuntime(scheduleRows, scheduleMap);
    const currentBusySanityOk = validateCurrentBusyRows(scheduleRows, scheduleMap);
    const bookingCount = Object.values(scheduleMap).reduce((sum, list) => sum + list.length, 0);
    const busyRowCount = scheduleRows.filter(r => isBusyStatus(fieldByNameOrPosition(r, 'Status', 2))).length;

    lastGoodQueue = queue;
    lastGoodScheduleMap = scheduleMap;
    lastSuccessfulSyncAt = Date.now();
    setPublicSyncWarning('');
    consecutiveSyncFailures = 0;
    lastSyncError = null;
    lastSyncStats = {
      rows:scheduleRows.length,
      busyRows:busyRowCount,
      bookings:bookingCount,
      reason,
      source:window.__SPA_SCHEDULE_SOURCE__ || CONFIG.SCHEDULE_TAB,
      explicitRows:window.__SPA_SCHEDULE_SOURCE_STATS__?.explicitRows || 0,
      currentBusySanityOk
    };
    recoveryReloadScheduled = false;

    renderCards(queue, scheduleMap);
    if (settings.length) applySettings(settings);
    document.body.classList.remove('sync-success');
    void document.body.offsetWidth;
    document.body.classList.add('sync-success');
    window.setTimeout(() => document.body.classList.remove('sync-success'), 900);

    if (busyRowCount > 0 && bookingCount === 0){
      consecutiveSyncFailures = 1;
      lastSyncError = new Error('พบแถวไม่ว่าง แต่แปลงเป็นคิวไม่ได้');
      setPublicSyncWarning('พบข้อมูลคิว แต่ระบบแปลงเวลาไม่สำเร็จ กรุณาติดต่อ Front Reception');
    } else if (!currentBusySanityOk){
      consecutiveSyncFailures = 1;
      lastSyncError = new Error('มีคิวครอบคลุมเวลาปัจจุบัน แต่สถานะ Busy ไม่ถูกสร้าง');
      setPublicSyncWarning('ตรวจพบคิวปัจจุบัน แต่สถานะหน้าจอไม่ตรง กรุณาติดต่อ Front Reception');
    }
  } catch (err){
    consecutiveSyncFailures += 1;
    lastSyncError = err;
    console.error('[Spa Queue Sync Error]', err);
    setPublicSyncWarning('ข้อมูลคิวอาจไม่เป็นปัจจุบัน กรุณาติดต่อ Front Reception');
    if (lastGoodQueue) renderCards(lastGoodQueue, lastGoodScheduleMap || {});
    scheduleRecoveryReload();
  } finally {
    syncInFlight = false;
    updateSyncStatus();
  }
}

/* ---------------- Premium motion + live progress ---------------- */
function remainingCopy(minutes){
  const safe = Math.max(0, Math.ceil(minutes));
  if (safe <= 0) return { th:'ใกล้เสร็จแล้ว', en:'Finishing soon' };
  if (safe <= 5) return { th:`เหลืออีก ${safe} นาที`, en:`Only ${safe} min left` };
  if (safe < 60) return { th:`เหลือ ${safe} นาที`, en:`${safe} min left` };
  const h = Math.floor(safe / 60);
  const m = safe % 60;
  return m
    ? { th:`เหลือ ${h} ชม. ${m} นาที`, en:`${h}h ${m}m left` }
    : { th:`เหลือ ${h} ชั่วโมง`, en:`${h}h left` };
}

function availableCopy(minutes, closing){
  const safe = Math.max(0, Math.ceil(minutes));
  if (safe <= 0){
    return closing
      ? { th:'กำลังปิดร้าน', en:'Closing now' }
      : { th:'คิวถัดไปกำลังเริ่ม', en:'Next booking starting' };
  }
  let thDuration;
  let enDuration;
  if (safe < 60){
    thDuration = `${safe} นาที`;
    enDuration = `${safe} min`;
  } else {
    const h = Math.floor(safe / 60);
    const m = safe % 60;
    thDuration = m ? `${h} ชม. ${m} นาที` : `${h} ชั่วโมง`;
    enDuration = m ? `${h}h ${m}m` : `${h}h`;
  }
  return closing
    ? { th:`ว่างจนปิดร้าน · เหลือ ${thDuration}`, en:`Available until closing · ${enDuration} left` }
    : { th:`ว่างอีก ${thDuration}`, en:`Available for ${enDuration}` };
}

function updateUpcomingQueueEffects(){
  const now = nowMinutes();
  document.querySelectorAll('.next-box[data-queue-type="busy"]').forEach(box => {
    const start = Number(box.dataset.start);
    const startsIn = start - now;
    box.classList.toggle('queue-imminent', Number.isFinite(start) && startsIn > 0 && startsIn <= CONFIG.IMMINENT_QUEUE_MIN);
  });
}

function updateSessionProgress(){
  const now = nowMinutes();
  document.querySelectorAll('.session-progress').forEach(node => {
    const start = Number(node.dataset.start);
    const end = Number(node.dataset.end);
    if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return;

    const kind = node.dataset.kind || 'busy';
    const bar = node.querySelector('.session-progress-bar');
    const remaining = node.querySelector('.session-remaining');
    const title = node.querySelector('.session-progress-title');

    if (kind === 'available'){
      node.classList.toggle('is-waiting', now < start);
      const minutesLeft = end - Math.max(now, start);
      node.classList.toggle('is-ending', now >= start && minutesLeft <= 15);

      if (now < start){
        const waitMin = Math.max(0, start - now);
        if (bar) bar.style.width = '0%';
        if (title) title.innerHTML = languagePair(`เริ่มรับคิวเวลา ${minutesToLabel(start)}`,`Queue starts at ${minutesToLabel(start)}`);
        if (remaining) remaining.innerHTML = languagePair(`อีก ${Math.ceil(waitMin)} นาที`,`${Math.ceil(waitMin)} min`);
        return;
      }

      const remainingPercent = Math.min(100, Math.max(0, ((end - now) / (end - start)) * 100));
      if (bar) bar.style.width = `${remainingPercent.toFixed(1)}%`;
      if (title) title.innerHTML = languagePair('เวลาว่างคงเหลือ','Available time left');
      if (remaining){
        const copy = availableCopy(end - now, node.dataset.closing === 'true');
        remaining.innerHTML = languagePair(copy.th, copy.en);
      }
      return;
    }

    const minutesLeft = end - now;
    const progress = Math.min(100, Math.max(0, ((now - start) / (end - start)) * 100));
    if (bar) bar.style.width = `${progress.toFixed(1)}%`;
    if (remaining){
      const copy = remainingCopy(minutesLeft);
      remaining.innerHTML = languagePair(copy.th, copy.en);
    }

    const card = node.closest('.card');
    const upcomingBusy = card
      ? [...card.querySelectorAll('.next-box[data-queue-type="busy"]')]
          .map(box => Number(box.dataset.start))
          .filter(Number.isFinite)
          .sort((a,b) => a-b)[0]
      : null;
    const nextStartsSoonAfter = Number.isFinite(upcomingBusy) && upcomingBusy >= end && upcomingBusy - end <= CONFIG.IMMINENT_QUEUE_MIN;
    const preparing = minutesLeft > 0 && minutesLeft <= CONFIG.PREPARE_ROOM_MIN && nextStartsSoonAfter;
    node.classList.toggle('is-preparing', preparing);
    node.classList.toggle('is-final-minutes', minutesLeft > 0 && minutesLeft <= 5);
  });

  updateUpcomingQueueEffects();
}

function setupMotionEffects(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;

  // Gentle page parallax. It remains subtle enough for a lobby display.
  window.addEventListener('pointermove', event => {
    const x = (event.clientX / Math.max(window.innerWidth, 1) - .5) * 18;
    const y = (event.clientY / Math.max(window.innerHeight, 1) - .5) * 14;
    document.documentElement.style.setProperty('--motion-x', `${x}px`);
    document.documentElement.style.setProperty('--motion-y', `${y}px`);
  }, { passive:true });

  document.addEventListener('pointermove', event => {
    const card = event.target.closest('.card');
    if (!card || window.innerWidth <= 900) return;
    const rect = card.getBoundingClientRect();
    const px = (event.clientX - rect.left) / rect.width;
    const py = (event.clientY - rect.top) / rect.height;
    card.style.setProperty('--tilt-x', `${(px - .5) * 2.6}deg`);
    card.style.setProperty('--tilt-y', `${(.5 - py) * 2.2}deg`);
    card.style.setProperty('--shine-x', `${px * 100}%`);
    card.style.setProperty('--shine-y', `${py * 100}%`);
    card.style.setProperty('--shine-opacity', '.7');
  }, { passive:true });

  document.addEventListener('pointerout', event => {
    const card = event.target.closest('.card');
    if (!card || card.contains(event.relatedTarget)) return;
    card.style.setProperty('--tilt-x', '0deg');
    card.style.setProperty('--tilt-y', '0deg');
    card.style.setProperty('--shine-opacity', '0');
  });
}

let activeLanguage = 'th';
let languageCycleTimer = null;
let wakeLockSentinel = null;
let wakeLockDesired = true;

function setLanguageMode(language){
  const nextLanguage = language === 'en' ? 'en' : 'th';
  const changed = nextLanguage !== activeLanguage;

  const applyLanguage = () => {
    activeLanguage = nextLanguage;
    document.documentElement.lang = activeLanguage === 'en' ? 'en' : 'th';
    document.body.classList.toggle('language-en', activeLanguage === 'en');

    const control = document.getElementById('languageControl');
    if (control){
      control.textContent = activeLanguage === 'en' ? 'EN' : 'TH';
      control.setAttribute(
        'aria-label',
        activeLanguage === 'en' ? 'Switch to Thai' : 'สลับเป็นภาษาอังกฤษ'
      );
      control.setAttribute('aria-pressed', activeLanguage === 'en' ? 'true' : 'false');
    }
  };

  if (!changed){
    applyLanguage();
    return;
  }

  // Phase 1: hide the currently visible language.
  document.body.classList.add('language-fading');

  window.clearTimeout(setLanguageMode._swapTimer);
  window.clearTimeout(setLanguageMode._finishTimer);

  // Phase 2: swap only after old text is fully hidden.
  setLanguageMode._swapTimer = window.setTimeout(() => {
    applyLanguage();

    // Two frames ensure display:none/display:block is committed before fade-in.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.body.classList.remove('language-fading');
    }));
  }, 185);

  setLanguageMode._finishTimer = window.setTimeout(() => {
    document.body.classList.remove('language-fading');
  }, 500);
}

function restartLanguageCycle(){
  window.clearInterval(languageCycleTimer);
  languageCycleTimer = window.setInterval(() => {
    setLanguageMode(activeLanguage === 'th' ? 'en' : 'th');
  }, CONFIG.LANGUAGE_SWITCH_MS);
}

function setupLanguageCycle(){
  setLanguageMode('th');
  restartLanguageCycle();
  const control = document.getElementById('languageControl');
  if (control){
    control.addEventListener('click', () => {
      setLanguageMode(activeLanguage === 'th' ? 'en' : 'th');
      restartLanguageCycle();
    });
  }
}

function updateFullscreenControl(){

async function toggleFullscreen(){
  try{
    const current = document.fullscreenElement || document.webkitFullscreenElement;
    if (!current){
      const root = document.documentElement;
      if (root.requestFullscreen) await root.requestFullscreen();
      else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  } catch (error){
    console.warn('[Fullscreen]', error);
  }
  updateFullscreenControl();
  requestScreenWakeLock();
}

function updateWakeControl(state){
  const button = document.getElementById('wakeControl');
  if (!button) return;
  button.classList.remove('is-active','is-unavailable');
  if (state === 'active'){
    button.classList.add('is-active');
    button.title = 'หน้าจอจะไม่ดับ / Screen wake lock active';
  } else if (state === 'unsupported'){
    button.classList.add('is-unavailable');
    button.title = 'อุปกรณ์นี้ไม่รองรับ Screen Wake Lock';
  } else {
    button.title = 'ป้องกันหน้าจอดับ / Keep screen awake';
  }
}

async function requestScreenWakeLock(){
  if (!wakeLockDesired) return;
  if (!('wakeLock' in navigator)){
    updateWakeControl('unsupported');
    return;
  }
  if (document.visibilityState !== 'visible') return;
  if (wakeLockSentinel && !wakeLockSentinel.released){
    updateWakeControl('active');
    return;
  }
  try{
    wakeLockSentinel = await navigator.wakeLock.request('screen');
    updateWakeControl('active');
    wakeLockSentinel.addEventListener('release', () => {
      wakeLockSentinel = null;
      updateWakeControl('idle');
    }, { once:true });
  } catch (error){
    wakeLockSentinel = null;
    updateWakeControl('idle');
    console.warn('[Wake Lock]', error);
  }
}

async function toggleWakeLock(){
  wakeLockDesired = !wakeLockDesired;
  if (!wakeLockDesired && wakeLockSentinel){
    try{ await wakeLockSentinel.release(); } catch (error){ console.warn('[Wake Lock release]', error); }
    wakeLockSentinel = null;
    updateWakeControl('idle');
    return;
  }
  requestScreenWakeLock();
}

function setupDisplayControls(){
  document.getElementById('fullscreenControl')?.addEventListener('click', toggleFullscreen);
  document.getElementById('wakeControl')?.addEventListener('click', toggleWakeLock);
  document.addEventListener('fullscreenchange', updateFullscreenControl);
  document.addEventListener('webkitfullscreenchange', updateFullscreenControl);
  document.addEventListener('keydown', event => {
    if (event.key.toLowerCase() === 'f' && !event.ctrlKey && !event.metaKey && !event.altKey){
      toggleFullscreen();
    }
  });
  updateFullscreenControl();
  requestScreenWakeLock();
}

function scheduleDailyReload(){
  const now = new Date();
  const next = new Date(now);
  next.setHours(CONFIG.DAILY_RELOAD_HOUR, CONFIG.DAILY_RELOAD_MINUTE, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  window.setTimeout(() => location.reload(), Math.max(1000, next - now));
}


function setPublicSyncWarning(message){
  const el = document.getElementById('publicSyncWarning');
  if (!el) return;

  const clean = String(message || '').trim();
  if (!clean){
    el.textContent = '';
    el.classList.remove('show');
    return;
  }

  el.textContent = clean;
  el.classList.add('show');
}

function setupResilience(){
  window.addEventListener('online', () => {
    setPublicSyncWarning('');
    updateSyncStatus();
    syncNow('online');
    requestScreenWakeLock();
  });
  window.addEventListener('offline', () => {
    updateSyncStatus();
    setPublicSyncWarning('การเชื่อมต่ออินเทอร์เน็ตขัดข้อง ข้อมูลคิวอาจไม่เป็นปัจจุบัน');
  });
  window.addEventListener('focus', () => syncNow('focus'));
  window.addEventListener('pageshow', () => syncNow('pageshow'));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible'){
      lastHeartbeatAt = Date.now();
      updateSessionProgress();
      updateSyncStatus();
      syncNow('visible');
      requestScreenWakeLock();
    }
  });

  window.setInterval(() => {
    const now = Date.now();
    const drift = now - lastHeartbeatAt;
    lastHeartbeatAt = now;
    if (drift > 90000){
      updateSessionProgress();
      syncNow('watchdog-resume');
      requestScreenWakeLock();
    } else if (lastSuccessfulSyncAt && now - lastSuccessfulSyncAt >= CONFIG.STALE_WARN_MS){
      setPublicSyncWarning('ข้อมูลคิวอาจล่าช้า ระบบกำลังเชื่อมต่อใหม่');
      syncNow('stale-watchdog');
    }
    updateSyncStatus();
  }, 30000);

  scheduleDailyReload();
}

    canvas.style.height = h + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);

    particles = Array.from({length:PARTICLE_COUNT}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: 0.7 + Math.random() * 1.8,
      a: 0.04 + Math.random() * 0.18,
      vx: -0.035 + Math.random() * 0.07,
      vy: -0.07 - Math.random() * 0.11,
      phase: Math.random() * Math.PI * 2,
      warm: Math.random() > 0.35
    }));
  }

  function draw(){
    ctx.clearRect(0,0,w,h);

    const t = performance.now() * 0.001;

    currentX += (targetX - currentX) * 0.025;
    currentY += (targetY - currentY) * 0.025;

    document.documentElement.style.setProperty('--v32-parallax-x', currentX.toFixed(3));
    document.documentElement.style.setProperty('--v32-parallax-y', currentY.toFixed(3));

    const lx = 0.24 + currentX * 0.0022;
    const ly = 0.16 + currentY * 0.0018;
    document.documentElement.style.setProperty('--v32-light-x', `${(lx*100).toFixed(2)}%`);
    document.documentElement.style.setProperty('--v32-light-y', `${(ly*100).toFixed(2)}%`);

    for (const p of particles){
      p.x += p.vx + Math.sin(t * 0.35 + p.phase) * 0.025;
      p.y += p.vy;

      if (p.y < -12){ p.y = h + 12; p.x = Math.random() * w; }
      if (p.x < -12) p.x = w + 12;
      if (p.x > w + 12) p.x = -12;

      const pulse = 0.55 + Math.sin(t * 0.9 + p.phase) * 0.45;
      const alpha = p.a * pulse;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.warm
        ? `rgba(236,199,116,${alpha})`
        : `rgba(255,247,225,${alpha * 0.85})`;
      ctx.shadowColor = p.warm
        ? `rgba(225,181,88,${alpha * 1.4})`
        : `rgba(255,250,232,${alpha})`;
      ctx.shadowBlur = 8 + p.r * 3;
      ctx.fill();
    }

    ctx.shadowBlur = 0;
    animationId = requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize, {passive:true});

  window.addEventListener('pointermove', (e) => {
    targetX = ((e.clientX / Math.max(1,w)) - 0.5) * 12;
    targetY = ((e.clientY / Math.max(1,h)) - 0.5) * 10;
  }, {passive:true});

  window.addEventListener('pointerleave', () => {
    targetX = 0;
    targetY = 0;
  }, {passive:true});

  document.addEventListener('visibilitychange', () => {
    if (document.hidden){
      if (animationId) cancelAnimationFrame(animationId);
      animationId = 0;
    }else if (!animationId){
      animationId = requestAnimationFrame(draw);
    }
  }, {passive:true});

  resize();
  animationId = requestAnimationFrame(draw);
})();
</script>


<script>
(function(){
  const updateMotionState = () => {
    document.body.classList.toggle('motion-paused', document.hidden);
  };
  document.addEventListener('visibilitychange', updateMotionState, {passive:true});
  updateMotionState();
})();
</script>

<script>

function updateSpaDebugPanel(){
  const panel = document.getElementById('spaDebugPanel');
  if (!panel || !document.body.classList.contains('spa-debug')) return;
  const s = lastSyncStats || {};
  panel.textContent =
    `BUILD ${CONFIG.BUILD} | source: ${s.source || '-'} | rows: ${s.rows ?? '-'} | busy: ${s.busyRows ?? '-'} | bookings: ${s.bookings ?? '-'} | explicit: ${s.explicitRows ?? '-'} | current-check: ${s.currentBusySanityOk ?? '-'} | sync: ${formatSyncTime(lastSuccessfulSyncAt,true)} | error: ${lastSyncError?.message || '-'}`;
}

if (new URLSearchParams(location.search).get('debug') === '1'){
  document.body.classList.add('spa-debug');
  window.setInterval(updateSpaDebugPanel, 1000);
}

</script>
