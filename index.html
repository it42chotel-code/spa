function spaQueueCallback(data){callbackReceived=true;clearTimeout(watchdog);clearTimeout(timer);if(!data||data.ok===false){showError('Backend ตอบกลับแต่เกิดข้อผิดพลาด: '+((data&&data.error)||'Unknown error'));document.getElementById('statusLine').textContent='เชื่อมต่อ Apps Script ได้ แต่ Backend มีข้อผิดพลาด';timer=setTimeout(loadQueue,15000);return}render(data);timer=setTimeout(loadQueue,(Number(data.refreshSec)||12)*1000)}
function loadQueue(){callbackReceived=false;clearTimeout(watchdog);const old=document.getElementById('jsonp');if(old)old.remove();const s=document.createElement('script');s.id='jsonp';s.src=API+'?api=queue&callback=spaQueueCallback&_='+Date.now();s.onerror=()=>{clearTimeout(watchdog);showError('เชื่อมต่อ Apps Script ไม่ได้: ตรวจ Deploy > Execute as Me > Who has access = Anyone และต้อง Deploy New version');document.getElementById('statusLine').textContent='API connection failed';timer=setTimeout(loadQueue,15000)};s.onload=()=>{setTimeout(()=>{if(!callbackReceived){showError('Apps Script เปิดได้ แต่ไม่ได้ส่ง Queue API กลับมา — มักเกิดจากยังไม่ได้ Deploy โค้ด v7.3 หรือ Web App ไม่ได้ตั้งเป็น Anyone');document.getElementById('statusLine').textContent='API callback missing'}},800)};document.body.appendChild(s);watchdog=setTimeout(()=>{if(!callbackReceived){showError('หมดเวลารอ Queue API — โปรดทดสอบ URL ?api=ping&callback=spaQueueCallback');document.getElementById('statusLine').textContent='API timeout'}},10000)}
function render(data){hideError();const arr=(data&&data.therapists)||[];document.getElementById('cards').innerHTML=arr.map(card).join('');document.getElementById('statusLine').textContent='อัปเดตล่าสุด '+new Date(data.serverTime||Date.now()).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false})+' • ระบบอัปเดตอัตโนมัติ';if(!arr.length)showError('ยังไม่พบข้อมูลหมอนวดในระบบ')}
function card(t){const busy=t.state==='IN_SERVICE'||t.state==='RESERVED_NOW';const arrived=t.state==='ARRIVED';const cls=busy?'busy':arrived?'arrived':'available';const badge=busy?'ไม่ว่าง':arrived?'ลูกค้ามาถึง':'ว่าง';let cur;if(t.current){const st=t.state==='IN_SERVICE'?'กำลังให้บริการ':t.state==='ARRIVED'?'พร้อมเริ่มบริการ':'มีคิวในขณะนี้';cur=`<div class="current"><div class="eyebrow">คิวปัจจุบัน</div><div class="bigState red">${st}</div><div class="rows"><div class="row"><span>เวลา</span><b>${tm(t.current.start)}–${tm(t.current.end)}</b></div><div class="row"><span>คอร์ส</span><b>${esc(shorten(t.current.services,38))}</b></div></div></div>`}else{cur=`<div class="current availableBox"><div class="eyebrow">สถานะปัจจุบัน</div><div class="bigState green">พร้อมให้บริการ</div><div class="rows"><div class="row"><span>สถานะ</span><b>ว่างในขณะนี้</b></div>${t.next?`<div class="row"><span>ว่างถึง</span><b>${tm(t.next.start)} น.</b></div>`:'<div class="row"><span>วันนี้</span><b>ยังไม่มีคิวถัดไป</b></div>'}</div></div>`}const nxt=t.next?`<div class="next"><strong>${tm(t.next.start)}–${tm(t.next.end)} • มีคิวจองแล้ว</strong><small>${esc(shorten(t.next.services,44))}</small></div>`:`<div class="none">ยังไม่มีคิวจองเพิ่มเติมวันนี้</div>`;return `<article class="card"><div class="cardHead"><div class="person"><div class="avatar">♟</div><div class="name">${esc(t.nameTh)}<small>${esc(t.nameEn)}</small></div></div><span class="badge ${cls}">● ${badge}</span></div><div class="cardBody">${cur}<div class="nextTitle">คิวถัดไป</div>${nxt}</div></article>`}
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('date').textContent=d.toLocaleDateString('th-TH',{day:'2-digit',month:'long',year:'numeric'})}function tm(v){if(!v)return'-';return new Date(v).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shorten(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}function showError(s){const e=document.getElementById('error');e.textContent=s;e.style.display='block'}function hideError(){document.getElementById('error').style.display='none'}setInterval(tick,1000);tick();loadQueue();
</script></body></html>
