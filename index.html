<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>42C Spa • TV Queue Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe5d3;--panel:#fffdf9;--brown:#81583b;--brown2:#6c472f;--gold:#d6b55f;--ink:#2d2118;--muted:#9a8977;--green:#2e7a53;--greenbg:#edf8f0;--red:#b44b3d;--redbg:#fff0ed;--line:#eadfce;--shadow:0 18px 48px rgba(74,52,32,.13)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:'Noto Sans Thai',sans-serif;color:var(--ink);background:radial-gradient(circle at 50% -20%,#fff 0,#f7f0e5 36%,var(--bg) 100%)}
.tv{height:100vh;min-height:720px;padding:2.1vh 2vw 1.4vh;display:grid;grid-template-rows:auto 1fr auto;gap:1.6vh}
.header{display:grid;grid-template-columns:240px 1fr 250px;align-items:center;gap:28px}
.logoWrap{height:118px;display:flex;align-items:center;justify-content:flex-start}
.logo{display:block;max-width:220px;max-height:108px;object-fit:contain}
.headline{text-align:center}
.headline h1{font-family:'Noto Serif Thai',serif;margin:0;color:#6d4a33;font-size:clamp(38px,3vw,58px);line-height:1.05}
.headline p{margin:8px 0 0;color:#a08c77;font-size:clamp(14px,1vw,19px)}
.clock{justify-self:end;min-width:230px;background:linear-gradient(135deg,#7c5337,#946b49);color:#fff6e4;border-radius:25px;padding:15px 22px;text-align:center;box-shadow:var(--shadow)}
.clock strong{display:block;font-size:clamp(34px,2.5vw,52px);line-height:1;color:#f6d77e;letter-spacing:1px}
.clock small{display:block;margin-top:8px;font-size:14px;color:#f4e7d2}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.35vw;min-height:0}
.card{background:rgba(255,253,249,.96);border:1px solid rgba(129,88,59,.12);border-radius:26px;overflow:hidden;box-shadow:var(--shadow);display:grid;grid-template-rows:auto auto 1fr;min-height:0}
.cardHead{background:linear-gradient(135deg,#81583b,#956a49);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;min-height:86px}
.person{display:flex;align-items:center;gap:13px}
.avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#f5df92,#d6ae53);border:3px solid rgba(255,255,255,.38);display:grid;place-items:center;color:#765234;font-size:22px}
.name{font-size:clamp(21px,1.45vw,30px);font-weight:800;line-height:1.05}
.name small{display:block;font-size:13px;color:#ecd9bd;margin-top:5px}
.badge{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:800;white-space:nowrap}
.badge.free{background:#eaf7ec;color:#267247}.badge.busy{background:#ffe7e2;color:#a94436}
.current{margin:14px 14px 9px;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:17px;padding:15px 16px;background:linear-gradient(135deg,#fbfffc,#f1f8f3)}
.current.busyNow{border-left-color:var(--red);background:linear-gradient(135deg,#fffaf8,#fff0ed)}
.eyebrow{font-size:14px;color:#a19487;font-weight:700}
.state{font-size:clamp(28px,1.95vw,38px);font-weight:800;color:var(--green);margin-top:2px;line-height:1.15}
.current.busyNow .state{color:var(--red)}
.currentMeta{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px}
.pill{font-size:15px;border:1px solid #eadfce;background:#fff;border-radius:999px;padding:7px 11px;color:#6d5c4c;font-weight:600}
.body{min-height:0;padding:4px 14px 13px;display:grid;grid-template-rows:auto auto 1fr;gap:9px}
.sectionLabel{text-align:center;font-size:15px;color:#958573;margin-top:2px;font-weight:700}
.schedule{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{height:42px;border-radius:11px;border:1px solid;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:16px}
.slot .time{font-weight:800;font-size:17px}.slot .st{font-weight:800;font-size:16px}
.slot.free{background:var(--greenbg);border-color:#d2e9d7;color:var(--green)}
.slot.busy{background:var(--redbg);border-color:#f2d1ca;color:var(--red)}
.bookings{min-height:0;overflow:hidden;display:grid;align-content:start;gap:8px}
.booking{border:1px solid #e8d8b7;border-left:5px solid var(--gold);background:#fffaf0;border-radius:12px;padding:10px 12px}
.booking strong{display:block;font-size:16px;color:#6a4c36;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.booking small{display:block;font-size:13px;color:#9a8d7d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.noBooking{text-align:center;color:#b1a497;font-size:14px;padding:8px 0}
.footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}
.cta{grid-column:2;background:rgba(255,253,249,.96);border:1px solid rgba(129,88,59,.14);border-radius:19px;padding:10px 44px;min-width:620px;text-align:center;font-family:'Noto Serif Thai',serif;font-size:clamp(18px,1.55vw,29px);color:#4c3526;box-shadow:var(--shadow)}
.status{justify-self:end;color:#aa9a88;font-size:10px;white-space:nowrap}
.warn{position:fixed;left:50%;top:132px;transform:translateX(-50%);z-index:20;background:#fff5dc;color:#825d20;border:1px solid #ead49b;border-radius:12px;padding:8px 16px;display:none;font-size:12px}
@media(max-width:1100px){html,body{overflow:auto}.tv{height:auto;min-height:100vh}.header{grid-template-columns:1fr}.logoWrap,.clock{justify-content:center;justify-self:center}.cards{grid-template-columns:1fr}.footer{grid-template-columns:1fr}.cta{grid-column:auto;min-width:0}}
</style>
</head>
<body>
<div class="tv">
<header class="header">
  <div class="logoWrap"><img class="logo" src="assets/42c-spa-logo.svg?v=20260916b" alt="42C Spa"></div>
  <div class="headline"><h1>ยินดีต้อนรับสู่บริการสปา</h1><p>กรุณาตรวจสอบคิวว่างของหมอนวด • Please check therapist availability</p></div>
  <div class="clock"><strong id="clock">--:--</strong><small id="date">--</small></div>
</header>
<div id="warn" class="warn"></div>
<main id="cards" class="cards"></main>
<footer class="footer"><div></div><div class="cta">✧ สามารถจองคิวได้ที่ Front Reception</div><div id="status" class="status">กำลังโหลดข้อมูล…</div></footer>
</div>
<script>
const SHEET_ID='1fQ2ieIc0qBhrgx6LwlPQ53HASxvS3QBMs04gcwTfMb8';
const GID='1985324533';
const TH={'1':{th:'ภา',en:'Pa'},'2':{th:'เมล',en:'Mel'},'3':{th:'จอย',en:'Joy'}};
const CACHE='42c-spa-tv-v13';
let timer=null;
function gviz(timeout=7000){return new Promise((resolve,reject)=>{const cb='__g'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const clean=()=>{if(done)return;done=true;clearTimeout(to);try{delete window[cb]}catch(_){window[cb]=undefined}s.remove()};window[cb]=x=>{clean();resolve(x)};s.onerror=()=>{clean();reject(new Error('load failed'))};const tqx=encodeURIComponent('out:json;responseHandler:'+cb);s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&headers=1&tqx=${tqx}&_=${Date.now()}`;document.head.appendChild(s);const to=setTimeout(()=>{clean();reject(new Error('timeout'))},timeout)})}
function cv(c){if(!c)return'';return String(c.f!=null?c.f:(c.v!=null?c.v:'')).trim()}
function tmin(v){v=String(v||'').trim().replace('.',':');const m=v.match(/(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null}
function tl(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function nowMin(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());return Number(p.find(x=>x.type==='hour').value)*60+Number(p.find(x=>x.type==='minute').value)}
function parse(res){if(!res||res.status==='error'||!res.table)throw new Error('invalid sheet');const rows=(res.table.rows||[]).map(r=>(r.c||[]).map(cv));const n=nowMin();return ['1','2','3'].map(id=>{const rr=rows.filter(r=>String(r[0]||'').trim()===id&&tmin(r[1])!=null).sort((a,b)=>tmin(a[1])-tmin(b[1]));const slots=rr.map(r=>({time:tmin(r[1]),status:String(r[2]||'').trim()==='ไม่ว่าง'?'ไม่ว่าง':'ว่าง',customer:r[3]||'',course:r[6]||'',hours:Number(String(r[7]||'').replace(',','.'))||0,start:tmin(r[11]),end:tmin(r[12])}));const busy=slots.filter(x=>x.status==='ไม่ว่าง');const groups=[];for(const r of busy){const key=[r.customer,r.course,r.hours,r.start,r.end].join('|');const p=groups[groups.length-1];if(p&&p.key===key&&r.time===p.last+60){p.rows.push(r);p.last=r.time}else groups.push({key,rows:[r],first:r.time,last:r.time})}const bookings=groups.map(g=>{const r=g.rows[0],start=r.start!=null?r.start:g.first,end=r.end!=null?r.end:(r.hours>0?start+Math.round(r.hours*60):g.last+60);return{start,end,course:r.course||'คิวจอง'}}).sort((a,b)=>a.start-b.start);const current=bookings.find(b=>n>=b.start&&n<b.end)||null;const upcoming=bookings.filter(b=>b.end>n);return{id,name:TH[id],slots,bookings:upcoming,current}})}
function card(t){const busy=!!t.current;const current=busy?`<div class="current busyNow"><div class="eyebrow">สถานะปัจจุบัน</div><div class="state">ไม่ว่าง • กำลังให้บริการ</div><div class="currentMeta"><span class="pill">${tl(t.current.start)}–${tl(t.current.end)}</span><span class="pill">${esc(shorten(t.current.course,30))}</span></div></div>`:`<div class="current"><div class="eyebrow">สถานะปัจจุบัน</div><div class="state">พร้อมให้บริการ</div></div>`;const sh=t.slots.map(s=>`<div class="slot ${s.status==='ไม่ว่าง'?'busy':'free'}"><span class="time">${tl(s.time)}</span><span class="st">${s.status}</span></div>`).join('');const bh=t.bookings.length?t.bookings.slice(0,3).map(b=>`<div class="booking"><strong>${tl(b.start)}–${tl(b.end)} • มีคิวจองแล้ว</strong><small>${esc(shorten(b.course,48))}</small></div>`).join(''):`<div class="noBooking">ยังไม่มีคิวเพิ่มเติมวันนี้</div>`;return `<section class="card"><div class="cardHead"><div class="person"><div class="avatar">✦</div><div class="name">${t.name.th}<small>${t.name.en}</small></div></div><div class="badge ${busy?'busy':'free'}">● ${busy?'ไม่ว่าง':'ว่าง'}</div></div>${current}<div class="body"><div class="sectionLabel">ตารางคิววันนี้</div><div class="schedule">${sh}</div><div class="bookings">${bh}</div></div></section>`}
function render(d){document.getElementById('cards').innerHTML=d.map(card).join('')}
async function load(){clearTimeout(timer);try{const d=parse(await gviz());render(d);localStorage.setItem(CACHE,JSON.stringify({at:Date.now(),d}));document.getElementById('warn').style.display='none';document.getElementById('status').textContent='อัปเดตทุก 10 วินาที'}catch(e){let c=null;try{c=JSON.parse(localStorage.getItem(CACHE)||'null')}catch(_){}if(c&&Date.now()-c.at<600000){render(c.d);const w=document.getElementById('warn');w.textContent='เชื่อมต่อข้อมูลล่าสุดไม่ได้ • กำลังแสดงข้อมูลล่าสุด';w.style.display='block'}document.getElementById('status').textContent='กำลังเชื่อมต่อใหม่…'}timer=setTimeout(load,10000)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shorten(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('date').textContent=d.toLocaleDateString('th-TH',{timeZone:'Asia/Bangkok',day:'2-digit',month:'long',year:'numeric'})}
setInterval(tick,1000);tick();load();
</script>
</body></html>
