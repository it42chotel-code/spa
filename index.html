<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42C Spa • Queue Display</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet"><style>:root{--cream:#f4eee2;--cream2:#ebe1d0;--brown:#735039;--gold:#c4a259;--ink:#2a211a;--green:#2f6d4b;--red:#a74b39;--line:rgba(97,72,50,.13);--shadow:0 22px 52px rgba(68,48,31,.13)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Noto Sans Thai',sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream),var(--cream2));padding:clamp(20px,2.6vw,42px)}.shell{max-width:1500px;margin:auto}.hero{display:grid;grid-template-columns:190px 1fr 240px;gap:24px;align-items:center;padding-bottom:22px;border-bottom:1px solid rgba(97,72,50,.14)}.logoBox{width:180px;height:112px;background:#fffdf8;border-radius:24px;display:grid;place-items:center;box-shadow:var(--shadow);border:1px solid rgba(196,162,89,.28);overflow:hidden;padding:4px}.logoBox img{width:100%;height:100%;object-fit:contain}.welcome{text-align:center}.welcome h1{font-family:'Noto Serif Thai',serif;font-size:clamp(30px,3.2vw,48px);margin:0;color:#6f4e36}.welcome p{margin:8px 0 0;color:#95846f}.clock{justify-self:end;background:linear-gradient(135deg,#7b553a,#8e6747);color:#fff3d2;border-radius:22px;padding:18px 24px;text-align:center;box-shadow:var(--shadow);min-width:215px}.clock strong{display:block;font-size:34px;color:#f1d790}.clock small{display:block;margin-top:4px}.error,.warn{display:none;margin-top:14px;padding:12px 16px;border-radius:14px}.error{background:#fff0ed;border:1px solid #efc8c0;color:#a23d31}.warn{background:#fff8e6;border:1px solid #ead7a7;color:#8a641d}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:20px}.card{background:#fffdf8;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}.cardHead{background:linear-gradient(135deg,#7a5439,#8a6244);color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between}.person{display:flex;gap:13px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#efd995,#d2ad59);border:3px solid rgba(255,255,255,.35);color:#775536;font-size:24px}.name{font-size:22px;font-weight:800}.name small{display:block;font-size:13px;color:#ebd9bd}.badge{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800}.available{background:#e8f4e8;color:#2f6d4b}.busy{background:#fae8e4;color:#a64a38}.cardBody{padding:18px}.current{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:17px;padding:14px;background:#fff}.current.availableBox{border-left-color:var(--green);background:#f5fbf6}.eyebrow{font-size:12px;color:#9c9185;font-weight:700}.bigState{font-size:23px;font-weight:800;margin-top:3px}.green{color:var(--green)}.red{color:var(--red)}.rows{margin-top:9px;display:grid;gap:7px}.row{display:flex;justify-content:space-between;gap:10px;background:#faf7f1;border:1px solid #efe6d7;border-radius:10px;padding:8px 10px;font-size:13px}.row span:first-child{color:#948776}.scheduleTitle{text-align:center;color:#8b7b69;font-size:12px;margin:15px 0 8px}.schedule{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.slot{border-radius:11px;padding:9px 10px;display:flex;justify-content:space-between;gap:8px;font-size:12px;border:1px solid}.slot.free{background:#f1f8f1;border-color:#d2e8d2;color:#2f6d4b}.slot.busySlot{background:#fff0ed;border-color:#f0d0ca;color:#9a4737}.slot .time{font-weight:800}.slot .state{font-weight:700}.bookings{display:grid;gap:8px;margin-top:12px}.booking{border:1px solid #e7d9bf;border-left:4px solid var(--gold);border-radius:13px;padding:10px 12px;background:#fffaf0}.booking strong{font-size:14px;color:#6d4e38}.booking small{display:block;color:#978b7e;margin-top:2px}.cta{margin:22px auto 0;background:#fffdf8;border:1px solid rgba(97,72,50,.15);border-radius:22px;box-shadow:var(--shadow);padding:17px 24px;max-width:1050px;text-align:center;font-family:'Noto Serif Thai',serif;font-size:24px;color:#4a3527}.statusLine{text-align:center;color:#9b8d7c;font-size:12px;margin-top:10px}@media(max-width:1050px){.hero{grid-template-columns:1fr}.logoBox,.clock{justify-self:center}.cards{grid-template-columns:1fr}}@media(max-width:600px){body{padding:14px}.schedule{grid-template-columns:1fr}}</style></head><body><div class="shell"><header class="hero"><div class="logoBox"><img src="assets/42c-spa-logo.svg" alt="42C Spa"></div><div class="welcome"><h1>ยินดีต้อนรับสู่บริการสปา</h1><p>กรุณาตรวจสอบคิวว่างของหมอนวด • Please check therapist availability</p></div><div class="clock"><strong id="clock">--:--</strong><small id="date">--</small></div></header><div id="error" class="error"></div><div id="warn" class="warn"></div><section class="cards" id="cards"></section><div class="cta">✧ สามารถจองคิวได้ที่ Front Reception</div><div class="statusLine" id="statusLine">กำลังเชื่อมต่อระบบคิว…</div></div><script>const SHEET_ID='1fQ2ieIc0qBhrgx6LwlPQ53HASxvS3QBMs04gcwTfMb8',SCHEDULE_GID='1985324533';const THERAPISTS={1:{nameTh:'ภา',nameEn:'Pa'},2:{nameTh:'เมล',nameEn:'Mel'},3:{nameTh:'จอย',nameEn:'Joy'}};const CACHE_KEY='42c_spa_display_v12';let timer=null;function gviz(timeout=7000){return new Promise((resolve,reject)=>{const cb='__gviz'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const clean=()=>{if(done)return;done=true;clearTimeout(to);try{delete window[cb]}catch(_){window[cb]=undefined}s.remove()};window[cb]=x=>{clean();resolve(x)};s.onerror=()=>{clean();reject(new Error('Google Sheet unavailable'))};const tqx=encodeURIComponent('out:json;responseHandler:'+cb);s.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?gid='+SCHEDULE_GID+'&headers=1&tqx='+tqx+'&_='+Date.now();document.head.appendChild(s);const to=setTimeout(()=>{clean();reject(new Error('Sheet timeout'))},timeout)})}function cell(c){if(!c)return'';return String(c.f!=null?c.f:(c.v!=null?c.v:'')).trim()}function timeMin(s){s=String(s||'').trim().replace('.',':');const m=s.match(/(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null}function toLabel(min){return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0')}function fromSheetPayload(res){if(!res||res.status==='error'||!res.table)throw new Error('Sheet response invalid');const rows=(res.table.rows||[]).map(r=>(r.c||[]).map(cell));const now=bangkokMinutes();const therapists=['1','2','3'].map(id=>{const rr=rows.filter(v=>String(v[0]||'').trim()===id&&timeMin(v[1])!=null).sort((a,b)=>timeMin(a[1])-timeMin(b[1]));const slots=rr.map(r=>({time:timeMin(r[1]),status:String(r[2]||'').trim(),customer:r[3]||'',course:r[6]||'',hours:Number(String(r[7]||'').replace(',','.'))||0,startExact:timeMin(r[11]),endExact:timeMin(r[12])}));const groups=[];for(const r of slots.filter(x=>x.status==='ไม่ว่าง')){const key=[r.customer,r.course,r.hours,r.startExact,r.endExact].join('|');const prev=groups[groups.length-1];if(prev&&prev.key===key&&r.time===prev.last+60){prev.rows.push(r);prev.last=r.time}else groups.push({key,rows:[r],first:r.time,last:r.time})}const bookings=groups.map(g=>{const r=g.rows[0],start=r.startExact!=null?r.startExact:g.first,end=r.endExact!=null?r.endExact:(r.hours>0?start+Math.round(r.hours*60):g.last+60);return{start,end,course:r.course||'คิวจอง'}}).sort((a,b)=>a.start-b.start);const current=bookings.find(b=>now>=b.start&&now<b.end)||null;const future=bookings.filter(b=>b.end>now);const t=THERAPISTS[id];return{id,nameTh:t.nameTh,nameEn:t.nameEn,current,bookings:future,slots}});return{serverTime:new Date().toISOString(),therapists}}async function loadQueue(){clearTimeout(timer);try{const d=fromSheetPayload(await gviz());localStorage.setItem(CACHE_KEY,JSON.stringify({at:Date.now(),d}));hideError();hideWarn();render(d);document.getElementById('statusLine').textContent='อ่านข้อมูลจากตารางเวลาหมอนวดโดยตรง • อัปเดตอัตโนมัติทุก 10 วินาที'}catch(e){let c=null;try{c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null')}catch(_){ }if(c&&Date.now()-c.at<10*60*1000){render(c.d);showWarn('เชื่อมต่อข้อมูลล่าสุดไม่ได้ • กำลังแสดงข้อมูลล่าสุดที่อ่านได้')}else showError('ไม่สามารถอ่านข้อมูลจากตารางเวลาหมอนวดได้ กรุณาตรวจสอบสิทธิ์ Google Sheet');timer=setTimeout(loadQueue,12000);return}timer=setTimeout(loadQueue,10000)}function render(d){document.getElementById('cards').innerHTML=(d.therapists||[]).map(card).join('')}function card(t){const busy=!!t.current,badge=busy?'ไม่ว่าง':'ว่าง',cls=busy?'busy':'available';let cur=busy?`<div class="current"><div class="eyebrow">คิวปัจจุบัน</div><div class="bigState red">กำลังมีคิว</div><div class="rows"><div class="row"><span>เวลา</span><b>${toLabel(t.current.start)}–${toLabel(t.current.end)}</b></div><div class="row"><span>คอร์ส</span><b>${esc(shorten(t.current.course,36))}</b></div></div></div>`:`<div class="current availableBox"><div class="eyebrow">สถานะปัจจุบัน</div><div class="bigState green">พร้อมให้บริการ</div></div>`;const slotHtml=t.slots.map(s=>`<div class="slot ${s.status==='ไม่ว่าง'?'busySlot':'free'}"><span class="time">${toLabel(s.time)}</span><span class="state">${s.status==='ไม่ว่าง'?'ไม่ว่าง':'ว่าง'}</span></div>`).join('');const bookingHtml=t.bookings.length?`<div class="bookings">${t.bookings.map(b=>`<div class="booking"><strong>${toLabel(b.start)}–${toLabel(b.end)} • มีคิวจองแล้ว</strong><small>${esc(shorten(b.course,44))}</small></div>`).join('')}</div>`:'';return `<article class="card"><div class="cardHead"><div class="person"><div class="avatar">✦</div><div class="name">${esc(t.nameTh)}<small>${esc(t.nameEn)}</small></div></div><span class="badge ${cls}">● ${badge}</span></div><div class="cardBody">${cur}<div class="scheduleTitle">ตารางคิววันนี้</div><div class="schedule">${slotHtml}</div>${bookingHtml}</div></article>`}function bangkokMinutes(){const ps=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());return Number(ps.find(x=>x.type==='hour').value)*60+Number(ps.find(x=>x.type==='minute').value)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shorten(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('date').textContent=d.toLocaleDateString('th-TH',{timeZone:'Asia/Bangkok',day:'2-digit',month:'long',year:'numeric'})}function showError(s){const e=document.getElementById('error');e.textContent=s;e.style.display='block'}function hideError(){document.getElementById('error').style.display='none'}function showWarn(s){const e=document.getElementById('warn');e.textContent=s;e.style.display='block'}function hideWarn(){document.getElementById('warn').style.display='none'}setInterval(tick,1000);tick();loadQueue();</script></body></html>
