<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42C Spa • Queue Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f4eee2;--cream2:#ebe1d0;--brown:#735039;--gold:#c4a259;--ink:#2a211a;--green:#2f6d4b;--red:#a74b39;--line:rgba(97,72,50,.13);--shadow:0 22px 52px rgba(68,48,31,.13)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Noto Sans Thai',sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--cream),var(--cream2));padding:clamp(20px,2.6vw,42px)}.shell{max-width:1500px;margin:auto}.hero{display:grid;grid-template-columns:190px 1fr 240px;gap:24px;align-items:center;padding-bottom:22px;border-bottom:1px solid rgba(97,72,50,.14)}.logoBox{width:180px;height:112px;background:#fffdf8;border-radius:24px;display:grid;place-items:center;box-shadow:var(--shadow);border:1px solid rgba(196,162,89,.28)}.brandLogo{font-family:Arial,sans-serif;font-weight:900;font-size:52px;letter-spacing:-5px;line-height:1}.brandLogo .c{color:#e63228}.brandLine{width:112px;height:7px;background:#555;margin:4px auto 0}.welcome{text-align:center}.welcome h1{font-family:'Noto Serif Thai',serif;font-size:clamp(30px,3.2vw,48px);margin:0;color:#6f4e36}.welcome p{margin:8px 0 0;color:#95846f}.clock{justify-self:end;background:linear-gradient(135deg,#7b553a,#8e6747);color:#fff3d2;border-radius:22px;padding:18px 24px;text-align:center;box-shadow:var(--shadow);min-width:215px}.clock strong{display:block;font-size:34px;color:#f1d790}.clock small{display:block;margin-top:4px}.error,.warn{display:none;margin-top:14px;padding:12px 16px;border-radius:14px}.error{background:#fff0ed;border:1px solid #efc8c0;color:#a23d31}.warn{background:#fff8e6;border:1px solid #ead7a7;color:#8a641d}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:20px}.card{background:#fffdf8;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow);min-height:400px}.cardHead{background:linear-gradient(135deg,#7a5439,#8a6244);color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between}.person{display:flex;gap:13px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#efd995,#d2ad59);border:3px solid rgba(255,255,255,.35);color:#775536;font-size:24px}.name{font-size:22px;font-weight:800}.name small{display:block;font-size:13px;color:#ebd9bd}.badge{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800}.available{background:#e8f4e8;color:#2f6d4b}.busy{background:#fae8e4;color:#a64a38}.cardBody{padding:20px;display:grid;gap:15px}.current{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:17px;padding:16px;background:#fff}.current.availableBox{border-left-color:var(--green);background:#f5fbf6}.eyebrow{font-size:12px;color:#9c9185;font-weight:700}.bigState{font-size:25px;font-weight:800;margin-top:3px}.green{color:var(--green)}.red{color:var(--red)}.rows{margin-top:10px;display:grid;gap:7px}.row{display:flex;justify-content:space-between;gap:10px;background:#faf7f1;border:1px solid #efe6d7;border-radius:10px;padding:8px 10px;font-size:13px}.row span:first-child{color:#948776}.nextTitle{text-align:center;color:#9b8e7f;font-size:12px}.next{border:1px solid #e7d9bf;border-left:4px solid var(--gold);border-radius:15px;padding:13px 14px;background:#fffaf0}.next strong{font-size:17px;color:#6d4e38}.next small{display:block;color:#978b7e;margin-top:3px}.none{border:1px dashed #ddd4c8;border-radius:15px;padding:18px;text-align:center;color:#999084;background:#faf9f6}.cta{margin:22px auto 0;background:#fffdf8;border:1px solid rgba(97,72,50,.15);border-radius:22px;box-shadow:var(--shadow);padding:17px 24px;max-width:1050px;text-align:center;font-family:'Noto Serif Thai',serif;font-size:24px;color:#4a3527}.statusLine{text-align:center;color:#9b8d7c;font-size:12px;margin-top:10px}@media(max-width:1050px){.hero{grid-template-columns:1fr}.logoBox,.clock{justify-self:center}.cards{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header class="hero"><div class="logoBox"><div><div class="brandLogo">42<span class="c">C</span></div><div class="brandLine"></div></div></div><div class="welcome"><h1>ยินดีต้อนรับสู่บริการสปา</h1><p>กรุณาตรวจสอบคิวว่างของหมอนวด • Please check therapist availability</p></div><div class="clock"><strong id="clock">--:--</strong><small id="date">--</small></div></header><div id="error" class="error"></div><div id="warn" class="warn"></div><section class="cards" id="cards"></section><div class="cta">✧ สามารถจองคิวได้ที่ Front Reception</div><div class="statusLine" id="statusLine">กำลังเชื่อมต่อระบบคิว…</div></div>
<script>
const SHEET_ID='1fQ2ieIc0qBhrgx6LwlPQ53HASxvS3QBMs04gcwTfMb8', SCHEDULE_GID='1985324533';
const THERAPISTS={1:{nameTh:'ภา',nameEn:'Pa'},2:{nameTh:'เมล',nameEn:'Mel'},3:{nameTh:'จอย',nameEn:'Joy'}};
const ENDPOINTS=[
'https://script.google.com/macros/s/AKfycbwdHmWNRVmAHS--ZShqlGj_SauHtpcGI2p7xnFIL41RXlHaOHnEDgfgRlCv9Ls1TRnm/exec',
'https://script.google.com/macros/s/AKfycbxLC5KBR0XZ2az4RiPFaOc54fOr2Mwn83kgOCgfQAuTIBJWjhQypZMVAWtPjwuUmSf0/exec'
];
const CACHE_KEY='42c_spa_display_v11';let timer=null;
function jsonp(url,query,timeout=5000){return new Promise((resolve,reject)=>{const cb='__spa'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const clean=()=>{if(done)return;done=true;clearTimeout(to);try{delete window[cb]}catch(_){window[cb]=undefined}s.remove()};window[cb]=x=>{clean();resolve(x)};s.onerror=()=>{clean();reject(new Error('โหลด API ไม่สำเร็จ'))};s.src=url+(url.includes('?')?'&':'?')+query+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.appendChild(s);const to=setTimeout(()=>{clean();reject(new Error('timeout'))},timeout)})}
function normalizeQueue(raw){if(!raw||raw.ok===false||!Array.isArray(raw.therapists))throw new Error('queue api invalid');return raw}
async function fromAppsScript(){let best=null;for(const u of ENDPOINTS){try{const r=normalizeQueue(await jsonp(u,'api=queue'));const count=r.therapists.reduce((n,t)=>n+(t.current?1:0)+(t.next?1:0),0);if(!best||count>best.count)best={data:r,count};}catch(_){}}if(!best)throw new Error('Apps Script unavailable');if(best.count===0)throw new Error('Apps Script returned no queue');return best.data}
function gviz(timeout=6000){return new Promise((resolve,reject)=>{const cb='__gviz'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const clean=()=>{if(done)return;done=true;clearTimeout(to);try{delete window[cb]}catch(_){window[cb]=undefined}s.remove()};window[cb]=x=>{clean();resolve(x)};s.onerror=()=>{clean();reject(new Error('Google Sheet unavailable'))};const tqx=encodeURIComponent('out:json;responseHandler:'+cb);s.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?gid='+SCHEDULE_GID+'&headers=1&tqx='+tqx+'&_='+Date.now();document.head.appendChild(s);const to=setTimeout(()=>{clean();reject(new Error('Sheet timeout'))},timeout)})}
function cell(c){if(!c)return'';return String(c.f!=null?c.f:(c.v!=null?c.v:'' )).trim()}
function timeMin(s){s=String(s||'').trim().replace('.',':');const m=s.match(/(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null}
function isoAt(min){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());return p+'T'+String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0')+':00+07:00'}
function fromSheetPayload(res){if(!res||res.status==='error'||!res.table)throw new Error('Sheet response invalid');const rows=(res.table.rows||[]).map(r=>(r.c||[]).map(cell));const busy=rows.filter(v=>String(v[2]||'').trim()==='ไม่ว่าง' && ['1','2','3'].includes(String(v[0]||'').trim()));const groups=[];for(const tid of ['1','2','3']){const rr=busy.filter(v=>String(v[0]).trim()===tid).sort((a,b)=>(timeMin(a[1])||0)-(timeMin(b[1])||0));let g=[];for(const r of rr){const key=[r[3],r[4],r[5],r[6],r[7],r[8],r[9],r[10],r[11],r[12],r[13]].join('|');const prev=g[g.length-1];if(prev&&prev.key===key&&timeMin(r[1])===prev.last+60){prev.rows.push(r);prev.last=timeMin(r[1]);}else g.push({tid,key,rows:[r],first:timeMin(r[1]),last:timeMin(r[1])});}groups.push(...g)}
const now=bangkokMinutes();const therapists=['1','2','3'].map(id=>{const gs=groups.filter(g=>g.tid===id).map(g=>{const r=g.rows[0];const exactS=timeMin(r[11]), exactE=timeMin(r[12]);const start=exactS!=null?exactS:g.first;const hours=Number(String(r[7]||'').replace(',','.'));const end=exactE!=null?exactE:(Number.isFinite(hours)&&hours>0?start+Math.round(hours*60):g.last+60);return{startMin:start,endMin:end,services:r[6]||''}}).sort((a,b)=>a.startMin-b.startMin);const current=gs.find(b=>now>=b.startMin&&now<b.endMin)||null,next=gs.find(b=>b.startMin>now)||null,t=THERAPISTS[id];return{id,nameTh:t.nameTh,nameEn:t.nameEn,state:current?'RESERVED_NOW':'AVAILABLE',current:current?{start:isoAt(current.startMin),end:isoAt(current.endMin),services:current.services}:null,next:next?{start:isoAt(next.startMin),end:isoAt(next.endMin),services:next.services}:null}});return{ok:true,source:'sheet',serverTime:new Date().toISOString(),refreshSec:10,therapists}}
async function fetchQueue(){try{return await fromAppsScript()}catch(apiErr){const sh=fromSheetPayload(await gviz());return sh}}
async function loadQueue(){clearTimeout(timer);try{const d=await fetchQueue();localStorage.setItem(CACHE_KEY,JSON.stringify({at:Date.now(),d}));hideError();hideWarn();render(d);document.getElementById('statusLine').textContent=(d.source==='sheet'?'อ่านข้อมูลจากตารางเวลาหมอนวดโดยตรง • ':'')+'อัปเดตอัตโนมัติทุก 10 วินาที'}catch(e){let c=null;try{c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null')}catch(_){ }if(c&&Date.now()-c.at<10*60*1000){render(c.d);showWarn('เชื่อมต่อข้อมูลล่าสุดไม่ได้ • แสดงข้อมูลล่าสุดที่เคยอ่านได้ กรุณาตรวจสอบกับ Front Reception')}else{showError('ไม่สามารถอ่านข้อมูลคิวจาก Apps Script หรือ Google Sheet ได้ กรุณาตรวจสอบสิทธิ์การเข้าถึง')}timer=setTimeout(loadQueue,12000);return}timer=setTimeout(loadQueue,10000)}
function render(d){document.getElementById('cards').innerHTML=(d.therapists||[]).map(card).join('')}
function card(t){const busy=!!t.current;const badge=busy?'ไม่ว่าง':'ว่าง',cls=busy?'busy':'available';let cur=busy?`<div class="current"><div class="eyebrow">คิวปัจจุบัน</div><div class="bigState red">กำลังมีคิว</div><div class="rows"><div class="row"><span>เวลา</span><b>${tm(t.current.start)}–${tm(t.current.end)}</b></div><div class="row"><span>คอร์ส</span><b>${esc(shorten(t.current.services,40))}</b></div></div></div>`:`<div class="current availableBox"><div class="eyebrow">สถานะปัจจุบัน</div><div class="bigState green">พร้อมให้บริการ</div><div class="rows"><div class="row"><span>สถานะ</span><b>ว่างในขณะนี้</b></div>${t.next?`<div class="row"><span>ว่างถึง</span><b>${tm(t.next.start)} น.</b></div>`:'<div class="row"><span>วันนี้</span><b>ยังไม่มีคิวถัดไป</b></div>'}</div></div>`;const nxt=t.next?`<div class="next"><strong>${tm(t.next.start)}–${tm(t.next.end)} • มีคิวจองแล้ว</strong><small>${esc(shorten(t.next.services,46))}</small></div>`:`<div class="none">ยังไม่มีคิวจองเพิ่มเติมวันนี้</div>`;return `<article class="card"><div class="cardHead"><div class="person"><div class="avatar">✦</div><div class="name">${esc(t.nameTh)}<small>${esc(t.nameEn)}</small></div></div><span class="badge ${cls}">● ${badge}</span></div><div class="cardBody">${cur}<div class="nextTitle">คิวถัดไป</div>${nxt}</div></article>`}
function bangkokMinutes(){const ps=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());return Number(ps.find(x=>x.type==='hour').value)*60+Number(ps.find(x=>x.type==='minute').value)}function tm(v){return new Date(v).toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shorten(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('date').textContent=d.toLocaleDateString('th-TH',{timeZone:'Asia/Bangkok',day:'2-digit',month:'long',year:'numeric'})}function showError(s){const e=document.getElementById('error');e.textContent=s;e.style.display='block'}function hideError(){document.getElementById('error').style.display='none'}function showWarn(s){const e=document.getElementById('warn');e.textContent=s;e.style.display='block'}function hideWarn(){document.getElementById('warn').style.display='none'}setInterval(tick,1000);tick();loadQueue();
</script></body></html>
