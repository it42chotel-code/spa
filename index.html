  }

  .board{ max-width: 1400px; margin: 0 auto; position: relative; z-index: 1; }

  /* ---------- Header ---------- */
  .header{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap: 24px;
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .brand{ justify-self:start; }
  .clock-box{ justify-self:end; }

  .brand{
    display:flex;
    align-items:center;
    gap:16px;
  }

  .brand-badge{
    width: 150px; height: 93px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow-lift);
    flex-shrink:0;
    padding: 10px 14px;
    animation: logoFloat 5s ease-in-out infinite;
  }
  @keyframes logoFloat{
    0%, 100%{ transform: translateY(0); }
    50%{ transform: translateY(-4px); }
  }
  .brand-badge img{
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .title-block{ flex:1; min-width:280px; text-align:center; }
  .title-th{
    font-family: var(--font-thai);
    font-weight:700;
    font-size: clamp(26px, 3.4vw, 42px);
    letter-spacing: .2px;
    background: linear-gradient(100deg, var(--espresso) 40%, var(--gold) 50%, var(--espresso) 60%);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: var(--espresso);
    animation: titleShimmer 7s ease-in-out infinite;
  }
  @keyframes titleShimmer{
    0%{ background-position: 100% 0; }
    100%{ background-position: -100% 0; }
  }
  .title-en{
    font-family: var(--font-english);
    font-weight:600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    font-size: clamp(12px, 1.2vw, 15px);
    margin-top: 4px;
  }
  .subtitle{
    margin-top: 10px;
    color: var(--muted);
    font-size: 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .subtitle .rule{ width:44px; height:1px; background: var(--gold); opacity:.6; }

  .clock-box{
    background: linear-gradient(160deg, var(--espresso), var(--espresso-2));
    color: #F4EEE0;
    border-radius: 16px;
    padding: 12px 22px;
    min-width: 210px;
    text-align:center;
    box-shadow: var(--shadow-lift);
  }
  .clock-time{
    font-family: var(--font-clock);
    font-weight:600;
    font-size: 30px;
    letter-spacing: 2px;
    color: var(--gold-light);
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .clock-date{ font-size: 12px; color: var(--gold-light); margin-top: 6px; line-height:1.6; font-family: 'Inter', sans-serif; letter-spacing: 0.4px; }

  /* ---------- Status strip ---------- */
  .sync-strip{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size: 12px; color: var(--muted);
    margin-bottom: 22px;
    width: fit-content;
    margin-left: auto; margin-right: auto;
    padding: 7px 16px;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--available); }
  .dot.warn{ background:#C08A2E; }
  .dot.pulse{ animation: pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .clock-colon{ animation: colonBlink 2s steps(1) infinite; margin: 0 1px; }
  @keyframes colonBlink{ 0%,49%{opacity:1;} 50%,100%{opacity:.25;} }

  /* ---------- Cards grid ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 26px;
  }

  .card{
    background: var(--card-bg);
    border-radius: 20px;
    overflow:hidden;
    box-shadow: var(--shadow-lift);
    border: 1px solid var(--line);
    position: relative;
  }
  .card::before{
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
    background-size: 200% 100%;
    animation: shimmerSweep 5s linear infinite;
    z-index: 2;
  }
  @keyframes shimmerSweep{
    0%{ background-position: 0% 0; }
    100%{ background-position: -200% 0; }
  }

  /* One-time entrance animation, applied only on first paint */
  .card.card-enter{ animation: cardEnter 0.6s ease-out both; }
  @keyframes cardEnter{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* Status-change flash: briefly highlights a card whose status just changed */
  .card.status-flash{ animation: statusFlash 1.3s ease-out; }
  @keyframes statusFlash{
    0%{ box-shadow: var(--shadow-lift), 0 0 0 0 rgba(198,162,77,0.55); }
    30%{ box-shadow: var(--shadow-lift), 0 0 0 8px rgba(198,162,77,0.25); }
    100%{ box-shadow: var(--shadow-lift), 0 0 0 0 rgba(198,162,77,0); }
  }
  .status-icon.icon-flash{ animation: iconPop 0.5s ease-out; }
  @keyframes iconPop{
    0%{ transform: scale(1); }
    40%{ transform: scale(1.25); }
    100%{ transform: scale(1); }
  }

  .card-top{
    background: linear-gradient(120deg, var(--espresso), var(--espresso-2));
    padding: 18px 20px;
    display:flex;
    align-items:center;
    gap:16px;
  }

  .avatar{
    width: 64px; height:64px;
    border-radius: 50%;
    flex-shrink:0;
    background: var(--gold-light);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    border: 2px solid var(--gold);
    box-shadow: 0 0 0 3px rgba(244,238,224,0.18), 0 4px 10px rgba(0,0,0,0.18);
  }
  .avatar-wrap{ position: relative; flex-shrink:0; }
  .avatar-wrap.avatar-live::after{
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid #7FD99A;
    animation: liveRing 2.2s ease-out infinite;
    pointer-events: none;
  }
  @keyframes liveRing{
    0%{ transform: scale(0.85); opacity: 0.9; }
    100%{ transform: scale(1.25); opacity: 0; }
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .avatar svg{ width: 60%; height:60%; opacity:.55; }

  .card-name-th{
    color:#fff;
    font-family: var(--font-thai);
    font-weight:700;
    font-size: 21px;
  }
  .card-name-en{
    color: var(--gold-light);
    font-size: 13px;
    font-family: var(--font-english);
    margin-top: 2px;
  }

  .pill{
    margin-left:auto;
    display:flex; align-items:center; gap:6px;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight:700;
    letter-spacing: 0.2px;
    white-space:nowrap;
    flex-shrink:0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.10);
  }
  .pill.available{
    background: var(--available-bg); color: var(--available);
    animation: breatheGlow 2.6s ease-in-out infinite;
  }
  @keyframes breatheGlow{
    0%, 100%{ box-shadow: 0 2px 6px rgba(0,0,0,0.10), 0 0 0 0 rgba(47,107,69,0.0); }
    50%{ box-shadow: 0 2px 6px rgba(0,0,0,0.10), 0 0 0 5px rgba(47,107,69,0.14); }
  }
  .pill.busy{ background: var(--busy-bg); color: var(--busy); }
  .pill.off{ background: #EAE4D8; color: var(--muted); }
  .pill-dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }

  .card-body{ padding: 22px; }

  .status-row{
    display:flex; align-items:center; gap:16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .status-icon{ width:46px; height:46px; flex-shrink:0; border-radius: 50%; display:flex; align-items:center; justify-content:center; padding:8px; }
  .status-icon.avail-icon{ background: var(--available-bg); }
  .status-icon.busy-icon{ background: var(--busy-bg); }
  .status-icon.off-icon{ background: #EAE4D8; }
  .status-icon svg{ width:100%; height:100%; }
  .status-label{ font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
  .status-value{
    font-family: var(--font-thai);
    font-weight:700;
    font-size: 22px;
    line-height:1.3;
  }
  .status-value.available{ color: var(--available); }
  .status-value.busy{ color: var(--busy); }
  .status-value.off{ color: var(--muted); }

  .card.card-off{ opacity: 0.82; }
  .card.card-off .card-top{ filter: grayscale(0.4); }

  .day-off-body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 44px 20px;
    min-height: 200px;
  }
  .day-off-icon{ width:56px; height:56px; margin-bottom:14px; }
  .day-off-icon svg{ width:100%; height:100%; }
  .day-off-text{
    font-weight:800;
    font-size: 40px;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .day-off-sub{
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .status-hint{ font-size: 12px; color: var(--muted); margin-top:2px; }
  .status-hint.busy{ color: var(--busy); font-weight:600; font-size: 13px; }

  .next-label{
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.6px;
    display:flex; align-items:center; gap:10px;
    margin-bottom: 12px;
  }
  .next-label .rule{ flex:1; height:1px; background: var(--line); }

  .next-box{
    display:flex; align-items:center; gap:14px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    border-radius: 14px;
    padding: 12px 14px;
    transition: opacity .2s ease;
  }
  .next-box + .next-box{ margin-top: 8px; }
  .next-box-later{ opacity: 0.72; padding: 9px 14px; }
  .next-box-empty{ border-style: dashed; background: transparent; }
  .next-box-first{ animation: nextHourPulse 3s ease-in-out infinite; }
  @keyframes nextHourPulse{
    0%, 100%{ border-color: var(--line); }
    50%{ border-color: var(--gold); }
  }
  .next-box-icon{
    width: 38px; height:38px; flex-shrink:0;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    padding: 8px;
  }
  .next-box svg{ width:100%; height:100%; color: var(--muted); }
  .next-th{ font-size: 18px; font-weight:700; }
  .next-th.avail{ color: var(--available); }
  .next-th.booked{ color: var(--booking-brown); }
  /* Final queue notice: dark neutral tone so it does not look like an available slot */
  .next-th.no-more{ color: #4A4A4A; }
  .next-en{ font-size: 11px; color: var(--muted); font-family: var(--font-english); text-transform: uppercase; letter-spacing: 0.6px; }

  /* Customer information shown on current and upcoming booked queues */
  .customer-info{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:7px;
  }
  .customer-info-item{
    display:inline-flex;
    align-items:center;
    min-height:26px;
    padding:4px 9px;
    border-radius:999px;
    border:1px solid rgba(107,74,50,.11);
    background:rgba(255,253,248,.68);
    color:#5B4A3B;
    font-size:12px;
    font-weight:650;
    line-height:1.25;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.65);
  }
  .state-busy .status-hint .customer-info{ margin-top:8px; }
  .state-busy .status-hint .customer-info-item{
    color:#60483D;
    background:rgba(255,248,244,.72);
    border-color:rgba(166,70,47,.13);
  }
  .customer-info-item.customer-type{
    background:rgba(198,162,77,.10);
    border-color:rgba(198,162,77,.22);
  }
  .current-until{
    margin-top:7px;
    font-size:12px;
    font-weight:700;
    color:var(--busy);
  }
  @media (max-width:640px){
    .customer-info{ gap:5px; }
    .customer-info-item{ font-size:11px; padding:4px 8px; }
  }

  /* ---------- Footer ---------- */
  .footer{
    margin-top: 26px;
    display:flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: stretch;
  }

  .footer-illustration{
    flex: 0 0 140px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .walkin-wide{ flex: 1 1 100%; }

  .walkin{
    flex: 2 1 420px;
    border: 1px solid var(--line);
    background: var(--card-bg);
    border-radius: 18px;
    padding: 22px 26px;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:18px;
    box-shadow: var(--shadow-lift);
  }
  .walkin-icon{
    width: 50px; height:50px; border-radius:50%;
    background: linear-gradient(160deg, var(--espresso), var(--espresso-2));
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    animation: walkinPulse 2.8s ease-in-out infinite;
  }
  @keyframes walkinPulse{
    0%, 100%{ box-shadow: 0 4px 10px rgba(0,0,0,0.18), 0 0 0 0 rgba(198,162,77,0.35); }
    50%{ box-shadow: 0 4px 10px rgba(0,0,0,0.18), 0 0 0 7px rgba(198,162,77,0); }
  }
  .walkin-icon svg{ width:24px; height:24px; color: var(--gold-light); }
  .walkin-th{ font-family: var(--font-thai); font-weight:700; font-size:23px; line-height:1.4; }

  .empty-state, .error-state{
    text-align:center;
    padding: 60px 20px;
    color: var(--muted);
  }

  @media (max-width: 640px){
    .header{ grid-template-columns: 1fr; }
    .brand{ justify-self:center; }
    .clock-box{ justify-self:center; width:100%; }
  }


  /* ============================================================
     V4.3 PREMIUM VISUAL SYSTEM — CSS motion + JS-enhanced ambience
     ============================================================ */
  :root{
    --glass: rgba(255,253,248,0.82);
    --glass-strong: rgba(255,253,248,0.94);
    --night-ink: #303238;
    --gold-glow: rgba(198,162,77,0.34);
    --motion-x: 0px;
    --motion-y: 0px;
  }

  body{
    overflow-x: hidden;
    isolation: isolate;
  }

  /* Soft vignette that keeps the information area visually focused. */
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background:
      linear-gradient(90deg, rgba(47,31,18,.06), transparent 10%, transparent 90%, rgba(47,31,18,.06)),
      radial-gradient(ellipse at center, transparent 46%, rgba(70,45,27,.10) 100%);
  }

  .ambient-scene{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .ambient-orb{
    position:absolute;
    border-radius:50%;
    filter:blur(8px);
    opacity:.25;
    mix-blend-mode:screen;
    will-change:transform;
  }
  .ambient-orb.one{
    width:34vw; height:34vw; min-width:320px; min-height:320px;
    top:-18vw; right:-7vw;
    background:radial-gradient(circle, rgba(231,206,140,.72), rgba(198,162,77,0) 68%);
    animation:orbDriftOne 18s ease-in-out infinite alternate;
  }
  .ambient-orb.two{
    width:30vw; height:30vw; min-width:280px; min-height:280px;
    bottom:-16vw; left:-8vw;
    background:radial-gradient(circle, rgba(255,244,214,.65), rgba(198,162,77,0) 70%);
    animation:orbDriftTwo 22s ease-in-out infinite alternate;
  }
  .ambient-orb.three{
    width:18vw; height:18vw; min-width:190px; min-height:190px;
    left:44%; top:28%;
    background:radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0) 72%);
    opacity:.12;
    animation:orbBreath 9s ease-in-out infinite;
  }
  @keyframes orbDriftOne{
    from{ transform:translate3d(calc(var(--motion-x) * .18), calc(var(--motion-y) * .18), 0) scale(.92); }
    to{ transform:translate3d(calc(-34px + var(--motion-x) * .18), calc(38px + var(--motion-y) * .18), 0) scale(1.08); }
  }
  @keyframes orbDriftTwo{
    from{ transform:translate3d(calc(var(--motion-x) * -.12), calc(var(--motion-y) * -.12), 0) scale(1); }
    to{ transform:translate3d(calc(44px + var(--motion-x) * -.12), calc(-30px + var(--motion-y) * -.12), 0) scale(1.12); }
  }
  @keyframes orbBreath{ 0%,100%{transform:scale(.85);opacity:.08} 50%{transform:scale(1.18);opacity:.18} }

  .ambient-particles{ position:absolute; inset:0; }
  .ambient-particle{
    position:absolute;
    width:4px; height:4px;
    border-radius:50%;
    background:rgba(231,206,140,.75);
    box-shadow:0 0 12px rgba(231,206,140,.65);
    animation:particleFloat var(--duration) linear infinite;
    animation-delay:var(--delay);
    opacity:0;
  }
  @keyframes particleFloat{
    0%{ transform:translate3d(0,18px,0) scale(.5); opacity:0; }
    14%{ opacity:var(--opacity); }
    70%{ opacity:calc(var(--opacity) * .72); }
    100%{ transform:translate3d(var(--drift),-120px,0) scale(1.15); opacity:0; }
  }

  .board{
    transform:translate3d(calc(var(--motion-x) * .012), calc(var(--motion-y) * .012), 0);
    transition:transform .45s cubic-bezier(.22,.61,.36,1);
  }

  /* Header becomes a polished floating command bar. */
  .header{
    position:relative;
    padding:18px 20px 22px;
    border:1px solid rgba(255,255,255,.5);
    border-bottom-color:rgba(198,162,77,.30);
    border-radius:24px;
    background:linear-gradient(135deg, rgba(255,253,248,.74), rgba(255,253,248,.48));
    box-shadow:0 18px 50px -34px rgba(55,35,20,.55), inset 0 1px 0 rgba(255,255,255,.75);
    backdrop-filter:blur(12px) saturate(1.12);
    -webkit-backdrop-filter:blur(12px) saturate(1.12);
    overflow:hidden;
  }
  .header::before{
    content:"";
    position:absolute;
    inset:-2px;
    background:linear-gradient(110deg, transparent 20%, rgba(255,255,255,.65) 43%, transparent 62%);
    transform:translateX(-120%);
    animation:headerSweep 10s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes headerSweep{ 0%,66%{transform:translateX(-120%)} 86%,100%{transform:translateX(120%)} }

  .brand-badge{
    position:relative;
    border-color:rgba(198,162,77,.26);
    box-shadow:0 16px 35px -22px rgba(36,24,17,.68), 0 0 0 1px rgba(255,255,255,.65) inset;
  }
  .brand-badge::after{
    content:"";
    position:absolute;
    inset:5px;
    border:1px solid rgba(198,162,77,.18);
    border-radius:10px;
    pointer-events:none;
  }

  .clock-box{
    position:relative;
    overflow:hidden;
    border:1px solid rgba(231,206,140,.28);
    box-shadow:0 18px 38px -23px rgba(36,24,17,.75), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .clock-box::before{
    content:"";
    position:absolute;
    inset:-80% -30%;
    background:conic-gradient(from 120deg, transparent, rgba(231,206,140,.16), transparent 30%);
    animation:clockAura 12s linear infinite;
  }
  .clock-time,.clock-date{ position:relative; z-index:1; }
  @keyframes clockAura{ to{transform:rotate(360deg)} }

  .sync-strip{
    position:relative;
    overflow:hidden;
    margin-top:14px;
    margin-bottom:22px;
    background:rgba(255,253,248,.84);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-color:rgba(198,162,77,.20);
    box-shadow:0 10px 24px -18px rgba(36,24,17,.65), inset 0 1px 0 rgba(255,255,255,.8);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  body.sync-success .sync-strip{
    animation:syncConfirm .8s ease-out;
  }
  @keyframes syncConfirm{
    0%{transform:scale(1)} 36%{transform:scale(1.035);box-shadow:0 0 0 7px rgba(47,107,69,.08)} 100%{transform:scale(1)}
  }

  .grid{ gap:clamp(18px,2vw,28px); perspective:1200px; }
  .card{
    background:linear-gradient(155deg, var(--glass-strong), var(--glass));
    border-color:rgba(255,255,255,.65);
    box-shadow:0 28px 60px -36px rgba(42,27,16,.68), 0 8px 22px -18px rgba(42,27,16,.35), inset 0 1px 0 rgba(255,255,255,.88);
    backdrop-filter:blur(14px) saturate(1.08);
    -webkit-backdrop-filter:blur(14px) saturate(1.08);
    transform:translateZ(0) rotateX(var(--tilt-y,0deg)) rotateY(var(--tilt-x,0deg));
    transform-style:preserve-3d;
    transition:transform .35s cubic-bezier(.22,.61,.36,1), box-shadow .35s ease, border-color .35s ease;
    will-change:transform;
  }
  .card:hover{
    border-color:rgba(198,162,77,.42);
    box-shadow:0 34px 68px -38px rgba(42,27,16,.72), 0 0 0 1px rgba(198,162,77,.12);
  }
  .card::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:radial-gradient(circle at var(--shine-x,50%) var(--shine-y,20%), rgba(255,255,255,.32), transparent 30%);
    opacity:var(--shine-opacity,0);
    transition:opacity .3s ease;
    pointer-events:none;
    z-index:4;
  }

  .card-top{
    position:relative;
    isolation:isolate;
    overflow:hidden;
    background:
      radial-gradient(circle at 12% 10%, rgba(231,206,140,.18), transparent 26%),
      linear-gradient(120deg, #60402a, #805b3d 58%, #67452e);
  }
  .card-top::after{
    content:"";
    position:absolute;
    top:-80%; bottom:-80%; width:35%;
    left:-45%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.13), transparent);
    transform:skewX(-18deg);
    animation:cardHeaderSweep 8s ease-in-out infinite;
    z-index:-1;
  }
  @keyframes cardHeaderSweep{ 0%,68%{left:-45%} 88%,100%{left:125%} }

  .card.state-available .card-top{ box-shadow:inset 0 -3px 0 rgba(83,160,104,.24); }
  .card.state-busy .card-top{ box-shadow:inset 0 -3px 0 rgba(194,91,64,.22); }

  .avatar{
    box-shadow:0 0 0 3px rgba(244,238,224,.18), 0 10px 24px -12px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .45s cubic-bezier(.22,.61,.36,1);
  }
  .card:hover .avatar{ transform:translateZ(24px) scale(1.035); }
  .avatar-wrap.avatar-live::before{
    content:"";
    position:absolute;
    width:10px; height:10px;
    right:0; bottom:4px;
    border-radius:50%;
    background:#59b779;
    border:2px solid #fff8e8;
    box-shadow:0 0 0 4px rgba(89,183,121,.18), 0 0 12px rgba(89,183,121,.65);
    z-index:3;
  }

  .pill{ border:1px solid rgba(255,255,255,.35); }
  .pill.busy{ animation:busyPulse 3.4s ease-in-out infinite; }
  @keyframes busyPulse{ 0%,100%{box-shadow:0 2px 6px rgba(0,0,0,.1)} 50%{box-shadow:0 2px 6px rgba(0,0,0,.1),0 0 0 5px rgba(166,70,47,.10)} }

  /* Available status aura growing — calm green pulse */
  .card.state-available .pill.available{
    position:relative;
    overflow:visible;
    isolation:isolate;
    animation:availableBadgeFloat 2.8s ease-in-out infinite;
    box-shadow:0 4px 12px rgba(47,107,69,.12), 0 0 0 0 rgba(47,107,69,0);
  }

  .available-progress .session-progress-title::before{

  .lang-pair{

/* ===================== LUXURY MOTION PACK ===================== */
:root{
  --motion-gold-glow: rgba(198,162,77,.42);
  --motion-green-glow: rgba(74,164,106,.38);
  --motion-busy-glow: rgba(198,96,63,.30);
}

/* Available breathing glow */
@keyframes availableBreathingGlow{
  0%,100%{
    box-shadow:
      0 0 0 0 rgba(74,164,106,.08),
      0 0 0 6px rgba(74,164,106,.05),
      0 10px 28px -18px rgba(74,164,106,.15);
    filter:saturate(1);
  }
  50%{
    box-shadow:
      0 0 0 4px rgba(74,164,106,.10),
      0 0 18px 2px rgba(74,164,106,.16),
      0 16px 34px -16px rgba(74,164,106,.22);
    filter:saturate(1.05);
  }
}
.card.state-available .pill.available,
.card.state-available .status-icon.avail-icon{
  animation:availableBreathingGlow 3.6s ease-in-out infinite;
}

/* Busy warm pulse */
@keyframes busyWarmPulse{
  0%,100%{
    box-shadow:
      0 0 0 0 rgba(198,96,63,.05),
      0 8px 22px -16px rgba(166,70,47,.14);
    filter:saturate(1);
  }
  50%{
    box-shadow:
      0 0 14px 2px rgba(198,96,63,.12),
      0 14px 28px -16px rgba(166,70,47,.22);
    filter:saturate(1.04);
  }
}
.card.state-busy .pill.busy,
.card.state-busy .status-icon.busy-icon{
  animation:busyWarmPulse 3.2s ease-in-out infinite;
}

/* Status transition flash when state changes */
@keyframes statusStateSwitch{
  0%{
    box-shadow:0 0 0 0 rgba(198,162,77,0), var(--shadow-lift);
    transform:translateY(0);
  }
  35%{
    box-shadow:0 0 0 4px rgba(198,162,77,.13), 0 20px 44px -22px rgba(198,162,77,.22);
    transform:translateY(-2px);
  }
  100%{
    box-shadow:var(--shadow-lift);
    transform:translateY(0);
  }
}
.card.state-switch{
  animation:statusStateSwitch 1.1s cubic-bezier(.22,.61,.36,1);
}

/* Card entrance */
@keyframes cardLuxuryEnter{
  0%{
    opacity:0;
    transform:translateY(18px) scale(.985);
    filter:blur(6px);
  }
  100%{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }
}
.card.motion-enter{
  animation:cardLuxuryEnter .72s cubic-bezier(.22,.61,.36,1) both;
}

/* Progress shimmer */
@keyframes progressShimmer{
  0%{ transform:translateX(-130%); opacity:0; }
  12%{ opacity:.15; }
  50%{ opacity:.42; }
  100%{ transform:translateX(180%); opacity:0; }
}
.session-progress-bar{
  position:relative;
  overflow:hidden;
}
.session-progress-bar::before{
  content:"";
  position:absolute;
  inset:-20% auto -20% -40%;
  width:38%;
  background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.65), rgba(255,255,255,0));
  transform:translateX(-120%);
  animation:progressShimmer 3.4s ease-in-out infinite;
  pointer-events:none;
}

/* Imminent next booking highlight */
@keyframes imminentHalo{
  0%,100%{
    box-shadow:0 12px 24px -21px rgba(36,24,17,.52);
    border-color:rgba(198,162,77,.34);
  }
  50%{
    box-shadow:0 18px 34px -18px rgba(198,162,77,.26);
    border-color:rgba(198,162,77,.56);
  }
}
@keyframes imminentIconPulse{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.06); }
}
.next-box.queue-imminent{
  animation:imminentHalo 2.4s ease-in-out infinite;
}
.next-box.queue-imminent .next-box-icon{
  animation:imminentIconPulse 2.4s ease-in-out infinite;
}

/* Clock colon pulse */
@keyframes colonPulse{
  0%,48%{ opacity:1; text-shadow:0 0 10px rgba(198,162,77,.26); }
  50%,100%{ opacity:.28; text-shadow:none; }
}
.clock-colon{
  display:inline-block;
  animation:colonPulse 1s steps(1,end) infinite;
}

/* Golden micro-sparkle for logo + title */
.brand-badge,
.hero-title-switch{
  position:relative;
  overflow:visible;
}
@keyframes microSparkle{
  0%,100%{ opacity:.12; transform:scale(.85); filter:blur(.2px); }
  50%{ opacity:.75; transform:scale(1.08); filter:blur(0); }
}
.brand-badge::before,
.brand-badge::after,
.hero-title-switch::before,
.hero-title-switch::after{
  content:"";
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,248,214,.96) 0%, rgba(231,206,140,.78) 35%, rgba(198,162,77,0) 72%);
  animation:microSparkle 3.2s ease-in-out infinite;
  pointer-events:none;
}
.brand-badge::before{ top:10px; right:12px; animation-delay:.2s; }
.brand-badge::after{ bottom:12px; left:12px; animation-delay:1.1s; }
.hero-title-switch::before{ top:-2px; right:4%; animation-delay:.7s; }
.hero-title-switch::after{ bottom:-4px; left:6%; animation-delay:1.8s; }

/* Elegant title glow sweep */
@keyframes heroTitleGlow{
  0%,100%{ text-shadow:0 0 0 rgba(198,162,77,0); filter:saturate(1); }
  50%{ text-shadow:0 0 18px rgba(198,162,77,.22); filter:saturate(1.04); }
}
.hero-title-switch .title-th,
.hero-title-switch .title-en{
  animation:heroTitleGlow 6.8s ease-in-out infinite;
}

/* Day off fade + float */
@keyframes dayOffGrace{
  0%{ opacity:0; transform:translateY(8px); }
  100%{ opacity:1; transform:translateY(0); }
}
.card.state-off .day-off-icon,
.card.state-off .day-off-title,
.card.state-off .day-off-sub{
  animation:dayOffGrace .9s cubic-bezier(.22,.61,.36,1) both;
}
.card.state-off .day-off-title{ animation-delay:.06s; }
.card.state-off .day-off-sub{ animation-delay:.12s; }

/* Slight ambient board drift enhancement */
.display-fit-shell .board{
  transition:transform .45s ease;
}

/* Reduced motion safety */
@media (prefers-reduced-motion: reduce){
  .card.motion-enter,
  .card.state-switch,
  .card.state-available .pill.available,
  .card.state-available .status-icon.avail-icon,
  .card.state-busy .pill.busy,
  .card.state-busy .status-icon.busy-icon,
  .session-progress-bar::before,
  .next-box.queue-imminent,
  .next-box.queue-imminent .next-box-icon,
  .clock-colon,
  .brand-badge::before,
  .brand-badge::after,
  .hero-title-switch::before,
  .hero-title-switch::after,
  .hero-title-switch .title-th,
  .hero-title-switch .title-en,
  .card.state-off .day-off-icon,
  .card.state-off .day-off-title,
  .card.state-off .day-off-sub{
    animation:none !important;
  }
}

</style>
</head>

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function normalizeCustomerTypeLabel(value){
  const raw = cleanCell(value);
  const lower = raw.toLowerCase();
  if (!raw) return { th: 'ไม่ระบุ', en: 'Not specified' };
  if (lower.includes('walk')) return { th: 'Walk-in', en: 'Walk-in' };
  if (raw.includes('โรงแรม') || lower.includes('hotel')) return { th: 'ลูกค้าโรงแรม', en: 'Hotel guest' };
  return { th: raw, en: raw };
}

function customerInfoMarkup(customerName, course, customerType){
  const safeName = escapeHtml(cleanCell(customerName) || 'ไม่ระบุ');
  const safeCourse = escapeHtml(cleanCell(course) || 'ไม่ระบุ');
  const type = normalizeCustomerTypeLabel(customerType);

  return `<div class="customer-info-grid">
    <div class="customer-info-row">
      <div class="customer-info-label">${languagePair('ชื่อ', 'Name')}</div>
      <div class="customer-info-value">${safeName}</div>
    </div>
    <div class="customer-info-row">
      <div class="customer-info-label">${languagePair('คอร์ส', 'Course')}</div>
      <div class="customer-info-value">${safeCourse}</div>
    </div>
    <div class="customer-info-row">
      <div class="customer-info-label">${languagePair('ประเภท', 'Type')}</div>
      <div class="customer-info-value">${escapeHtml(type.th)}<span class="en">${escapeHtml(type.en)}</span></div>
    </div>
  </div>`;
}

/* ---------------- Time helpers (minute precision) ---------------- */
function minutesToLabel(mins){
  const h = Math.floor(mins / 60) % 24;
  const m = mins % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

function nowMinutes(){
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

function isShopOpenNow(){
  const current = nowMinutes();
  return current >= CONFIG.OPEN_HOUR * 60 && current < CONFIG.CLOSE_HOUR * 60;
}

/* ---------------- CSV fetch + parse ---------------- */
function sheetCsvUrl(tabName, gid = ''){
  // Use gid for the schedule sheet so the display reads the exact worksheet
  // from the supplied link even when that worksheet is renamed later.
  const selector = gid
    ? `gid=${encodeURIComponent(gid)}`
    : `sheet=${encodeURIComponent(tabName)}`;
  return `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&${selector}&_=${Date.now()}`;
}

function cleanCell(value){
  return String(value ?? '')
    .replace(/^\uFEFF/, '')
    .replace(/[\u200B-\u200D\u2060]/g, '')
    .replace(/\u00A0/g, ' ')
    .trim();
}

function headerToken(value){
  return cleanCell(value)
    .toLowerCase()
    .replace(/\s+/g, '')
    .replace(/[_\-./\\]/g, '');
}

const HEADER_ALIASES = {
  therapistid: 'Therapist_ID',
  timeslot: 'Time_Slot',
  status: 'Status',
  customernote: 'Customer_Note',
  customername: 'Customer_Name',
  ชื่อ: 'Customer_Name',
  ชื่อลูกค้า: 'Customer_Name',
  id: 'ID',
  nameth: 'Name_TH',
  nameen: 'Name_EN',
  photourl: 'Photo_URL',
  workingtoday: 'Working_Today',
  key: 'Key',
  value: 'Value',
  ห้อง: 'ห้อง',
  เบอร์โทร: 'เบอร์โทร',
  คอร์สการนวด: 'คอร์สการนวด',
  ชั่วโมง: 'ชั่วโมง',
  ราคา: 'ราคา',
  ประเภทลูกค้า: 'ประเภทลูกค้า',
  หมายเหตุ: 'หมายเหตุ',
  เวลาเริ่มจริง: 'เวลาเริ่มจริง',
  เวลาสิ้นสุดจริง: 'เวลาสิ้นสุดจริง',
  พนักงานขาย: 'พนักงานขาย'
};

function canonicalHeader(value){
  const cleaned = cleanCell(value).replace(/\s+/g, ' ');
  return HEADER_ALIASES[headerToken(cleaned)] || cleaned;
}

function normalizeTherapistId(value){
  const s = cleanCell(value);
  // Google Sheets can export numeric IDs as 1.0 instead of 1.
  if (/^\d+(?:\.0+)?$/.test(s)) return String(parseInt(s, 10));
  return s;
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => cleanCell(f) !== ''));
}

function rowsToObjects(rows){
  if (rows.length < 1) return [];
  // Accept wrapped headers, invisible spaces/BOMs, and small header variations.
  const headers = rows[0].map(canonicalHeader);
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = cleanCell(r[i]));
    return obj;
  });
}

async function fetchTab(tabName, gid = ''){
  const url = sheetCsvUrl(tabName, gid);
  const sourceLabel = gid ? `${tabName} (gid ${gid})` : tabName;
  let res;
  try{
    res = await fetch(url, { cache: "no-store" });
  } catch (networkErr){
    throw new Error(`เชื่อมต่อแท็บ "${sourceLabel}" ไม่ได้ (network/CORS): ${networkErr.message}`);
  }
  if (!res.ok){
    throw new Error(`แท็บ "${sourceLabel}" ตอบกลับ HTTP ${res.status} — ตรวจสอบว่าแชร์ "ทุกคนที่มีลิงก์ ดูได้" แล้ว`);
  }
  const csvText = await res.text();
  if (/^\s*<!DOCTYPE html/i.test(csvText) || /accounts\.google\.com/i.test(csvText)){
    throw new Error(`แท็บ "${sourceLabel}" ไม่คืนค่าเป็น CSV (อาจยังไม่ได้แชร์แบบสาธารณะ หรือระบุแท็บไม่ตรง)`);
  }
  return rowsToObjects(parseCSV(csvText));
}

/* ---------------- Parsing helpers for the hourly-grid format ---------------- */

// Flexible time parser for Google Sheets CSV values.
// Supports 18:00, 18:00:00, 18.00, 6:00 PM, and fractional days such as 0.75.
function parseExactTime(value){
  const s = cleanCell(value);
  if (!s) return null;

  if (/^(?:0(?:\.\d+)?|1(?:\.0+)?)$/.test(s)){
    const fraction = Number(s);
    if (Number.isFinite(fraction)) return Math.round((fraction % 1) * 1440) % 1440;
  }

  const m = /(\d{1,2})\s*[:.]\s*(\d{2})/.exec(s);
  if (!m) return null;
  let h = parseInt(m[1], 10);
  const mm = parseInt(m[2], 10);
  const meridiem = /\b(p\.?m\.?)\b/i.test(s) ? 'pm'
    : (/\b(a\.?m\.?)\b/i.test(s) ? 'am' : '');

  if (meridiem === 'pm' && h < 12) h += 12;
  if (meridiem === 'am' && h === 12) h = 0;
  if (h > 23 || mm > 59) return null;
  return h * 60 + mm;
}

function isBusyStatus(statusRaw){
  const s = cleanCell(statusRaw).toLowerCase().replace(/\s+/g, '');
  return s === 'ไม่ว่าง' || s === 'busy' || s === 'unavailable' || s === 'booked';
}

// Build a map: Therapist_ID -> sorted array of bookings { startMin, endMin, startLabel, endLabel, note }
// Reads the hourly grid: Therapist_ID, Time_Slot, Status, Customer_Note, ห้อง, เบอร์โทร, คอร์สการนวด,
// ชั่วโมง, ประเภทลูกค้า, หมายเหตุ, เวลาเริ่มจริง, เวลาสิ้นสุดจริง
//
// Consecutive "ไม่ว่าง" hours for the same therapist (continuation rows with a blank Customer_Note,
// matching how the hotel already marks multi-hour bookings) are merged into a single booking block.
// If เวลาเริ่มจริง / เวลาสิ้นสุดจริง are filled anywhere in that block, they override the hour-block
// boundaries with the exact real time.
function fieldByNameOrPosition(row, name, position){
  const direct = row[name];
  if (direct !== undefined && cleanCell(direct) !== '') return direct;
  const keys = Object.keys(row);
  return keys[position] !== undefined ? row[keys[position]] : '';
}

function parseDurationMinutes(value){
  const s = cleanCell(value).replace(',', '.');
  if (!s) return null;
  const n = Number(s);
  if (!Number.isFinite(n) || n <= 0) return null;
  return Math.round(n * 60);
}

function buildScheduleMap(rows){
  const map = {};
  const closeMin = CONFIG.CLOSE_HOUR * 60;

  (rows || []).forEach((r, rowIndex) => {
    try{
      const therapistRaw = fieldByNameOrPosition(r, 'Therapist_ID', 0);
      const therapistId = String(therapistRaw ?? '').trim();
      if (!therapistId) return;

      const status = fieldByNameOrPosition(r, 'Status', 2);
      if (!isBusyStatus(status)) return;

      // Prefer exact real booking times (L:M). Track whether each value
      // came from the explicit real-time columns so merge logic never
      // lets a fallback hourly row overwrite an exact minute value.
      const explicitStartRaw =
        fieldByNameOrPosition(r, 'เวลาเริ่มจริง', 11) ||
        fieldByNameOrPosition(r, 'เวลาเริ่มจอง', 11) ||
        fieldByNameOrPosition(r, 'Start', 11) ||
        fieldByNameOrPosition(r, 'Start_Time', 11);

      const explicitEndRaw =
        fieldByNameOrPosition(r, 'เวลาสิ้นสุดจริง', 12) ||
        fieldByNameOrPosition(r, 'เวลาสิ้นสุดจอง', 12) ||
        fieldByNameOrPosition(r, 'End', 12) ||
        fieldByNameOrPosition(r, 'End_Time', 12);

      const slotRaw = fieldByNameOrPosition(r, 'Time_Slot', 1);
      const startRaw = explicitStartRaw || slotRaw;
      const endRaw = explicitEndRaw;

      const hasExplicitStart = cleanCell(explicitStartRaw) !== '';
      const hasExplicitEnd = cleanCell(explicitEndRaw) !== '';

      let start = parseExactTime(startRaw);
      let end = parseExactTime(endRaw);

      // Fallback end time: derive from duration or the next hour only when explicit end is absent.
      if (!Number.isFinite(start)) return;

      const hoursRaw =
        fieldByNameOrPosition(r, 'ชั่วโมง', 7) ||
        fieldByNameOrPosition(r, 'Hours', 7) ||
        fieldByNameOrPosition(r, 'Duration', 7);

      const durationHours = parseFloat(String(hoursRaw ?? '').replace(',', '.'));
      if (!Number.isFinite(end)){
        if (Number.isFinite(durationHours) && durationHours > 0){
          end = start + Math.round(durationHours * 60);
        } else {
          end = start + 60;
        }
      }

      // Self-test / guard rails:
      // 1) reject impossible or zero-length bookings
      if (!Number.isFinite(end) || end <= start){
        console.warn('[Spa Queue Self-test] invalid end<=start', {rowIndex, therapistId, startRaw, endRaw, start, end});
        return;
      }
      // 2) never let a booking create availability beyond exact closing time.
      if (start >= closeMin){
        console.warn('[Spa Queue Self-test] booking starts at/after closing; ignored on public board', {rowIndex, therapistId, start, end});
        return;
      }
      end = Math.min(end, closeMin);

      const customer =
        fieldByNameOrPosition(r, 'Customer_Note', 3) ||
        fieldByNameOrPosition(r, 'Customer_Name', 3) ||
        fieldByNameOrPosition(r, 'ชื่อลูกค้า', 3) || '';

      const course =
        fieldByNameOrPosition(r, 'คอร์สการนวด', 6) ||
        fieldByNameOrPosition(r, 'Course', 6) ||
        fieldByNameOrPosition(r, 'Treatment', 6) || '';

      const customerType =
        fieldByNameOrPosition(r, 'ประเภทลูกค้า', 9) ||
        fieldByNameOrPosition(r, 'Customer_Type', 9) || '';

      // Keep staff-only data private on the TV:
      // phone, price, salesperson, internal remarks are intentionally NOT exposed here.
      const room =
        fieldByNameOrPosition(r, 'ห้อง', 4) ||
        fieldByNameOrPosition(r, 'Room', 4) || '';

      const displayParts = [];
      if (customer) displayParts.push(String(customer).trim());
      if (room) displayParts.push(`ห้อง ${String(room).trim()}`);
      if (course) displayParts.push(String(course).trim());
      if (customerType) displayParts.push(String(customerType).trim());

      const item = {
        therapistId,
        startMin: start,
        endMin: end,
        startLabel: minutesToLabel(start),
        endLabel: minutesToLabel(end),
        hasExplicitStart,
        hasExplicitEnd,
        start,
        end,
        customer: String(customer || '').trim(),
        room: String(room || '').trim(),
        course: String(course || '').trim(),
        customerType: String(customerType || '').trim(),
        note: displayParts.filter(Boolean).join(' · '),
        rowIndex
      };

      if (!map[therapistId]) map[therapistId] = [];
      map[therapistId].push(item);
    } catch (err){
      console.warn('[Spa Queue Self-test] row parse error', rowIndex, err);
    }
  });

  Object.keys(map).forEach(id => {
    const list = map[id].sort((a,b) => a.startMin - b.startMin || a.endMin - b.endMin);

    // Merge overlapping/adjacent rows belonging to the same real booking period,
    // while preserving the richest display data.
    const merged = [];
    for (const item of list){
      const prev = merged[merged.length - 1];
      if (prev && item.startMin <= prev.endMin){
        // Exact real times must take priority over inferred hourly bounds.
        if (item.hasExplicitStart && !prev.hasExplicitStart){
          prev.startMin = item.startMin;
          prev.start = item.startMin;
          prev.startLabel = item.startLabel;
          prev.hasExplicitStart = true;
        } else if (!prev.hasExplicitStart){
          prev.startMin = Math.min(prev.startMin, item.startMin);
          prev.start = prev.startMin;
          prev.startLabel = minutesToLabel(prev.startMin);
        }

        if (item.hasExplicitEnd){
          prev.endMin = item.endMin;
          prev.end = item.endMin;
          prev.endLabel = item.endLabel;
          prev.hasExplicitEnd = true;
        } else if (!prev.hasExplicitEnd){
          prev.endMin = Math.max(prev.endMin, item.endMin);
          prev.end = prev.endMin;
          prev.endLabel = minutesToLabel(prev.endMin);
        }

        if (!prev.customer && item.customer) prev.customer = item.customer;
        if (!prev.room && item.room) prev.room = item.room;
        if (!prev.course && item.course) prev.course = item.course;
        if (!prev.customerType && item.customerType) prev.customerType = item.customerType;

        const parts = [];
        if (prev.customer) parts.push(prev.customer);
        if (prev.room) parts.push(`ห้อง ${prev.room}`);
        if (prev.course) parts.push(prev.course);
        if (prev.customerType) parts.push(prev.customerType);
        prev.note = parts.join(' · ');
      } else {
        merged.push({...item});
      }
    }
    merged.forEach(b => {
      if (b.hasExplicitEnd && b.endLabel !== minutesToLabel(b.endMin)){
        console.warn('[Spa Queue] exact end-time label mismatch', {therapistId:id, booking:b});
      }
    });
    map[id] = merged;
  });

  return map;
}

// Merge identity (Queue) with computed live status (Schedule) for one therapist
function computeTherapistView(therapistId, bookings){
  bookings = bookings || [];
  const nowMin = nowMinutes();
  const closeMin = CONFIG.CLOSE_HOUR * 60; // exact closing time; 23:00 means closed from 23:00 onward

  const currentBooking = bookings.find(b => nowMin >= b.startMin && nowMin < b.endMin);
  const queueStartMin = CONFIG.QUEUE_START_HOUR * 60;

  // Determine the complete free window around the current time. This powers the
  // green availability countdown without changing the three upcoming queue boxes.
  let previousBooking = null;
  for (const booking of bookings){
    if (booking.endMin <= nowMin) previousBooking = booking;
    else break;
  }
  const nextBooking = bookings.find(b => b.startMin > nowMin) || null;
  let availableStartMin = null;
  let availableEndMin = null;
  if (!currentBooking){
    availableStartMin = nowMin < queueStartMin
      ? queueStartMin
      : Math.max(queueStartMin, previousBooking ? previousBooking.endMin : queueStartMin);
    availableEndMin = nextBooking ? nextBooking.startMin : closeMin;
    if (availableEndMin <= availableStartMin){
      availableStartMin = null;
      availableEndMin = null;
    }
  }

  // Build a timeline of what's coming up: alternating available / busy blocks,
  // starting right after "now" (or right after the current session ends if busy)
  // The shop may already be open, but appointment availability begins at 14:00.
  let cursor = currentBooking ? currentBooking.endMin : Math.max(nowMin, queueStartMin);
  const upcoming = bookings.filter(b => b.startMin >= cursor);

  const segments = [];
  upcoming.forEach(b => {
    if (b.startMin > cursor && (b.startMin - cursor) >= CONFIG.MIN_BOOKABLE_GAP_MIN){
      segments.push({ type: 'available', startMin: cursor, endMin: b.startMin });
    }
    segments.push({
      type: 'busy',
      startMin: b.startMin,
      endMin: b.endMin,
      note: b.note,
      customerName: b.customerName || '',
      course: b.course || '',
      customerType: b.customerType || ''
    });
    cursor = b.endMin;
  });
  if (cursor < closeMin && (closeMin - cursor) >= CONFIG.MIN_BOOKABLE_GAP_MIN){
    segments.push({ type: 'available', startMin: cursor, endMin: closeMin });
  }

  // Break long "available" stretches into 1-hour chunks so a single free window
  // doesn't swallow the whole 3-slot display — always show real, distinct boxes.
  // (A trailing remainder shorter than an hour gets folded into the previous chunk.)
  const CHUNK_MIN = 60;
  function roundToHalfHour(mins){
    return Math.round(mins / 30) * 30;
  }
  function ceilToHalfHour(mins){
    return Math.ceil(mins / 30) * 30;
  }

  const expanded = [];
  segments.forEach(s => {
    if (s.type !== 'available'){
      expanded.push(s);
      return;
    }

    // Round the leading edge UP to the next clean :00/:30 mark too (never down —
    // that would claim availability before the therapist is actually free).
    // If rounding up eats the whole window, just drop it rather than show a fake range.
    let t = ceilToHalfHour(s.startMin);
    if (t >= s.endMin) return;

    while (t < s.endMin){
      const rawEnd = Math.min(t + CHUNK_MIN, s.endMin);
      let chunkEnd = rawEnd;

      // Only round an artificial cut in the middle of a long free window — never round
      // a real boundary (the start of an actual next booking, or true closing time)
      if (rawEnd < s.endMin){
        chunkEnd = roundToHalfHour(rawEnd);
        if (chunkEnd <= t) chunkEnd = t + 30;
        if (chunkEnd > s.endMin) chunkEnd = s.endMin;
      }

      // Fold a leftover remainder shorter than a full hour into this chunk — every
      // box should represent a full hour (or more); never a sub-hour fragment
      if (s.endMin - chunkEnd > 0 && s.endMin - chunkEnd < CHUNK_MIN){
        chunkEnd = s.endMin;
      }

      expanded.push({ type: 'available', startMin: t, endMin: chunkEnd });
      t = chunkEnd;
    }
  });

  // Show up to 3 real upcoming boxes. When no more queue exists today,
  // append only ONE closing placeholder so the message is never duplicated.
  const visibleSegments = expanded.slice(0, 3);
  if (visibleSegments.length < 3){
    visibleSegments.push({ type: 'none' });
  }

  const nextThree = visibleSegments.map(s => s.type === 'none' ? s : ({
    type: s.type,
    startMin: s.startMin,
    endMin: Math.min(s.endMin, closeMin),
    startLabel: minutesToLabel(s.startMin),
    endLabel: minutesToLabel(Math.min(s.endMin, closeMin)),
    note: s.note || '',
    customerName: s.customerName || '',
    course: s.course || '',
    customerType: s.customerType || ''
  }));

  return {
    available: !currentBooking,
    currentNote: currentBooking ? currentBooking.note : '',
    currentCustomerName: currentBooking ? (currentBooking.customerName || '') : '',
    currentCourse: currentBooking ? (currentBooking.course || '') : '',
    currentCustomerType: currentBooking ? (currentBooking.customerType || '') : '',
    currentStartMin: currentBooking ? currentBooking.startMin : null,
    currentEndMin: currentBooking ? currentBooking.endMin : null,
    currentEndLabel: currentBooking ? currentBooking.endLabel : '',
    availableStartMin,
    availableEndMin,
    availableEndLabel: availableEndMin !== null ? minutesToLabel(availableEndMin) : '',
    availableEndsAtClosing: availableEndMin === closeMin,
    nextThree
  };
}

// Tracks each therapist's last-known status so we only animate real changes
const previousStatusMap = {};
let hasRenderedOnce = false;


function availableInfoMarkup(view){
  const nextBusy = (view?.nextThree || []).find(item => item.type === 'busy');
  const nextBookingTh = nextBusy?.startLabel ? `${nextBusy.startLabel} น.` : 'ยังไม่มีคิวจอง';
  const nextBookingEn = nextBusy?.startLabel ? nextBusy.startLabel : 'No booking scheduled';

  const serviceUntilTh = view?.availableEndLabel
    ? `${view.availableEndLabel} น.`
    : `${String(CONFIG.CLOSE_HOUR).padStart(2,'0')}:00 น.`;

  const serviceUntilEn = view?.availableEndLabel
    ? view.availableEndLabel
    : `${String(CONFIG.CLOSE_HOUR).padStart(2,'0')}:00`;

  return `<div class="available-info-grid">
    <div class="available-info-row">
      <div class="available-info-label">${languagePair('สถานะ','Status')}</div>
      <div class="available-info-value available-official">${languagePair('พร้อมให้บริการ','Ready for service')}</div>
    </div>
    <div class="available-info-row">
      <div class="available-info-label">${languagePair('คิวถัดไป','Next booking')}</div>

function renderCards(queueList, scheduleMap){
  const grid = document.getElementById('cardGrid');
  if (!queueList.length){
    grid.innerHTML = `<div class="empty-state">${languagePair('ยังไม่มีข้อมูลหมอนวดในชีต','No therapist information is available')}</div>`;
    return;
  }

  const isFirstRender = !hasRenderedOnce;
  const currentMinute = nowMinutes();

  grid.innerHTML = queueList.map((t, cardIndex) => {
    const id = normalizeTherapistId(t.ID || t.Therapist_ID || fieldByNameOrPosition(t, 'ID', 0));
    const nameTh = t.Name_TH || id || 'หมอนวด';
    const nameEn = t.Name_EN || '';
    const photo = t.Photo_URL
      ? `<img src="${t.Photo_URL}" alt="${nameTh}">`
      : avatarSvg();

    const workingOriginal = cleanCell(t.Working_Today || 'ทำงาน');
    const workingRaw = workingOriginal.toLowerCase();
    const offExactTokens = ['ไม่ทำงาน','วันหยุด','หยุด','ลา','ลางาน','ไม่เข้าทำงาน','ไม่เข้า','off','no','leave','day off'];
    const offContainsTokens = ['ไม่ทำงาน','วันหยุด','ลางาน','ไม่เข้าทำงาน','ไม่เข้าวันนี้','หยุดวันนี้','day off'];
    const isOff = offExactTokens.includes(workingRaw) || offContainsTokens.some(token => workingRaw.includes(token));
    const enterStyle = isFirstRender ? ` style="animation-delay:${cardIndex * 90}ms"` : '';

    // ---- Therapist not working today: make the day-off state highly visible. ----
    if (isOff){
      const changed = !isFirstRender && previousStatusMap[id] !== undefined && previousStatusMap[id] !== 'off';
      previousStatusMap[id] = 'off';
      const reason = workingOriginal && !['ไม่ทำงาน','off','no'].includes(workingRaw)
        ? workingOriginal
        : 'วันหยุด';
      return `
      <div class="card card-off state-off${isFirstRender ? ' card-enter' : ''}${changed ? ' status-flash' : ''}" data-therapist="${id}" data-state="off"${enterStyle}>
        <div class="card-top">
          <div class="avatar">${photo}</div>
          <div>
            <div class="card-name-th">${nameTh}</div>
            <div class="card-name-en">${nameEn}</div>
          </div>
          <div class="pill off">
            <span class="pill-dot"></span>
            ${languagePair('วันหยุด','Day Off')}
          </div>
        </div>
        <div class="card-body day-off-body">
          <div class="day-off-icon${changed ? ' icon-flash' : ''}">${statusIconSvg('off')}</div>
          <div class="day-off-text">${languagePair('ไม่เข้าทำงานวันนี้','Day Off','lang-pair-block')}</div>
          <div class="day-off-sub">${languagePair(`${reason} · ไม่รับคิวในวันนี้`,'Not accepting bookings today','lang-pair-block')}</div>
        </div>
      </div>`;
    }

    // ---- Outside operating hours: whole shop is closed right now. ----
    if (!isShopOpenNow()){
      const changed = !isFirstRender && previousStatusMap[id] !== undefined && previousStatusMap[id] !== 'closed';
      previousStatusMap[id] = 'closed';
      const openHourLabel = String(CONFIG.OPEN_HOUR).padStart(2, '0') + ':00';
      return `
      <div class="card card-off state-closed${isFirstRender ? ' card-enter' : ''}${changed ? ' status-flash' : ''}" data-therapist="${id}" data-state="closed"${enterStyle}>
        <div class="card-top">
          <div class="avatar">${photo}</div>
          <div>
            <div class="card-name-th">${nameTh}</div>
            <div class="card-name-en">${nameEn}</div>
          </div>
          <div class="pill off">
            <span class="pill-dot"></span>
            ${languagePair('ปิดบริการ','Closed')}
          </div>
        </div>
        <div class="card-body day-off-body">
          <div class="day-off-icon${changed ? ' icon-flash' : ''}">${statusIconSvg('off')}</div>
          <div class="day-off-text">${languagePair('ปิดให้บริการ','Closed','lang-pair-block')}</div>
          <div class="day-off-sub">${languagePair(`เปิดอีกครั้งเวลา ${openHourLabel} น.`,`Opens again at ${openHourLabel}`,'lang-pair-block')}</div>
        </div>
      </div>`;
    }

    const view = computeTherapistView(id, scheduleMap[id]);
    const available = view.available;
    const nowLabel = minutesToLabel(currentMinute);
    const statusKey = available ? 'available' : 'busy';
    const changed = !isFirstRender && previousStatusMap[id] !== undefined && previousStatusMap[id] !== statusKey;
    previousStatusMap[id] = statusKey;
    const isLastHour = currentMinute >= (CONFIG.CLOSE_HOUR - 1) * 60 && currentMinute < CONFIG.CLOSE_HOUR * 60;

    const nextBox = view.nextThree
      .map((s, i) => {
        if (s.type === 'none'){
          return `<div class="next-box next-box-empty is-none${i === 0 ? ' next-box-first' : ' next-box-later'}${isFirstRender ? ' slot-enter' : ''}" style="--slot-delay:${i * 90}ms;animation-delay:${i * 90}ms">
              <div class="next-box-icon">${calendarSvg()}</div>
              <div>
                <div class="next-th no-more">${languagePair('ยังไม่มีคิวจองเพิ่มเติมวันนี้','No more bookings today')}</div>

              </div>
            </div>`;
        }

        const isBusy = s.type === 'busy';
        const startsIn = Number.isFinite(s.startMin) ? s.startMin - currentMinute : Infinity;
        const imminent = isBusy && startsIn > 0 && startsIn <= CONFIG.IMMINENT_QUEUE_MIN;
        const label = isBusy ? languagePair('มีคิวจองแล้ว','Booked') : languagePair('ว่าง','Available');
        const cls = isBusy ? 'next-th booked' : 'next-th avail';
        const subLabel = isBusy
          ? (i === 0 ? languagePair('คิวถัดไป','Next booking') : languagePair('คิวลำดับต่อไป','Upcoming booking'))
          : (i === 0 ? languagePair('ว่างตอนนี้','Open now') : languagePair('ช่วงเวลาว่าง','Open'));
        const nextCustomerName = isBusy ? escapeHtml(cleanCell(s.customerName) || 'ไม่ระบุ') : '';
        const nextCourse = isBusy ? escapeHtml(cleanCell(s.course) || 'ไม่ระบุ') : '';
        const compactInfo = isBusy
          ? `<div class="next-booking-compact-info">
               <span class="next-booking-info-item">${languagePair(`ชื่อ: ${nextCustomerName}`, `Name: ${nextCustomerName}`)}</span>
               <span class="next-booking-info-item">${languagePair(`คอร์ส: ${nextCourse}`, `Course: ${nextCourse}`)}</span>
             </div>`
          : '';

        return `<div class="next-box ${isBusy ? 'is-booked' : 'is-available'}${i === 0 ? ' next-box-first' : ' next-box-later'}${isBusy ? '' : ' next-box-empty'}${imminent ? ' queue-imminent' : ''}${isFirstRender ? ' slot-enter' : ''}" data-queue-type="${s.type}" data-start="${s.startMin}" data-end="${s.endMin}" style="animation-delay:${i * 90}ms">
            <div class="next-box-icon">${calendarSvg()}</div>
            <div class="next-box-copy">
              <div class="${cls}"><span class="en">${s.startLabel}-${s.endLabel}</span> · ${label}</div>
              ${compactInfo}
              <div class="next-en">${subLabel}</div>
            </div>
          </div>`;
      }).join('');

    let progressMarkup = '';
    if (!available && view.currentStartMin !== null && view.currentEndMin !== null){
      progressMarkup = `<div class="session-progress" data-kind="busy" data-start="${view.currentStartMin}" data-end="${view.currentEndMin}">
          <div class="session-progress-meta">
            <span class="session-progress-title">${languagePair('ความคืบหน้าคิว','Session progress')}</span>
            <span class="session-remaining">${languagePair('กำลังคำนวณ…','Calculating…')}</span>
          </div>
          <div class="session-progress-track"><span class="session-progress-bar"></span></div>
          <div class="room-prep-message">${languagePair('คิวถัดไปกำลังเตรียมห้อง','The next room is being prepared')}</div>
        </div>`;
    } else if (available && view.availableStartMin !== null && view.availableEndMin !== null){
      progressMarkup = `<div class="session-progress available-progress" data-kind="available" data-start="${view.availableStartMin}" data-end="${view.availableEndMin}" data-end-label="${view.availableEndLabel}" data-closing="${view.availableEndsAtClosing ? 'true' : 'false'}">
          <div class="session-progress-meta">
            <span class="session-progress-title">${languagePair('เวลาว่างคงเหลือ','Available time left')}</span>
            <span class="session-remaining">${languagePair('กำลังคำนวณ…','Calculating…')}</span>
          </div>
          <div class="session-progress-track"><span class="session-progress-bar"></span></div>
        </div>`;
    }

    const beforeQueueStart = currentMinute < CONFIG.QUEUE_START_HOUR * 60;
    const queueStartLabel = String(CONFIG.QUEUE_START_HOUR).padStart(2, '0') + ':00';
    const hint = available
      ? (beforeQueueStart
          ? `<div class="available-info-grid pre-open">
               <div class="available-info-row">
                 <div class="available-info-label">${languagePair('สถานะ','Status')}</div>
                 <div class="available-info-value">${languagePair('รอเวลาเปิดรับคิว','Waiting for queue opening')}</div>
               </div>
               <div class="available-info-row">
                 <div class="available-info-label">${languagePair('เริ่มรับคิว','Queue starts')}</div>
                 <div class="available-info-value">${queueStartLabel}</div>
               </div>
               <div class="available-info-row">
                 <div class="available-info-label">${languagePair('บริการ','Service')}</div>
                 <div class="available-info-value">${languagePair('กรุณาติดต่อ Front Reception','Please contact Front Reception')}</div>
               </div>
             </div>`
          : availableInfoMarkup(view))
      : `${customerInfoMarkup(view.currentCustomerName, view.currentCourse, view.currentCustomerType)}
         <div class="current-until">${languagePair(`ให้บริการถึง ${view.currentEndLabel} น.`,`In service until ${view.currentEndLabel}`)}</div>`;

    return `
    <div class="card state-${statusKey}${isFirstRender ? ' card-enter' : ''}${changed ? ' status-flash' : ''}" data-therapist="${id}" data-state="${statusKey}"${enterStyle}>
      <div class="card-top">
        <div class="avatar-wrap${available ? ' avatar-live' : ''}"><div class="avatar">${photo}</div></div>
        <div>
          <div class="card-name-th">${nameTh}</div>
          <div class="card-name-en">${nameEn}</div>
        </div>
        <div class="pill ${available ? 'available' : 'busy'}">
          <span class="pill-dot"></span>
          ${available ? languagePair('ว่าง','Available') : languagePair('ไม่ว่าง','Busy')}
        </div>
      </div>
      <div class="card-body">
        <div class="status-row">
          <div class="status-icon ${available ? 'avail-icon' : 'busy-icon'}${changed ? ' icon-flash' : ''}">${statusIconSvg(available ? 'available' : 'busy')}</div>
          <div>
            <div class="status-label">${languagePair(`คิวปัจจุบัน (${nowLabel} น.)`,`Current status (${nowLabel})`)}</div>
            <div class="status-value ${available ? 'available' : 'busy'}">${available ? languagePair('ว่าง','Available') : languagePair('ไม่ว่าง','Busy')}</div>
            <div class="status-hint${available ? '' : ' busy'}">${hint}</div>
          </div>
        </div>
        ${progressMarkup}
        <div class="next-label"><span class="rule"></span>${languagePair('คิวถัดไป','Next booking')}<span class="rule"></span></div>
        ${nextBox}
      </div>
    </div>`;
  }).join('');

  hasRenderedOnce = true;
  requestAnimationFrame(enhanceRenderedCards);
}

function applySettings(settingsRows){
  const map = {};
  settingsRows.forEach(r => { map[r.Key] = r.Value; });
  if (map.ShopName_TH) document.getElementById('shopNameTh').textContent = map.ShopName_TH;
  if (map.ShopName_EN) document.getElementById('shopNameEn').textContent = map.ShopName_EN;
  if (map.Tagline_TH) document.getElementById('taglineTh').textContent = map.Tagline_TH;
  if (map.Tagline_EN && document.getElementById('taglineEn')) document.getElementById('taglineEn').textContent = map.Tagline_EN;
}


function validateScheduleRuntime(scheduleRows, scheduleMap){
  const busyRows = (scheduleRows || []).filter(r => isBusyStatus(fieldByNameOrPosition(r, 'Status', 2)));
  const bookingCount = Object.values(scheduleMap || {}).reduce((sum, list) => sum + (list?.length || 0), 0);

  if (busyRows.length > 0 && bookingCount === 0){
    console.error('[Spa Queue] Busy rows exist but no bookings were parsed.', {
      build: CONFIG.BUILD,
      busyRows: busyRows.length,
      firstBusyRow: busyRows[0]
    });
  } else {
    console.info('[Spa Queue] Schedule parsed', {
      build: CONFIG.BUILD,
      busyRows: busyRows.length,
      bookings: bookingCount
    });
  }
}

/* ---------------- Sync loop ---------------- */
async function fetchScheduleRows(){
  const attempts = [
    () => fetchTab(CONFIG.SCHEDULE_TAB, CONFIG.SCHEDULE_GID),
    () => fetchTab(CONFIG.SCHEDULE_TAB)
  ];
  let lastError = null;
  for (const attempt of attempts){
    try{
      const rows = await attempt();
      if (!rows.length) return rows;
      const first = rows[0] || {};
      const id = fieldByNameOrPosition(first, 'Therapist_ID', 0);
      const time = fieldByNameOrPosition(first, 'Time_Slot', 1);
      if (cleanCell(id) || cleanCell(time)) return rows;
    } catch (err){
      lastError = err;
    }
  }
  if (lastError) throw lastError;
  return [];
}

let lastGoodQueue = null;
let lastGoodScheduleMap = null;
let lastSuccessfulSyncAt = 0;
let consecutiveSyncFailures = 0;
let lastSyncError = null;
let lastSyncStats = null;
let syncInFlight = false;
let recoveryReloadScheduled = false;
let adminDebugMode = false;
let debugTapTimes = [];

function formatSyncTime(timestamp, includeSeconds = false){
  if (!timestamp) return '--:--';
  return new Date(timestamp).toLocaleTimeString('th-TH', {
    hour:'2-digit', minute:'2-digit', ...(includeSeconds ? {second:'2-digit'} : {})
  });
}

function setSyncLevel(level){
  const strip = document.getElementById('syncStrip');
  const dot = document.getElementById('syncDot');
  if (!strip || !dot) return;
  strip.classList.remove('status-warn','status-critical','status-offline');
  dot.classList.remove('warn','critical');
  if (level === 'warn'){
    strip.classList.add('status-warn');
    dot.classList.add('warn');
  } else if (level === 'critical'){
    strip.classList.add('status-critical');
    dot.classList.add('critical');
  } else if (level === 'offline'){
    strip.classList.add('status-offline');
    dot.classList.add('critical');
  }
}

function updateSyncStatus(){
  const text = document.getElementById('syncText');
  const strip = document.getElementById('syncStrip');
  if (!text || !strip) return;
  strip.classList.toggle('debug-active', adminDebugMode);

  const now = Date.now();
  const age = lastSuccessfulSyncAt ? now - lastSuccessfulSyncAt : Infinity;
  let level = 'ok';
  let th = 'กำลังอัปเดตข้อมูลคิว…';
  let en = 'Updating queue information…';

  if (!navigator.onLine){
    level = 'offline';
    th = lastSuccessfulSyncAt
      ? `อินเทอร์เน็ตขัดข้อง · แสดงข้อมูลล่าสุดเมื่อ ${formatSyncTime(lastSuccessfulSyncAt)}`
      : 'ไม่มีการเชื่อมต่ออินเทอร์เน็ต · กรุณาตรวจสอบที่ Front Reception';
    en = lastSuccessfulSyncAt
      ? `Internet offline · Showing the last update from ${formatSyncTime(lastSuccessfulSyncAt)}`
      : 'No internet connection · Please check with Front Reception';
  } else if (!lastSuccessfulSyncAt){
    level = consecutiveSyncFailures ? 'critical' : 'ok';
    th = consecutiveSyncFailures
      ? 'ยังดึงข้อมูลคิวไม่ได้ · กรุณาตรวจสอบที่ Front Reception'
      : 'กำลังเชื่อมต่อข้อมูลคิว…';
    en = consecutiveSyncFailures
      ? 'Queue data is unavailable · Please check with Front Reception'
      : 'Connecting to queue data…';
  } else if (age >= CONFIG.STALE_CRITICAL_MS){
    level = 'critical';
    th = `ข้อมูลคิวอาจไม่เป็นปัจจุบัน · ล่าสุด ${formatSyncTime(lastSuccessfulSyncAt)} · กรุณาตรวจสอบที่ Front Reception`;
    en = `Queue data may be outdated · Last update ${formatSyncTime(lastSuccessfulSyncAt)} · Please check with Front Reception`;
  } else if (consecutiveSyncFailures > 0){
    level = 'warn';
    th = `กำลังเชื่อมต่อใหม่ · ยังแสดงข้อมูลล่าสุดเมื่อ ${formatSyncTime(lastSuccessfulSyncAt)}`;
    en = `Reconnecting · Still showing the last update from ${formatSyncTime(lastSuccessfulSyncAt)}`;
  } else if (age >= CONFIG.STALE_WARN_MS){
    level = 'warn';
    th = `กำลังรอข้อมูลใหม่ · อัปเดตล่าสุด ${formatSyncTime(lastSuccessfulSyncAt)}`;
    en = `Waiting for a fresh update · Last updated ${formatSyncTime(lastSuccessfulSyncAt)}`;
  } else {
    th = `ข้อมูลคิวอัปเดตแล้ว · ล่าสุด ${formatSyncTime(lastSuccessfulSyncAt)}`;
    en = `Queue information is up to date · Updated ${formatSyncTime(lastSuccessfulSyncAt)}`;
  }

  if (adminDebugMode && lastSyncStats){
    th += ` · ${CONFIG.BUILD} · แถว ${lastSyncStats.rows} · ไม่ว่าง ${lastSyncStats.busyRows} · คิว ${lastSyncStats.bookings} · ล้มเหลว ${consecutiveSyncFailures}`;
    en += ` · ${CONFIG.BUILD} · Rows ${lastSyncStats.rows} · Busy ${lastSyncStats.busyRows} · Bookings ${lastSyncStats.bookings} · Failures ${consecutiveSyncFailures}`;
  }

  setSyncLevel(level);
  text.innerHTML = languagePair(th, en);
}

function scheduleRecoveryReload(){
  if (recoveryReloadScheduled || !navigator.onLine || consecutiveSyncFailures < 8) return;
  const match = /#recovery-(\d+)/.exec(location.hash);
  const previousRecovery = match ? Number(match[1]) : 0;
  if (previousRecovery && Date.now() - previousRecovery < 30 * 60 * 1000) return;
  recoveryReloadScheduled = true;
  window.setTimeout(() => {
    const cleanUrl = location.href.replace(/#recovery-\d+$/, '').split('#')[0];
    location.replace(`${cleanUrl}#recovery-${Date.now()}`);
  }, 5000);
}

async function syncNow(reason = 'interval'){
  if (syncInFlight) return;
  syncInFlight = true;
  try{
    const [queue, scheduleRows, settings] = await Promise.all([
      fetchTab(CONFIG.QUEUE_TAB),
      fetchScheduleRows(),
      fetchTab(CONFIG.SETTINGS_TAB).catch(() => [])
    ]);
    const scheduleMap = buildScheduleMap(scheduleRows);
    validateScheduleRuntime(scheduleRows, scheduleMap);
    const bookingCount = Object.values(scheduleMap).reduce((sum, list) => sum + list.length, 0);
    const busyRowCount = scheduleRows.filter(r => isBusyStatus(fieldByNameOrPosition(r, 'Status', 2))).length;

    lastGoodQueue = queue;
    lastGoodScheduleMap = scheduleMap;
    lastSuccessfulSyncAt = Date.now();
    setPublicSyncWarning('');
    consecutiveSyncFailures = 0;
    lastSyncError = null;
    lastSyncStats = { rows:scheduleRows.length, busyRows:busyRowCount, bookings:bookingCount, reason };
    recoveryReloadScheduled = false;

    renderCards(queue, scheduleMap);
    if (settings.length) applySettings(settings);
    document.body.classList.remove('sync-success');
    void document.body.offsetWidth;
    document.body.classList.add('sync-success');
    window.setTimeout(() => document.body.classList.remove('sync-success'), 900);

    if (busyRowCount > 0 && bookingCount === 0){
      consecutiveSyncFailures = 1;
      lastSyncError = new Error('พบแถวไม่ว่าง แต่แปลงเป็นคิวไม่ได้');
    }
  } catch (err){
    consecutiveSyncFailures += 1;
    lastSyncError = err;
    console.error('[Spa Queue Sync Error]', err);
    setPublicSyncWarning('ข้อมูลคิวอาจไม่เป็นปัจจุบัน กรุณาติดต่อ Front Reception');
    if (lastGoodQueue) renderCards(lastGoodQueue, lastGoodScheduleMap || {});
    scheduleRecoveryReload();
  } finally {
    syncInFlight = false;
    updateSyncStatus();
  }
}

function setupSyncDebugToggle(){
  const strip = document.getElementById('syncStrip');
  if (!strip) return;
  strip.addEventListener('click', () => {
    const now = Date.now();
    debugTapTimes = debugTapTimes.filter(t => now - t < 3000);
    debugTapTimes.push(now);
    if (debugTapTimes.length >= 5){
      adminDebugMode = !adminDebugMode;
      debugTapTimes = [];
      updateSyncStatus();
    }
  });
}

const enMonths = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function tickClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clockHour').textContent = hh;
