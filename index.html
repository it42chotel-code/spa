<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>42C Spa • Queue Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f4eee2;--cream2:#ebe1d0;--brown:#735039;--brown2:#8a6244;--gold:#c4a259;--ink:#2a211a;--green:#2f6d4b;--red:#a74b39;--amber:#a87520;--line:rgba(97,72,50,.13);--shadow:0 22px 52px rgba(68,48,31,.13)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Noto Sans Thai',sans-serif;color:var(--ink);background:radial-gradient(900px 600px at 5% 5%,rgba(255,255,255,.8),transparent 65%),radial-gradient(900px 600px at 95% 100%,rgba(198,162,89,.12),transparent 65%),linear-gradient(135deg,var(--cream),var(--cream2));padding:clamp(20px,2.6vw,42px)}
.shell{max-width:1500px;margin:auto}.hero{display:grid;grid-template-columns:190px 1fr 240px;gap:24px;align-items:center;padding-bottom:22px;border-bottom:1px solid rgba(97,72,50,.14)}
.logoBox{width:180px;height:112px;background:#fffdf8;border-radius:24px;display:grid;place-items:center;box-shadow:var(--shadow);border:1px solid rgba(196,162,89,.28);padding:12px}.brandLogo{position:relative;font-family:Arial,sans-serif;font-weight:900;font-size:52px;letter-spacing:-5px;line-height:1;color:#050505}.brandLogo .c{color:#e63228}.brandLine{width:112px;height:7px;background:#555;margin:4px auto 0;border-radius:2px}.welcome{text-align:center}.welcome h1{font-family:'Noto Serif Thai',serif;font-size:clamp(30px,3.2vw,48px);margin:0;color:#6f4e36}.welcome p{margin:8px 0 0;color:#95846f;font-size:15px}.clock{justify-self:end;background:linear-gradient(135deg,#7b553a,#8e6747);color:#fff3d2;border-radius:22px;padding:18px 24px;text-align:center;box-shadow:var(--shadow);min-width:215px}.clock strong{display:block;font-size:34px;color:#f1d790}.clock small{display:block;margin-top:4px;color:#eadfcf}
.error{display:none;margin-top:14px;padding:12px 16px;border-radius:14px;background:#fff0ed;border:1px solid #efc8c0;color:#a23d31}.warn{display:none;margin-top:14px;padding:12px 16px;border-radius:14px;background:#fff8e6;border:1px solid #ead7a7;color:#8a641d}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:20px}.card{background:#fffdf8;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow);min-height:500px}.cardHead{background:linear-gradient(135deg,#7a5439,#8a6244);color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between}.person{display:flex;gap:13px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#efd995,#d2ad59);border:3px solid rgba(255,255,255,.35);color:#775536;font-size:24px}.name{font-size:22px;font-weight:800}.name small{display:block;font-size:13px;color:#ebd9bd}.badge{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800}.available{background:#e8f4e8;color:#2f6d4b}.busy{background:#fae8e4;color:#a64a38}.arrived{background:#fff1cb;color:#8b6422}.off{background:#eee;color:#666}.cardBody{padding:20px;display:grid;gap:15px}.current{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:17px;padding:16px;background:#fff}.current.availableBox{border-left-color:var(--green);background:linear-gradient(135deg,#fff,#f5fbf6)}.eyebrow{font-size:12px;color:#9c9185;font-weight:700}.bigState{font-size:25px;font-weight:800;margin-top:3px}.green{color:var(--green)}.red{color:var(--red)}.rows{margin-top:10px;display:grid;gap:7px}.row{display:flex;justify-content:space-between;gap:10px;background:#faf7f1;border:1px solid #efe6d7;border-radius:10px;padding:8px 10px;font-size:13px}.row span:first-child{color:#948776}.nextTitle{text-align:center;color:#9b8e7f;font-size:12px}.next{border:1px solid #e7d9bf;border-left:4px solid var(--gold);border-radius:15px;padding:13px 14px;background:#fffaf0}.next strong{font-size:17px;color:#6d4e38}.next small{display:block;color:#978b7e;margin-top:3px}.none{border:1px dashed #ddd4c8;border-radius:15px;padding:18px;text-align:center;color:#999084;background:#faf9f6}.cta{margin:22px auto 0;background:#fffdf8;border:1px solid rgba(97,72,50,.15);border-radius:22px;box-shadow:var(--shadow);padding:17px 24px;max-width:1050px;text-align:center;font-family:'Noto Serif Thai',serif;font-size:24px;color:#4a3527}.statusLine{text-align:center;color:#9b8d7c;font-size:12px;margin-top:10px}
@media(max-width:1050px){.hero{grid-template-columns:1fr}.logoBox,.clock{justify-self:center}.cards{grid-template-columns:1fr}.welcome h1{font-size:34px}}@media(max-width:600px){body{padding:14px}.logoBox{width:150px;height:95px}.welcome h1{font-size:28px}.cta{font-size:18px}}
</style>
</head>
<body>
<div class="shell">
<header class="hero">
  <div class="logoBox"><div><div class="brandLogo">42<span class="c">C</span></div><div class="brandLine"></div></div></div>
  <div class="welcome"><h1>ยินดีต้อนรับสู่บริการสปา</h1><p>กรุณาตรวจสอบคิวว่างของหมอนวด • Please check therapist availability</p></div>
  <div class="clock"><strong id="clock">--:--</strong><small id="date">--</small></div>
</header>
<div id="error" class="error"></div>
<div id="warn" class="warn"></div>
<section class="cards" id="cards"></section>
<div class="cta">✧ สามารถจองคิวได้ที่ Front Reception</div>
<div class="statusLine" id="statusLine">กำลังเชื่อมต่อระบบคิว…</div>
</div>
<script>
/* Display v10 compatibility layer: tries current/legacy Apps Script deployments and both API contracts. */
const ENDPOINTS=[
  {url:'https://script.google.com/macros/s/AKfycbwdHmWNRVmAHS--ZShqlGj_SauHtpcGI2p7xnFIL41RXlHaOHnEDgfgRlCv9Ls1TRnm/exec',mode:'state'},
  {url:'https://script.google.com/macros/s/AKfycbwdHmWNRVmAHS--ZShqlGj_SauHtpcGI2p7xnFIL41RXlHaOHnEDgfgRlCv9Ls1TRnm/exec',mode:'queue'},
  {url:'https://script.google.com/macros/s/AKfycbxLC5KBR0XZ2az4RiPFaOc54fOr2Mwn83kgOCgfQAuTIBJWjhQypZMVAWtPjwuUmSf0/exec',mode:'state'},
  {url:'https://script.google.com/macros/s/AKfycbxLC5KBR0XZ2az4RiPFaOc54fOr2Mwn83kgOCgfQAuTIBJWjhQypZMVAWtPjwuUmSf0/exec',mode:'queue'}
];
const CACHE_KEY='42c_spa_display_last_good_v10';
let timer=null,activeEndpoint=null;

function jsonp(endpoint,timeoutMs=6500){return new Promise((resolve,reject)=>{const cb='__spaCb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');let done=false;const cleanup=()=>{if(done)return;done=true;clearTimeout(to);try{delete window[cb]}catch(_){window[cb]=undefined}s.remove()};window[cb]=data=>{cleanup();resolve(data)};s.onerror=()=>{cleanup();reject(new Error('โหลด API ไม่สำเร็จ'))};const sep=endpoint.url.includes('?')?'&':'?';const q=endpoint.mode==='state'?'action=state':'api=queue';s.src=endpoint.url+sep+q+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.appendChild(s);const to=setTimeout(()=>{cleanup();reject(new Error('API timeout'))},timeoutMs)})}

async function fetchQueue(){const ordered=activeEndpoint?[activeEndpoint,...ENDPOINTS.filter(e=>e!==activeEndpoint)]:ENDPOINTS;let lastErr=null;for(const ep of ordered){try{const raw=await jsonp(ep);const data=normalizePayload(raw,ep.mode);if(!data.therapists.length)throw new Error('ไม่พบข้อมูลหมอนวด');activeEndpoint=ep;localStorage.setItem(CACHE_KEY,JSON.stringify({savedAt:Date.now(),data}));return data}catch(e){lastErr=e}}throw lastErr||new Error('เชื่อมต่อ API ไม่สำเร็จ')}

function normalizePayload(raw,mode){if(!raw||raw.ok===false)throw new Error((raw&&raw.message)||(raw&&raw.error)||'Backend error');if(mode==='queue'&&Array.isArray(raw.therapists))return raw;if(raw.verified===false)throw new Error('Backend ยังยืนยันข้อมูลคิวไม่ได้');const now=bangkokMinutes();const src=raw.bookingsByTherapist||{};const therapists=(raw.therapists||[]).map(t=>{const list=(src[String(t.id)]||src[t.id]||[]).map(b=>({startMin:Number(b.startMin),endMin:Number(b.endMin),startLabel:b.startLabel||minLabel(b.startMin),endLabel:b.endLabel||minLabel(b.endMin),services:b.course||b.services||''})).filter(b=>Number.isFinite(b.startMin)&&Number.isFinite(b.endMin)).sort((a,b)=>a.startMin-b.startMin);const current=list.find(b=>now>=b.startMin&&now<b.endMin)||null;const next=list.find(b=>b.startMin>now)||null;return{id:String(t.id??''),nameTh:t.nameTh||'',nameEn:t.nameEn||'',workingToday:t.workingToday!==false,state:t.workingToday===false?'OFF':current?'RESERVED_NOW':'AVAILABLE',current:current?{start:todayIsoFromMin(current.startMin),end:todayIsoFromMin(current.endMin),services:current.services}:null,next:next?{start:todayIsoFromMin(next.startMin),end:todayIsoFromMin(next.endMin),services:next.services}:null}});return{ok:true,therapists,serverTime:raw.serverTime||raw.generatedAt||new Date().toISOString(),refreshSec:10}}

async function loadQueue(){clearTimeout(timer);try{const data=await fetchQueue();hideError();hideWarn();render(data);timer=setTimeout(loadQueue,(Number(data.refreshSec)||10)*1000)}catch(err){const cached=loadCache();if(cached){render(cached.data);showWarn('เชื่อมต่อข้อมูลล่าสุดไม่ได้ • กำลังแสดงข้อมูลล่าสุดที่เคยเชื่อมต่อสำเร็จ กรุณาตรวจสอบกับ Front Reception');document.getElementById('statusLine').textContent='กำลังลองเชื่อมต่อใหม่…'}else{showError('เชื่อมต่อ Apps Script ไม่ได้ กรุณาตรวจสอบว่า Web App ได้ Deploy เป็น New version และ Who has access = Anyone');document.getElementById('statusLine').textContent='API connection failed'}timer=setTimeout(loadQueue,12000)}}
function loadCache(){try{const x=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(!x||Date.now()-x.savedAt>10*60*1000)return null;return x}catch(_){return null}}

function render(data){const arr=(data&&data.therapists)||[];document.getElementById('cards').innerHTML=arr.map(card).join('');document.getElementById('statusLine').textContent='อัปเดตล่าสุด '+new Date(data.serverTime||Date.now()).toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false})+' • ระบบอัปเดตอัตโนมัติ'}
function card(t){const off=t.state==='OFF'||t.workingToday===false;const busy=t.state==='IN_SERVICE'||t.state==='RESERVED_NOW';const arrived=t.state==='ARRIVED';const cls=off?'off':busy?'busy':arrived?'arrived':'available';const badge=off?'หยุดวันนี้':busy?'ไม่ว่าง':arrived?'ลูกค้ามาถึง':'ว่าง';let cur;if(off){cur='<div class="current"><div class="eyebrow">สถานะวันนี้</div><div class="bigState">หยุดให้บริการ</div></div>'}else if(t.current){const st=t.state==='IN_SERVICE'?'กำลังให้บริการ':t.state==='ARRIVED'?'พร้อมเริ่มบริการ':'มีคิวในขณะนี้';cur=`<div class="current"><div class="eyebrow">คิวปัจจุบัน</div><div class="bigState red">${st}</div><div class="rows"><div class="row"><span>เวลา</span><b>${tm(t.current.start)}–${tm(t.current.end)}</b></div><div class="row"><span>คอร์ส</span><b>${esc(shorten(t.current.services,38))}</b></div></div></div>`}else{cur=`<div class="current availableBox"><div class="eyebrow">สถานะปัจจุบัน</div><div class="bigState green">พร้อมให้บริการ</div><div class="rows"><div class="row"><span>สถานะ</span><b>ว่างในขณะนี้</b></div>${t.next?`<div class="row"><span>ว่างถึง</span><b>${tm(t.next.start)} น.</b></div>`:'<div class="row"><span>วันนี้</span><b>ยังไม่มีคิวถัดไป</b></div>'}</div></div>`}const nxt=t.next?`<div class="next"><strong>${tm(t.next.start)}–${tm(t.next.end)} • มีคิวจองแล้ว</strong><small>${esc(shorten(t.next.services,44))}</small></div>`:`<div class="none">ยังไม่มีคิวจองเพิ่มเติมวันนี้</div>`;return `<article class="card"><div class="cardHead"><div class="person"><div class="avatar">✦</div><div class="name">${esc(t.nameTh||('หมอนวด '+(t.id||'')))}<small>${esc(t.nameEn||'Therapist')}</small></div></div><span class="badge ${cls}">● ${badge}</span></div><div class="cardBody">${cur}<div class="nextTitle">คิวถัดไป</div>${nxt}</div></article>`}
function bangkokMinutes(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const h=Number(parts.find(x=>x.type==='hour')?.value||0),m=Number(parts.find(x=>x.type==='minute')?.value||0);return h*60+m}
function todayIsoFromMin(min){const d=new Date();const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);const h=String(Math.floor(Number(min)/60)).padStart(2,'0'),m=String(Number(min)%60).padStart(2,'0');return date+'T'+h+':'+m+':00+07:00'}
function minLabel(v){v=Number(v)||0;return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('date').textContent=d.toLocaleDateString('th-TH',{timeZone:'Asia/Bangkok',day:'2-digit',month:'long',year:'numeric'})}
function tm(v){if(!v)return'-';return new Date(v).toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shorten(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}
function showError(s){const e=document.getElementById('error');e.textContent=s;e.style.display='block'}function hideError(){document.getElementById('error').style.display='none'}function showWarn(s){const e=document.getElementById('warn');e.textContent=s;e.style.display='block'}function hideWarn(){document.getElementById('warn').style.display='none'}
setInterval(tick,1000);tick();loadQueue();
</script>
</body>
</html>
