<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>42C Spa • Queue Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f4eee2;--cream2:#ebe1d0;--brown:#735039;--brown2:#8a6244;--gold:#c4a259;--gold2:#ead7a1;--ink:#2a211a;--muted:#8a7d6f;--green:#2f6d4b;--greenbg:#e5f1e8;--red:#a74b39;--redbg:#f5e7e1;--card:#fffdf8;--line:rgba(97,72,50,.13);--shadow:0 22px 52px rgba(68,48,31,.13)}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:'Noto Sans Thai',sans-serif;color:var(--ink);background:radial-gradient(900px 600px at 5% 5%,rgba(255,255,255,.8),transparent 65%),radial-gradient(900px 600px at 95% 100%,rgba(198,162,89,.12),transparent 65%),linear-gradient(135deg,var(--cream),var(--cream2));padding:clamp(20px,2.6vw,42px);overflow-x:hidden}body:before{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:80px 80px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 70%)}.shell{max-width:1500px;margin:auto;position:relative;z-index:1}.hero{display:grid;grid-template-columns:180px 1fr 240px;gap:25px;align-items:center;padding:8px 0 24px;border-bottom:1px solid rgba(97,72,50,.14)}.logoBox{width:150px;height:110px;background:#fffdf8;border-radius:24px;display:grid;place-items:center;box-shadow:var(--shadow);border:1px solid rgba(196,162,89,.28);font-size:45px;font-weight:900;letter-spacing:-3px}.logoBox b{color:#d5342d}.welcome{text-align:center}.welcome h1{font-family:'Noto Serif Thai',serif;font-size:clamp(30px,3.2vw,48px);margin:0;color:#6f4e36}.welcome p{margin:8px 0 0;color:#95846f;font-size:15px}.clock{justify-self:end;background:linear-gradient(135deg,#7b553a,#8e6747);color:#fff3d2;border-radius:22px;padding:18px 24px;text-align:center;box-shadow:var(--shadow);min-width:215px}.clock strong{display:block;font-size:34px;letter-spacing:2px;color:#f1d790}.clock small{display:block;margin-top:3px;color:#eadfcf}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:20px}.card{background:rgba(255,253,248,.95);border:1px solid rgba(97,72,50,.13);border-radius:26px;overflow:hidden;box-shadow:var(--shadow);min-height:530px;display:flex;flex-direction:column}.cardHead{background:linear-gradient(135deg,#7a5439,#8a6244);color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.person{display:flex;gap:13px;align-items:center}.avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#efd995,#d2ad59);border:3px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:25px;color:#775536;box-shadow:0 0 0 3px rgba(196,162,89,.35)}.name{font-size:22px;font-weight:800}.name small{display:block;font-size:13px;color:#ebd9bd;margin-top:1px}.badge{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap}.badge.available{background:#e8f4e8;color:#2f6d4b}.badge.busy{background:#fae8e4;color:#a64a38}.badge.arrived{background:#fff1cb;color:#8b6422}.cardBody{padding:20px;display:flex;flex-direction:column;gap:15px;flex:1}.current{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:17px;padding:16px;background:#fff}.current.available{border-left-color:var(--green);background:linear-gradient(135deg,#fff,#f5fbf6)}.eyebrow{font-size:12px;color:#9c9185;font-weight:700}.bigState{font-size:25px;font-weight:800;margin-top:3px}.bigState.green{color:var(--green)}.bigState.red{color:var(--red)}.rows{margin-top:9px;display:grid;gap:7px}.row{display:flex;justify-content:space-between;gap:10px;background:#faf7f1;border:1px solid #efe6d7;border-radius:10px;padding:8px 10px;font-size:13px}.row span:first-child{color:#948776}.progressBox{border-radius:15px;background:#faf6ee;border:1px solid #eee3d2;padding:13px}.progressTitle{display:flex;justify-content:space-between;font-size:12px;color:#8e8171;margin-bottom:8px}.track{height:7px;background:#e9dfcf;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#bd774d,#e7b879);border-radius:99px}.nextTitle{display:flex;align-items:center;gap:10px;color:#9b8e7f;font-size:12px;margin-top:1px}.nextTitle:before,.nextTitle:after{content:'';height:1px;background:#e9e1d6;flex:1}.next{border:1px solid #e7d9bf;border-left:4px solid var(--gold);border-radius:15px;padding:13px 14px;background:#fffaf0}.next strong{font-size:17px;color:#6d4e38}.next small{display:block;color:#978b7e;margin-top:3px}.none{border:1px dashed #ddd4c8;border-radius:15px;padding:18px;text-align:center;color:#999084;background:#faf9f6}.cta{margin:22px auto 0;background:rgba(255,253,248,.94);border:1px solid rgba(97,72,50,.15);border-radius:22px;box-shadow:var(--shadow);padding:17px 24px;max-width:1050px;display:flex;align-items:center;justify-content:center;gap:13px;font-family:'Noto Serif Thai',serif;font-size:24px;color:#4a3527}.ctaIcon{width:42px;height:42px;border-radius:50%;background:#7a5439;color:#f2d690;display:grid;place-items:center;font-family:sans-serif}.statusLine{text-align:center;color:#9b8d7c;font-size:12px;margin-top:10px}.error{background:#fff0ed;color:#a23d31;border:1px solid #efc8c0;border-radius:15px;padding:12px 16px;margin-top:15px;display:none}@media(max-width:1050px){.hero{grid-template-columns:120px 1fr}.clock{grid-column:1/-1;justify-self:center}.logoBox{width:110px;height:82px;font-size:34px}.cards{grid-template-columns:1fr}.card{min-height:auto}.welcome h1{font-size:34px}}@media(max-width:600px){body{padding:14px}.hero{grid-template-columns:1fr;text-align:center}.logoBox{justify-self:center}.clock{min-width:190px}.welcome h1{font-size:28px}.cardHead{padding:14px}.cta{font-size:18px;padding:14px}}
</style>
</head><body><div class="shell"><header class="hero"><div class="logoBox">42<b>C</b></div><div class="welcome"><h1>ยินดีต้อนรับสู่บริการสปา</h1><p>กรุณาตรวจสอบคิวว่างของหมอนวด • Please check therapist availability</p></div><div class="clock"><strong id="clock">--:--</strong><small id="date">--</small></div></header><div id="error" class="error"></div><section class="cards" id="cards"></section><div class="cta"><span class="ctaIcon">✧</span><span>สามารถจองคิวได้ที่ Front Reception</span></div><div class="statusLine" id="statusLine">กำลังเชื่อมต่อระบบคิว…</div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwdHmWNRVmAHS--ZShqlGj_SauHtpcGI2p7xnFIL41RXlHaOHnEDgfgRlCv9Ls1TRnm/exec';let timer=null;
function spaQueueCallback(data){clearTimeout(timer);render(data);timer=setTimeout(loadQueue,(Number(data.refreshSec)||12)*1000)}
function loadQueue(){const old=document.getElementById('jsonp');if(old)old.remove();const s=document.createElement('script');s.id='jsonp';s.src=API+'?api=queue&callback=spaQueueCallback&_=' + Date.now();s.onerror=()=>{showError('ไม่สามารถเชื่อมต่อระบบคิวได้ กำลังลองใหม่…');timer=setTimeout(loadQueue,15000)};document.body.appendChild(s)}
function render(data){hideError();const arr=(data&&data.therapists)||[];document.getElementById('cards').innerHTML=arr.map(card).join('');document.getElementById('statusLine').textContent='อัปเดตล่าสุด '+new Date(data.serverTime||Date.now()).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false})+' • ระบบอัปเดตอัตโนมัติ';if(!arr.length)showError('ยังไม่พบข้อมูลหมอนวดในระบบ')}
function card(t){const busy=t.state==='IN_SERVICE'||t.state==='RESERVED_NOW';const arrived=t.state==='ARRIVED';const cls=busy?'busy':arrived?'arrived':'available';const badge=busy?'ไม่ว่าง':arrived?'ลูกค้ามาถึง':'ว่าง';let cur;if(t.current){const st=t.state==='IN_SERVICE'?'กำลังให้บริการ':t.state==='ARRIVED'?'พร้อมเริ่มบริการ':'มีคิวในขณะนี้';cur=`<div class="current"><div class="eyebrow">คิวปัจจุบัน</div><div class="bigState red">${st}</div><div class="rows"><div class="row"><span>เวลา</span><b>${tm(t.current.start)}–${tm(t.current.end)}</b></div><div class="row"><span>คอร์ส</span><b>${esc(shorten(t.current.services,38))}</b></div></div></div>${progress(t.current)}`;}else{cur=`<div class="current available"><div class="eyebrow">สถานะปัจจุบัน</div><div class="bigState green">พร้อมให้บริการ</div><div class="rows"><div class="row"><span>สถานะ</span><b>ว่างในขณะนี้</b></div>${t.next?`<div class="row"><span>ว่างถึง</span><b>${tm(t.next.start)} น.</b></div>`:'<div class="row"><span>วันนี้</span><b>ยังไม่มีคิวถัดไป</b></div>'}</div></div>`}let nxt=t.next?`<div class="next"><strong>${tm(t.next.start)}–${tm(t.next.end)} • มีคิวจองแล้ว</strong><small>${esc(shorten(t.next.services,44))}</small></div>`:`<div class="none">ยังไม่มีคิวจองเพิ่มเติมวันนี้</div>`;return `<article class="card"><div class="cardHead"><div class="person"><div class="avatar">♟</div><div class="name">${esc(t.nameTh)}<small>${esc(t.nameEn)}</small></div></div><span class="badge ${cls}">● ${badge}</span></div><div class="cardBody">${cur}<div class="nextTitle">คิวถัดไป</div>${nxt}</div></article>`}
function progress(x){const a=new Date(x.start).getTime(),b=new Date(x.end).getTime(),n=Date.now();const pct=Math.max(0,Math.min(100,((n-a)/(b-a))*100));const rem=Math.max(0,Math.ceil((b-n)/60000));return `<div class="progressBox"><div class="progressTitle"><span>ความคืบหน้าคิว</span><b>เหลือประมาณ ${rem} นาที</b></div><div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`}
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('date').textContent=d.toLocaleDateString('th-TH',{day:'2-digit',month:'long',year:'numeric'})}function tm(v){if(!v)return'-';return new Date(v).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shorten(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}function showError(s){const e=document.getElementById('error');e.textContent=s;e.style.display='block'}function hideError(){document.getElementById('error').style.display='none'}
setInterval(tick,1000);tick();loadQueue();
</script></body></html>
